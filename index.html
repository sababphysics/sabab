  host.querySelectorAll("[data-xb]").forEach(bt=>bt.addEventListener("click",()=>{tA=tB=0;nA=nB=0;trail.length=0;}));
 },
 Q:[{q:{en:"At 0.6 c, how long does one hour of the moving clock last for someone on the platform?",fr:"À 0,6 c, combien dure une heure de l'horloge en mouvement pour quelqu'un sur le quai ?"},o:[{en:"36 min",fr:"36 min"},{en:"60 min",fr:"60 min"},{en:"75 min",fr:"75 min"},{en:"100 min",fr:"100 min"}],c:2,why:{en:"γ = 1/√(1 − 0.6²) = 1.25, so 60 min × 1.25 = 75 min.",fr:"γ = 1/√(1 − 0,6²) = 1,25, donc 60 min × 1,25 = 75 min."}},
  {q:{en:"Why don't we notice this in a car or a plane?",fr:"Pourquoi ne le remarque-t-on pas en voiture ou en avion ?"},o:[{en:"It only works for light, not for objects",fr:"Ça ne marche que pour la lumière, pas pour les objets"},{en:"Our speeds are tiny compared with light, so the effect is billionths of a second",fr:"Nos vitesses sont minuscules comparées à la lumière : l'effet est de l'ordre du milliardième de seconde"},{en:"Air cancels it",fr:"L'air l'annule"}],c:1,why:{en:"A car at 100 km/h is slowed by less than half a nanosecond a day. The effect is real but far too small to feel.",fr:"Une voiture à 100 km/h retarde de moins d'une demi-nanoseconde par jour. L'effet est réel mais bien trop faible pour être ressenti."}},
  {q:{en:"From inside the moving train, whose clock seems slow?",fr:"De l'intérieur du train, quelle horloge semble retarder ?"},o:[{en:"The train's clock",fr:"Celle du train"},{en:"The platform's clock",fr:"Celle du quai"},{en:"Neither",fr:"Aucune"}],c:1,why:{en:"Each observer measures the other's clock running slow. Neither frame is special, just as in Lesson 1.",fr:"Chaque observateur mesure que l'horloge de l'autre retarde. Aucun référentiel n'est privilégié, comme dans la leçon 1."}},
  {q:{en:"GPS satellite clocks gain about 38 microseconds a day overall. What happens if engineers ignore it?",fr:"Les horloges des satellites GPS avancent au total d'environ 38 microsecondes par jour. Que se passe-t-il si on l'ignore ?"},o:[{en:"Nothing: 38 microseconds is too small to matter",fr:"Rien : 38 microsecondes, c'est négligeable"},{en:"Positions drift by kilometres a day",fr:"Les positions dérivent de plusieurs kilomètres par jour"},{en:"The satellites fall",fr:"Les satellites tombent"}],c:1,why:{en:"GPS turns time into distance with the speed of light: 38 µs × 300,000 km/s ≈ 11 km.",fr:"Le GPS convertit le temps en distance avec la vitesse de la lumière : 38 µs × 300 000 km/s ≈ 11 km."}}],
 ladAr:"هل الزمن شيء موجود بذاته، أم هو مقياس للتغيّر؟",ladEn:{en:"Does time exist by itself, or is it a measure of change?",fr:"Le temps existe-t-il en soi, ou est-il la mesure du changement ?"},
 lad:["ما هو «الزمن»؟ هل نستطيع أن نرى الزمن، أم نرى أشياء تتغيّر فقط؟","إذا كانت ساعتان صادقتان تختلفان، فأيّهما تقيس «الزمن الحقيقي»؟","هل يمرّ الوقت بالسرعة نفسها للجميع في حياتهم؟ ماذا يعني أن «يطول» يوم أو «يقصر»؟","في الفيزياء يمكن قياس الفرق بين الساعتين بدقّة. هل يمكن قياس الإحساس بالزمن؟ أين يتوقّف التشبيه؟"]},

/* ---------------- B3 gravity ---------------- */
B3:{theme:"space",link:"L3",
 intro:[{en:"For Newton, gravity is a force that pulls across empty space. It worked so well that it predicted the planet Neptune before anyone saw it. In 1915 Einstein proposed something stranger: mass bends space and time, and a falling object is not being pulled at all. It is following the straightest possible path through curved spacetime.",fr:"Pour Newton, la gravité est une force qui tire à travers le vide. Cela marchait si bien que la planète Neptune a été prédite avant d'être vue. En 1915, Einstein a proposé plus étrange : la masse courbe l'espace et le temps, et un objet qui tombe n'est pas tiré du tout. Il suit le chemin le plus droit possible dans un espace-temps courbé."},
  {en:"Einstein's version passed tests Newton's failed: the small extra turning of Mercury's orbit (43″ per century) that Newton could not explain, starlight bending around the Sun (measured during the 1919 eclipse), and gravitational waves, first detected in 2015. Yet engineers still use Newton to send rockets to the Moon. Both are used; which one is \"true\"?",fr:"La version d'Einstein a réussi des tests où celle de Newton échouait : la petite rotation supplémentaire de l'orbite de Mercure (43″ par siècle) que Newton n'expliquait pas, la lumière des étoiles déviée par le Soleil (mesurée lors de l'éclipse de 1919), et les ondes gravitationnelles, détectées pour la première fois en 2015. Pourtant les ingénieurs utilisent encore Newton pour envoyer des fusées vers la Lune. Les deux servent ; laquelle est « vraie » ?"}],
 idea:{en:"Lesson 3 asked whether a force is real. Gravity is the sharpest test: the same fall can be described as a force (Newton) or as geometry (Einstein).",fr:"La leçon 3 demandait si une force est réelle. La gravité est le test le plus fort : la même chute peut se décrire comme une force (Newton) ou comme une géométrie (Einstein)."},
 simT:{en:"Simulation: Newton's cannon",fr:"Simulation : le canon de Newton"},
 note:{en:"Newton's own thought experiment: a cannon on an imaginary mountain above the air. Real Earth radius and gravity; the animation is sped up.",fr:"L'expérience de pensée de Newton lui-même : un canon sur une montagne imaginaire au-dessus de l'air. Rayon et gravité réels de la Terre ; l'animation est accélérée."},
 sim(host,d,tx){
  d.v=d.v??6;
  host.innerHTML=xCv(900,460,tx("A cannonball fired horizontally around the Earth","Un boulet tiré horizontalement autour de la Terre"))+`<div class="xctl"><label class="f" for="xv">${tx("Launch speed","Vitesse de tir")} <b id="xvv"></b><input type="range" id="xv" min="1" max="12" step="0.1" value="${d.v}"></label>
   <div class="row" style="gap:6px"><button class="btn" id="xfire">${tx("Fire","Tirer")}</button><button class="btn ghost" id="xclr">${tx("Clear paths","Effacer")}</button></div></div><div class="xread" id="xread"></div>`;
  const GM=398600,Re=6371,h=400,r0=Re+h; const vc=Math.sqrt(GM/r0),ve=Math.sqrt(2*GM/r0);
  const upd=()=>{$("#xvv").textContent=nf(d.v,1)+" km/s";$("#xread").innerHTML=`<div><small>${tx("Circular orbit speed at this height","Vitesse d'orbite circulaire à cette hauteur")}</small><b class="mono">${nf(vc,2)} km/s</b></div><div><small>${tx("Escape speed from this height","Vitesse de libération depuis cette hauteur")}</small><b class="mono">${nf(ve,2)} km/s</b></div><div><small>${tx("Gravity at 400 km (the space station's height)","Gravité à 400 km (hauteur de la station spatiale)")}</small><b class="mono">${nf(9.81*(Re/r0)**2,2)} N/kg (${nf(100*(Re/r0)**2,0)} %)</b></div>`;};
  $("#xv").oninput=e=>{d.v=+e.target.value;save();upd();};upd();
  const c=$("#xcv").getContext("2d");const paths=[];let shot=null;
  $("#xfire").onclick=()=>{shot={x:0,y:r0,vx:d.v,vy:0,pts:[],done:false,t:0};paths.push(shot);if(paths.length>6)paths.shift();};
  $("#xclr").onclick=()=>{paths.length=0;shot=null;};
  const S=150/Re,cx=450,cy=250;
  xLoop($("#xcv"),dt=>{const W=900,H=460;c.fillStyle="#0B1226";c.fillRect(0,0,W,H);xStars(c,W,H,70);
   if(shot&&!shot.done){const hs=2;const steps=Math.ceil((XRM()?300:1000)*dt/hs);for(let i=0;i<steps;i++){const r=Math.hypot(shot.x,shot.y);const a=-GM/(r*r*r);shot.vx+=a*shot.x*hs;shot.vy+=a*shot.y*hs;shot.x+=shot.vx*hs;shot.y+=shot.vy*hs;shot.t+=hs;
     shot.pts.push([shot.x,shot.y]);const rr2=Math.hypot(shot.x,shot.y);if(rr2<Re){shot.done=true;break;}if(rr2>60000||shot.t>6e4){shot.done=true;break;}}}
   // earth
   const gr=c.createRadialGradient(cx-40,cy-40,20,cx,cy,150);gr.addColorStop(0,"#4C93AE");gr.addColorStop(1,"#1F4E66");c.fillStyle=gr;c.beginPath();c.arc(cx,cy,150,0,7);c.fill();
   c.fillStyle="#3F6B3A";c.beginPath();c.ellipse(cx+30,cy-20,50,30,0.4,0,7);c.fill();c.beginPath();c.ellipse(cx-60,cy+50,40,22,-0.3,0,7);c.fill();
   // mountain
   c.fillStyle="#8A7A6A";c.beginPath();c.moveTo(cx-18,cy-148);c.lineTo(cx,cy-150-h*S);c.lineTo(cx+18,cy-148);c.fill();
   paths.forEach((p,k)=>{c.strokeStyle=k===paths.length-1?"#FFD166":"rgba(255,209,102,.35)";c.lineWidth=2;c.beginPath();c.moveTo(cx,cy-r0*S);p.pts.forEach(([x,y])=>c.lineTo(cx+x*S,cy-y*S));c.stroke();
     const last=p.pts[p.pts.length-1];if(last){c.fillStyle="#fff";c.beginPath();c.arc(cx+last[0]*S,cy-last[1]*S,4,0,7);c.fill();}});
   c.lineWidth=1;c.fillStyle="rgba(255,255,255,.7)";c.font="13px system-ui";c.fillText(tx("Too slow: falls back. Just right: keeps falling around the Earth forever. Too fast: escapes.","Trop lent : il retombe. Juste bien : il tombe autour de la Terre pour toujours. Trop rapide : il s'échappe."),20,H-18);
  });
 },
 Q:[{q:{en:"Fire at about 7.7 km/s. What happens?",fr:"Tire à environ 7,7 km/s. Que se passe-t-il ?"},o:[{en:"It lands on the far side",fr:"Il atterrit de l'autre côté"},{en:"It circles the Earth: it keeps falling but the ground keeps curving away",fr:"Il fait le tour de la Terre : il tombe sans cesse mais le sol se courbe sous lui"},{en:"It leaves the Earth forever",fr:"Il quitte la Terre pour toujours"}],c:1,why:{en:"An orbit is a fall that never reaches the ground. That is Newton's great insight.",fr:"Une orbite est une chute qui n'atteint jamais le sol. C'est la grande intuition de Newton."}},
  {q:{en:"Gravity at the space station's height is about 89% of what we feel. So why do astronauts float?",fr:"À la hauteur de la station spatiale, la gravité vaut environ 89 % de celle que nous ressentons. Alors pourquoi les astronautes flottent-ils ?"},o:[{en:"There is no gravity in space",fr:"Il n'y a pas de gravité dans l'espace"},{en:"They and the station fall together, so nothing presses them against the floor",fr:"Eux et la station tombent ensemble, donc rien ne les presse contre le sol"},{en:"The station's engines push them up",fr:"Les moteurs de la station les poussent vers le haut"}],c:1,why:{en:"Weightlessness is free fall. Einstein called this realisation \"the happiest thought of my life\" and built general relativity on it.",fr:"L'apesanteur, c'est la chute libre. Einstein a appelé cette idée « la pensée la plus heureuse de ma vie » et a bâti la relativité générale dessus."}},
  {q:{en:"Which 1919 observation made headlines as support for Einstein over Newton?",fr:"Quelle observation de 1919 a fait les gros titres en donnant raison à Einstein contre Newton ?"},o:[{en:"Starlight bending around the Sun during an eclipse",fr:"La lumière des étoiles déviée par le Soleil pendant une éclipse"},{en:"Apples falling faster",fr:"Des pommes tombant plus vite"},{en:"The first satellite",fr:"Le premier satellite"}],c:0,why:{en:"The measured bending matched Einstein's prediction, about twice Newton's.",fr:"La déviation mesurée correspondait à la prédiction d'Einstein, environ le double de celle de Newton."}},
  {q:{en:"Engineers still use Newton's law for most spaceflight. What does that tell us?",fr:"Les ingénieurs utilisent encore la loi de Newton pour la plupart des vols spatiaux. Qu'est-ce que cela nous dit ?"},o:[{en:"Einstein was wrong",fr:"Einstein avait tort"},{en:"A model can be extremely useful inside its limits, even when a deeper one exists",fr:"Un modèle peut être très utile dans ses limites, même quand un modèle plus profond existe"},{en:"Physics is just opinion",fr:"La physique n'est qu'une opinion"}],c:1,why:{en:"Newton is Einstein's theory at low speeds and weak gravity. Remember Lesson 5: ideal models as useful tools.",fr:"Newton, c'est la théorie d'Einstein aux faibles vitesses et gravités. Souviens-toi de la leçon 5 : les modèles idéaux comme outils utiles."}}],
 ladAr:"إذا نجحت نظريّتان في التنبّؤ، فأيّهما «الحقيقة»؟",ladEn:{en:"If two theories both predict well, which one is \"the truth\"?",fr:"Si deux théories prédisent bien, laquelle est « la vérité » ?"},
 lad:["ما الفرق بين أن تكون النظرية «صحيحة» وأن تكون «مفيدة»؟","نيوتن يقول قوّة، وأينشتاين يقول انحناء. ما الذي يتغيّر في الواقع حين تتغيّر النظرية؟","هل تعرف في حياتك تفسيرين مختلفين للحدث نفسه، وكلاهما يعمل؟","في العلم نختبر النظريات بالقياس. هل كلّ ما هو «حقيقي» قابل للقياس؟ أين تقف حدود الاختبار؟"]},

/* ---------------- B4 pulsars ---------------- */
B4:{theme:"space",link:"L8",
 intro:[{en:"In 1967 a PhD student, Jocelyn Bell Burnell, noticed a radio signal pulsing every 1.3 seconds, as regular as a clock. The team half-jokingly labelled it LGM-1, \"Little Green Men\". It was a pulsar: the collapsed core of a dead star, heavier than the Sun but only about 20 km across, spinning and sweeping a beam across space like a lighthouse.",fr:"En 1967, une doctorante, Jocelyn Bell Burnell, remarque un signal radio qui pulse toutes les 1,3 secondes, régulier comme une horloge. L'équipe le surnomme à moitié en riant LGM-1, « petits hommes verts ». C'était un pulsar : le cœur effondré d'une étoile morte, plus lourd que le Soleil mais large d'environ 20 km seulement, qui tourne et balaie l'espace d'un faisceau comme un phare."},
  {en:"Why so fast? A spinning object that shrinks spins faster, like a skater pulling in her arms. The Crab pulsar, born in a supernova seen in 1054, turns about 30 times a second. The fastest known turns 716 times a second, but these \"millisecond pulsars\" were spun up much later by gas falling onto them from a companion star.",fr:"Pourquoi si vite ? Un objet en rotation qui se contracte tourne plus vite, comme une patineuse qui ramène ses bras. Le pulsar du Crabe, né d'une supernova observée en 1054, fait environ 30 tours par seconde. Le plus rapide connu en fait 716, mais ces « pulsars millisecondes » ont été accélérés bien plus tard par du gaz tombant sur eux depuis une étoile compagne."}],
 idea:{en:"Lesson 8 showed that the moment of inertia I_Δ grows with r². If nothing twists the star from outside, I_Δ·ω stays constant: shrink r, and ω must grow. (This conservation law is beyond the Grade 11 programme.)",fr:"La leçon 8 a montré que le moment d'inertie I_Δ croît avec r². Si rien ne tord l'étoile de l'extérieur, I_Δ·ω reste constant : si r diminue, ω doit augmenter. (Cette loi de conservation dépasse le programme de 1re.)"},
 simT:{en:"Simulation: shrink a star",fr:"Simulation : contracte une étoile"},
 note:{en:"Starting star: the Sun's size, turning once every 25 days. The animation cannot show thousands of turns a second, so it caps the visible spin; the numbers are real. Real collapsing stars also lose some spin on the way. (The Sun itself will end as a white dwarf; neutron stars form when the core of a star of more than about 8 Suns collapses.)",fr:"Étoile de départ : la taille du Soleil, un tour tous les 25 jours. L'animation ne peut pas montrer des milliers de tours par seconde, elle limite la rotation visible ; les nombres sont réels. Les vraies étoiles perdent aussi un peu de rotation en s'effondrant. (Le Soleil lui-même finira en naine blanche ; les étoiles à neutrons naissent de l'effondrement du cœur d'étoiles de plus d'environ 8 Soleils.)"},
 sim(host,d,tx){
  d.lr=d.lr??5.84;
  host.innerHTML=xCv(900,420,tx("A star shrinking and spinning faster, with a lighthouse beam","Une étoile qui se contracte et tourne plus vite, avec un faisceau de phare"))+`<div class="xctl"><label class="f" for="xr">${tx("Radius","Rayon")} <b id="xrv"></b><input type="range" id="xr" min="1" max="5.843" step="0.001" value="${d.lr}" style="direction:rtl"></label>
   <div class="row" style="gap:6px"><button class="sbtn ghost" data-xr="5.843">${tx("The Sun","Le Soleil")}</button><button class="sbtn ghost" data-xr="3.8">${tx("White dwarf (Earth size)","Naine blanche (taille de la Terre)")}</button><button class="sbtn ghost" data-xr="1">${tx("Neutron star (10 km)","Étoile à neutrons (10 km)")}</button></div></div><div class="xread" id="xread"></div>`;
  const R0=696000,T0=25*86400;
  const st=()=>{const R=Math.pow(10,d.lr);const f=(R0/R)**2;const T=T0/f;return {R,T,rps:1/T};};
  const upd=()=>{const s=st();$("#xrv").textContent=nf(s.R,s.R<100?0:0)+" km";
   $("#xread").innerHTML=`<div><small>${tx("Spin speeds up by","La rotation s'accélère de")}</small><b class="mono">× ${(R0/s.R)**2>1e6?((R0/s.R)**2).toExponential(1):nf((R0/s.R)**2,0)}</b></div>
    <div><small>${tx("One turn takes","Un tour dure")}</small><b class="mono">${s.T>86400?nf(s.T/86400,1)+" "+tx("days","jours"):s.T>60?nf(s.T/60,1)+" min":s.T>1?nf(s.T,1)+" s":nf(s.T*1000,2)+" ms"}</b></div>
    <div><small>${tx("Turns per second","Tours par seconde")}</small><b class="mono">${s.rps<0.01?s.rps.toExponential(1):nf(s.rps,s.rps<10?2:0)}</b></div>`;};
  $("#xr").oninput=e=>{d.lr=+e.target.value;save();upd();};host.querySelectorAll("[data-xr]").forEach(b=>b.onclick=()=>{d.lr=+b.dataset.xr;$("#xr").value=d.lr;save();upd();});upd();
  const c=$("#xcv").getContext("2d");let ang=0;const pulses=[];let lastBeam=0,tt=0;
  xLoop($("#xcv"),dt=>{const W=900,H=420;tt+=dt;c.fillStyle="#0B1226";c.fillRect(0,0,W,H);xStars(c,W,H,80);
   const s=st();const vis=Math.min(s.rps,XRM()?0.3:1.2)+0.05*(d.lr<5?1:0);ang+=2*Math.PI*vis*dt;
   const rad=18+120*(d.lr-1)/4.843;const cx=300,cy=200;
   // beams
   if(d.lr<3){c.save();c.translate(cx,cy);c.rotate(ang);const bg=c.createLinearGradient(0,0,0,-400);bg.addColorStop(0,"rgba(159,197,255,.7)");bg.addColorStop(1,"rgba(159,197,255,0)");c.fillStyle=bg;
     c.beginPath();c.moveTo(0,0);c.lineTo(-26,-400);c.lineTo(26,-400);c.fill();c.rotate(Math.PI);c.beginPath();c.moveTo(0,0);c.lineTo(-26,-400);c.lineTo(26,-400);c.fill();c.restore();
     const aa=((ang%(Math.PI))+Math.PI)%Math.PI;if(Math.abs(aa-Math.PI/2)<0.12&&tt-lastBeam>0.15){pulses.push(tt);lastBeam=tt;}}
   const col=d.lr>4?"#FFE7A8":d.lr>2.5?"#E8F0FF":"#BFD6FF";const g=c.createRadialGradient(cx,cy,rad*0.2,cx,cy,rad*1.6);g.addColorStop(0,col);g.addColorStop(0.6,col);g.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=g;c.beginPath();c.arc(cx,cy,rad*1.6,0,7);c.fill();
   c.fillStyle="rgba(120,90,40,.55)";c.beginPath();c.arc(cx+Math.cos(ang)*rad*0.6,cy+Math.sin(ang)*rad*0.3,Math.max(3,rad*0.18),0,7);c.fill();
   // detector on Earth (right)
   c.fillStyle="#7FB2E5";c.beginPath();c.arc(820,200,14,0,7);c.fill();c.fillStyle="rgba(255,255,255,.75)";c.font="13px system-ui";c.textAlign="center";c.fillText(tx("Our radio telescope","Notre radiotélescope"),820,236);c.textAlign="left";
   c.strokeStyle="rgba(255,255,255,.3)";c.beginPath();c.moveTo(560,340);c.lineTo(880,340);c.stroke();
   while(pulses.length&&tt-pulses[0]>4)pulses.shift();pulses.forEach(p=>{const x=880-(tt-p)*80;c.fillStyle="#9EC5FF";c.fillRect(x,300,3,40);});
   c.fillStyle="rgba(255,255,255,.6)";c.fillText(d.lr<3?tx("Pulses received","Impulsions reçues"):tx("Shrink the star to see a beam","Contracte l'étoile pour voir un faisceau"),560,366);
  });
 },
 Q:[{q:{en:"If a spinning star's radius is halved (nothing else changes), its spin becomes…",fr:"Si le rayon d'une étoile en rotation est divisé par deux (rien d'autre ne change), sa rotation devient…"},o:[{en:"2 times faster",fr:"2 fois plus rapide"},{en:"4 times faster",fr:"4 fois plus rapide"},{en:"half as fast",fr:"2 fois plus lente"}],c:1,why:{en:"I_Δ ∝ r², so halving r divides I_Δ by 4; to keep I_Δ·ω constant, ω is multiplied by 4.",fr:"I_Δ ∝ r², donc diviser r par 2 divise I_Δ par 4 ; pour garder I_Δ·ω constant, ω est multiplié par 4."}},
  {q:{en:"Shrink the Sun to 10 km in the simulation. The result is faster than any real pulsar (716 turns/s). Why?",fr:"Contracte le Soleil jusqu'à 10 km. Le résultat dépasse tout pulsar réel (716 tours/s). Pourquoi ?"},o:[{en:"The simulation is wrong",fr:"La simulation est fausse"},{en:"Real stars lose spin as they collapse and afterwards; the very fastest pulsars were spun up later by a companion star",fr:"Les vraies étoiles perdent de la rotation pendant et après l'effondrement ; les pulsars les plus rapides ont été accélérés plus tard par une étoile compagne"},{en:"Neutron stars do not spin",fr:"Les étoiles à neutrons ne tournent pas"}],c:1,why:{en:"The simple model assumes nothing is lost. Reality adds friction-like effects, a lesson from Lesson 5.",fr:"Le modèle simple suppose que rien n'est perdu. La réalité ajoute des effets comparables au frottement, comme dans la leçon 5."}},
  {q:{en:"Who first noticed the pulsar signal in 1967?",fr:"Qui a remarqué le premier signal de pulsar en 1967 ?"},o:[{en:"Albert Einstein",fr:"Albert Einstein"},{en:"Jocelyn Bell Burnell, a PhD student",fr:"Jocelyn Bell Burnell, une doctorante"},{en:"A satellite",fr:"Un satellite"}],c:1,why:{en:"Her careful look at hundreds of metres of chart paper found a tiny regular \"scruff\" others might have ignored.",fr:"Son examen attentif de centaines de mètres de papier d'enregistrement a révélé un petit signal régulier que d'autres auraient pu ignorer."}},
  {q:{en:"A pulsar's pulses arrive as regularly as a clock. What does the regularity tell us?",fr:"Les impulsions d'un pulsar arrivent avec la régularité d'une horloge. Que nous dit cette régularité ?"},o:[{en:"Someone is sending a message",fr:"Quelqu'un envoie un message"},{en:"A very heavy object spins very steadily: its huge moment of inertia resists change",fr:"Un objet très lourd tourne très régulièrement : son énorme moment d'inertie résiste au changement"},{en:"Nothing",fr:"Rien"}],c:1,why:{en:"Regular does not mean designed by aliens. Lesson 8: a large I_Δ makes rotation hard to change.",fr:"Régulier ne veut pas dire fabriqué par des extraterrestres. Leçon 8 : un grand I_Δ rend la rotation difficile à modifier."}}],
 ladAr:"ما الذي يبقى ثابتًا حين يتغيّر كلّ شيء؟",ladEn:{en:"What stays the same when everything changes?",fr:"Qu'est-ce qui reste constant quand tout change ?"},
 lad:["ما معنى أن «يُحفَظ» شيء بينما يتغيّر شكله؟","النجم ينكمش ويتسارع، لكنّ شيئًا فيه يبقى محفوظًا. ما هو؟ ولماذا يهمّ العلماء ما يبقى أكثر ممّا يتغيّر؟","ظنّ الفريق أنّ الإشارة رسالة من كائنات أخرى. لماذا نميل إلى رؤية القصد في كلّ انتظام؟","الانتظام في الفيزياء يُفسَّر بقانون. هل كلّ انتظام في الحياة يُفسَّر بقانون؟ أين يتوقّف التشبيه؟"]},

/* ---------------- B5 matter ---------------- */
B5:{theme:"matter",
 intro:[{en:"Everything around you is made of atoms, about a ten-billionth of a metre across. Each atom is almost entirely empty: it is 10,000 to 100,000 times wider than its nucleus. If the nucleus were a marble, the atom would be the size of a stadium, or even a kilometre. The nucleus is made of protons and neutrons, and each of those is made of three quarks held together by gluons; most of a proton's mass comes from that binding energy. Electrons and quarks have no measured size at all.",fr:"Tout ce qui t'entoure est fait d'atomes, d'environ un dix-milliardième de mètre. Chaque atome est presque entièrement vide : il est 10 000 à 100 000 fois plus large que son noyau. Si le noyau était une bille, l'atome aurait la taille d'un stade, voire d'un kilomètre. Le noyau est fait de protons et de neutrons, et chacun d'eux de trois quarks liés par des gluons ; l'essentiel de la masse du proton vient de cette énergie de liaison. Les électrons et les quarks n'ont aucune taille mesurée."},
  {en:"The question is old. Greek philosophers called the smallest piece atomos, \"uncuttable\". Muslim theologians of kalām argued about al-juzʾ alladhī lā yatajazzaʾ, \"the part that cannot be divided\". In 2012, experiments at CERN confirmed the Higgs boson, the last missing piece of today's Standard Model. Is it the end? Nobody knows.",fr:"La question est ancienne. Les philosophes grecs appelaient le plus petit morceau atomos, « insécable ». Les théologiens musulmans du kalām discutaient d'al-juzʾ alladhī lā yatajazzaʾ, « la partie qui ne peut être divisée ». En 2012, des expériences au CERN ont confirmé le boson de Higgs, dernière pièce manquante du Modèle standard actuel. Est-ce la fin ? Personne ne le sait."}],
 simT:{en:"Simulation: zoom into a grain of salt",fr:"Simulation : zoom dans un grain de sel"},
 note:{en:"Each step of the slider is a factor of 10. Pictures are simplified: electrons do not orbit like planets, and quarks are not little balls.",fr:"Chaque cran du curseur est un facteur 10. Les images sont simplifiées : les électrons ne tournent pas comme des planètes, et les quarks ne sont pas de petites boules."},
 sim(host,d,tx){
  d.z=d.z??-3;
  host.innerHTML=xCv(900,420,tx("Zooming from a grain of salt to quarks","Zoom d'un grain de sel jusqu'aux quarks"))+`<div class="xctl"><label class="f" for="xz">${tx("Scale","Échelle")} <b id="xzv"></b><input type="range" id="xz" min="-18" max="-3" step="0.05" value="${d.z}" style="direction:rtl"></label></div><div class="xread" id="xread"></div>`;
  const lv=[[-3,tx("A grain of salt","Un grain de sel"),tx("About 1 mm: you can just see it.","Environ 1 mm : on le voit tout juste.")],[-6,tx("A bacterium","Une bactérie"),tx("A few micrometres. Only a microscope shows it.","Quelques micromètres. Seul un microscope la montre.")],[-9,tx("The salt crystal","Le cristal de sel"),tx("Sodium and chlorine atoms stacked in a perfect cube pattern.","Des atomes de sodium et de chlore empilés en cubes parfaits.")],[-10,tx("One atom","Un atome"),tx("A cloud of electrons around a tiny nucleus. Almost all empty.","Un nuage d'électrons autour d'un noyau minuscule. Presque entièrement vide.")],[-14,tx("The nucleus","Le noyau"),tx("Protons and neutrons packed tight: nearly all the atom's mass.","Protons et neutrons serrés : presque toute la masse de l'atome.")],[-15,tx("One proton","Un proton"),tx("Two up quarks and one down quark, held by the strong force.","Deux quarks up et un quark down, liés par l'interaction forte.")],[-18,tx("A quark","Un quark"),tx("No size measured: smaller than 10⁻¹⁸ m, if it has a size at all.","Aucune taille mesurée : plus petit que 10⁻¹⁸ m, s'il a une taille.")]];
  const cur=()=>{let k=0;lv.forEach((l,i)=>{if(d.z<=l[0]+0.5)k=i;});return k;};
  const upd=()=>{const k=cur();$("#xzv").textContent="10^"+nf(d.z,1)+" m";$("#xread").innerHTML=`<div><small>${tx("You are looking at","Tu regardes")}</small><b>${lv[k][1]}</b></div><div style="grid-column:span 2"><small>${tx("What we know","Ce que l'on sait")}</small><b style="font-weight:500">${lv[k][2]}</b></div>`;};
  $("#xz").oninput=e=>{d.z=+e.target.value;save();upd();};upd();
  const c=$("#xcv").getContext("2d");let tt=0;
  xLoop($("#xcv"),dt=>{tt+=dt;const W=900,H=420,cx=450,cy=200;c.fillStyle="#0E1320";c.fillRect(0,0,W,H);const k=cur();const z=d.z;
   const fade=(a,b)=>Math.max(0,Math.min(1,1-Math.abs(z-a)/b));
   c.globalAlpha=fade(-3,1.6);c.fillStyle="#EDEDED";c.beginPath();c.moveTo(cx-90,cy-60);c.lineTo(cx+80,cy-80);c.lineTo(cx+100,cy+70);c.lineTo(cx-70,cy+90);c.closePath();c.fill();
   c.globalAlpha=fade(-6,1.6);c.fillStyle="#7FB27A";c.beginPath();c.ellipse(cx,cy,120,50,0.2,0,7);c.fill();c.strokeStyle="#7FB27A";c.lineWidth=3;c.beginPath();c.moveTo(cx+115,cy+20);c.quadraticCurveTo(cx+170,cy+60+Math.sin(tt*4)*10,cx+220,cy+30);c.stroke();
   c.globalAlpha=fade(-9,1.2);for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){c.fillStyle=(i+j)%2?"#9EC5FF":"#7ED08A";c.beginPath();c.arc(cx+i*44+(j%2?0:0),cy+j*44,(i+j)%2?16:11,0,7);c.fill();}
   c.globalAlpha=fade(-10.5,1.4);const eg=c.createRadialGradient(cx,cy,4,cx,cy,170);eg.addColorStop(0,"rgba(158,197,255,.05)");eg.addColorStop(0.5,"rgba(158,197,255,.28)");eg.addColorStop(1,"rgba(158,197,255,0)");c.fillStyle=eg;c.beginPath();c.arc(cx,cy,170,0,7);c.fill();c.fillStyle="#FFD166";c.beginPath();c.arc(cx,cy,2.5,0,7);c.fill();
   c.globalAlpha=fade(-14,1.2);for(let i=0;i<12;i++){const a=i*2.4,r=18*Math.sqrt(i);c.fillStyle=i%2?"#E8664E":"#B8BEC8";c.beginPath();c.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,22,0,7);c.fill();}
   c.globalAlpha=fade(-15.5,1.1);c.fillStyle="rgba(232,102,78,.25)";c.beginPath();c.arc(cx,cy,150,0,7);c.fill();[[0,-60,"#E23B2E","u"],[-55,40,"#2D8A55","u"],[55,40,"#2D4BD8","d"]].forEach(([x,y,col,l],i)=>{const jx=Math.sin(tt*3+i)*6,jy=Math.cos(tt*2.3+i)*6;c.fillStyle=col;c.beginPath();c.arc(cx+x+jx,cy+y+jy,22,0,7);c.fill();c.fillStyle="#fff";c.font="700 18px system-ui";c.textAlign="center";c.textBaseline="middle";c.fillText(l,cx+x+jx,cy+y+jy);});c.textBaseline="alphabetic";
   c.globalAlpha=fade(-18,1.4);c.fillStyle="#E23B2E";c.beginPath();c.arc(cx,cy,3,0,7);c.fill();c.fillStyle="#fff";c.font="600 16px system-ui";c.textAlign="center";c.fillText("?",cx,cy-24);
   c.globalAlpha=1;c.textAlign="left";
   // scale bar
   c.fillStyle="rgba(255,255,255,.8)";c.fillRect(40,H-40,160,3);c.font="600 14px system-ui";c.fillText("≈ 10^"+Math.round(d.z)+" m",40,H-50);
   c.fillStyle="rgba(255,255,255,.55)";c.font="13px system-ui";c.fillText(lv[k][1],W-40-c.measureText(lv[k][1]).width,H-40);
  });
 },
 Q:[{q:{en:"If an atom's nucleus were a marble, how wide would the whole atom be?",fr:"Si le noyau d'un atome était une bille, quelle serait la largeur de l'atome ?"},o:[{en:"A football",fr:"Un ballon"},{en:"A house",fr:"Une maison"},{en:"A stadium, up to about a kilometre",fr:"Un stade, jusqu'à environ un kilomètre"}],c:2,why:{en:"The atom is 10,000 to 100,000 times wider than its nucleus: 1 cm × 10,000 = 100 m, 1 cm × 100,000 = 1 km.",fr:"L'atome est 10 000 à 100 000 fois plus large que son noyau : 1 cm × 10 000 = 100 m, 1 cm × 100 000 = 1 km."}},
  {q:{en:"If atoms are almost empty, why can't your hand pass through the table?",fr:"Si les atomes sont presque vides, pourquoi ta main ne traverse-t-elle pas la table ?"},o:[{en:"The nuclei touch",fr:"Les noyaux se touchent"},{en:"Electric repulsion between electrons, together with a quantum rule (the Pauli principle) that stops electrons crowding into the same state",fr:"La répulsion électrique entre électrons, avec une règle quantique (le principe de Pauli) qui empêche les électrons de s'entasser dans le même état"},{en:"Gravity holds it",fr:"La gravité la retient"}],c:1,why:{en:"The \"solid\" feeling is a force. Back to Lesson 3: when you touch, what you feel is an interaction, not a surface.",fr:"La sensation de « solide » est une force. Retour à la leçon 3 : quand tu touches, tu ressens une interaction, pas une surface."}},
  {q:{en:"A proton is made of…",fr:"Un proton est fait de…"},o:[{en:"two up quarks and one down quark",fr:"deux quarks up et un quark down"},{en:"three electrons",fr:"trois électrons"},{en:"nothing smaller",fr:"rien de plus petit"}],c:0,why:{en:"A neutron is the opposite recipe: one up and two down.",fr:"Le neutron est la recette inverse : un up et deux down."}},
  {q:{en:"What did CERN confirm in 2012?",fr:"Qu'a confirmé le CERN en 2012 ?"},o:[{en:"The Higgs boson",fr:"Le boson de Higgs"},{en:"The electron",fr:"L'électron"},{en:"That quarks are made of smaller parts",fr:"Que les quarks sont faits de parties plus petites"}],c:0,why:{en:"It completed the Standard Model. Whether quarks have parts is still an open question.",fr:"Il a complété le Modèle standard. Savoir si les quarks ont des parties reste une question ouverte."}}],
 ladAr:"هل يوجد «أصغر شيء»؟",ladEn:{en:"Is there a smallest thing?",fr:"Existe-t-il une plus petite chose ?"},
 lad:["ما معنى أن يكون الشيء «بسيطًا» لا أجزاء له؟","كلّما ظنّ العلماء أنّهم وصلوا إلى الأصغر، وجدوا أصغر منه. هل هذه السلسلة تنتهي؟","الطاولة صلبة لكنّها في أغلبها فراغ. هل ما نراه بأعيننا «خطأ»، أم نوع آخر من الحقيقة؟","في الفيزياء نقسّم المادّة لنفهمها. هل نفهم الإنسان إذا قسّمناه إلى أجزاء؟ أين يتوقّف التشبيه؟"]},

/* ---------------- B6 sun ---------------- */
B6:{theme:"matter",link:"L10",
 intro:[{en:"In the Sun's core, at about 15 million degrees, hydrogen nuclei fuse into helium. The helium weighs about 0.7% less than the hydrogen that made it. That missing mass is not destroyed: it becomes energy, E = mc², where c² is enormous (9 × 10¹⁶ m²/s²).",fr:"Au cœur du Soleil, à environ 15 millions de degrés, des noyaux d'hydrogène fusionnent en hélium. L'hélium pèse environ 0,7 % de moins que l'hydrogène qui l'a formé. Cette masse manquante n'est pas détruite : elle devient énergie, E = mc², où c² est énorme (9 × 10¹⁶ m²/s²)."},
  {en:"Every second the Sun turns about 4 million tonnes of its mass into light. The light you see now left the Sun about 8 minutes and 20 seconds ago. The Sun has enough hydrogen to shine like this for roughly another 5 billion years.",fr:"Chaque seconde, le Soleil transforme environ 4 millions de tonnes de sa masse en lumière. La lumière que tu vois maintenant a quitté le Soleil il y a environ 8 minutes et 20 secondes. Le Soleil a assez d'hydrogène pour briller ainsi encore environ 5 milliards d'années."}],
 idea:{en:"Lesson 10 said energy is conserved. Einstein widened the rule: mass is part of the energy account. Nothing is lost; mass and energy are two faces of one quantity.",fr:"La leçon 10 disait que l'énergie se conserve. Einstein a élargi la règle : la masse fait partie du bilan d'énergie. Rien n'est perdu ; masse et énergie sont deux faces d'une même grandeur."},
 simT:{en:"Simulation: E = mc² calculator and the Sun's mass counter",fr:"Simulation : calculateur E = mc² et compteur de masse du Soleil"},
 note:{en:"Comparisons use about 42 billion joules per tonne of oil. Converting mass completely to energy happens only in special reactions; fusion converts 0.7%.",fr:"Les comparaisons utilisent environ 42 milliards de joules par tonne de pétrole. Convertir entièrement une masse en énergie n'arrive que dans des réactions particulières ; la fusion en convertit 0,7 %."},
 sim(host,d,tx){
  d.lm=d.lm??-3;
  host.innerHTML=xCv(900,380,tx("The Sun losing mass every second","Le Soleil qui perd de la masse chaque seconde"))+`<div class="xctl"><label class="f" for="xm2">${tx("Mass turned into energy","Masse transformée en énergie")} <b id="xmv2"></b><input type="range" id="xm2" min="-6" max="0" step="0.05" value="${d.lm}"></label></div><div class="xread" id="xread"></div>`;
  const upd=()=>{const m=Math.pow(10,d.lm);const E=m*9e16;$("#xmv2").textContent=m>=1?nf(m,0)+" kg":m>=1e-3?nf(m*1000,m*1000<10?1:0)+" g":nf(m*1e6,m*1e6<10?1:0)+" mg";
   $("#xread").innerHTML=`<div><small>${tx("Energy","Énergie")}</small><b class="mono">${E.toExponential(2)} J</b></div><div><small>${tx("Same as burning","Autant que brûler")}</small><b class="mono">${E/4.2e10>=1?nf(E/4.2e10,0)+" t":nf(E/4.2e7,0)+" kg"} ${tx("of oil","de pétrole")}</b></div><div><small>${tx("A 1 kW heater could run for","Un radiateur de 1 kW pourrait fonctionner")}</small><b class="mono">${E/1000/3.156e7>=1?nf(E/1000/3.156e7,0)+" "+tx("years","ans"):nf(E/1000/86400,0)+" "+tx("days","jours")}</b></div>`;};
  $("#xm2").oninput=e=>{d.lm=+e.target.value;save();upd();};upd();
  const c=$("#xcv").getContext("2d");let tt=0;const ph=[];
  xLoop($("#xcv"),dt=>{tt+=dt;const W=900,H=380;c.fillStyle="#0B1226";c.fillRect(0,0,W,H);xStars(c,W,H,60);
   const cx=220,cy=190;const g=c.createRadialGradient(cx,cy,10,cx,cy,150);g.addColorStop(0,"#FFF6D8");g.addColorStop(0.35,"#FFD166");g.addColorStop(0.7,"#F2A233");g.addColorStop(1,"rgba(242,162,51,0)");c.fillStyle=g;c.beginPath();c.arc(cx,cy,150,0,7);c.fill();
   c.fillStyle="rgba(255,255,255,.85)";c.beginPath();c.arc(cx,cy,26,0,7);c.fill();c.fillStyle="#8A5A2B";c.font="600 12px system-ui";c.textAlign="center";c.fillText(tx("core","cœur"),cx,cy+4);
   if(Math.random()<dt*20)ph.push({x:cx+Math.random()*20,y:cy+(Math.random()-0.5)*40,t:0});ph.forEach(p=>{p.t+=dt;p.x+=380*dt;});while(ph.length&&ph[0].x>W)ph.shift();ph.forEach(p=>{c.fillStyle="rgba(255,231,168,.8)";c.fillRect(p.x,p.y,10,2);});
   c.textAlign="left";c.fillStyle="#fff";c.font="700 22px system-ui";c.fillText(tx("Mass the Sun has turned into light","Masse que le Soleil a changée en lumière"),450,120);
   c.font="700 40px ui-monospace,monospace";c.fillStyle="#FFD166";c.fillText(nf(tt*4.26e6,0)+" t",450,180);
   c.font="14px system-ui";c.fillStyle="rgba(255,255,255,.7)";c.fillText(tx("since you opened this simulation","depuis que tu as ouvert cette simulation"),450,210);c.fillText(tx("(about 4.26 million tonnes every second)","(environ 4,26 millions de tonnes par seconde)"),450,230);
   c.fillText(tx("4 hydrogen nuclei → 1 helium nucleus + energy","4 noyaux d'hydrogène → 1 noyau d'hélium + énergie"),450,280);
   c.fillText(tx("0.7% of the mass becomes energy","0,7 % de la masse devient énergie"),450,304);
  });
 },
 Q:[{q:{en:"About how much mass does the Sun turn into energy every second?",fr:"Environ quelle masse le Soleil transforme-t-il en énergie chaque seconde ?"},o:[{en:"4 kilograms",fr:"4 kilogrammes"},{en:"4 thousand tonnes",fr:"4 mille tonnes"},{en:"4 million tonnes",fr:"4 millions de tonnes"}],c:2,why:{en:"And yet in 4.6 billion years it has used only a tiny fraction of its mass.",fr:"Et pourtant, en 4,6 milliards d'années, il n'a utilisé qu'une infime partie de sa masse."}},
  {q:{en:"Use the slider: 1 gram of mass fully turned into energy equals roughly how much oil?",fr:"Utilise le curseur : 1 gramme de masse entièrement converti équivaut à combien de pétrole environ ?"},o:[{en:"1 litre",fr:"1 litre"},{en:"About 2 tonnes",fr:"Environ 2 tonnes"},{en:"About 2,000 tonnes",fr:"Environ 2 000 tonnes"}],c:2,why:{en:"9 × 10¹³ J ÷ 4.2 × 10¹⁰ J per tonne ≈ 2,100 tonnes. That is why c² matters.",fr:"9 × 10¹³ J ÷ 4,2 × 10¹⁰ J par tonne ≈ 2 100 tonnes. D'où l'importance de c²."}},
  {q:{en:"When you look at the Sun's light (never directly!), you see the Sun as it was…",fr:"Quand tu regardes la lumière du Soleil (jamais directement !), tu le vois tel qu'il était…"},o:[{en:"right now",fr:"maintenant"},{en:"about 8 minutes ago",fr:"il y a environ 8 minutes"},{en:"a year ago",fr:"il y a un an"}],c:1,why:{en:"150 million km ÷ 300,000 km/s ≈ 500 s ≈ 8 min 20 s.",fr:"150 millions de km ÷ 300 000 km/s ≈ 500 s ≈ 8 min 20 s."}},
  {q:{en:"Does fusion break the conservation of energy from Lesson 10?",fr:"La fusion viole-t-elle la conservation de l'énergie de la leçon 10 ?"},o:[{en:"Yes, energy is created",fr:"Oui, de l'énergie est créée"},{en:"No: mass counts as energy, so the total is conserved",fr:"Non : la masse compte comme énergie, le total est conservé"},{en:"Yes, mass is destroyed",fr:"Oui, de la masse est détruite"}],c:1,why:{en:"E = mc² does not break the rule; it completes it.",fr:"E = mc² ne viole pas la règle ; elle la complète."}}],
 ladAr:"ماذا يعني أن «يُستهلَك» شيء؟",ladEn:{en:"What does it mean for something to be \"used up\"?",fr:"Que veut dire qu'une chose est « épuisée » ?"},
 lad:["ما الفرق بين أن يختفي الشيء وأن يتحوّل؟","الشمس تفقد ملايين الأطنان كلّ ثانية ولا شيء يضيع من الحساب. كيف يكون الفقد والحفظ معًا؟","الشمس تعطي بلا توقّف. ماذا يحدث لنا ولكلّ حيّ على الأرض لو توقّف هذا العطاء يومًا واحدًا؟","في الفيزياء تتحوّل الكتلة إلى طاقة بقانون دقيق. هل يتحوّل ما نبذله من جهد ووقت إلى شيء آخر بالطريقة نفسها؟ أين يختلف؟"]},

/* ---------------- B7 predict one electron ---------------- */
B7:{theme:"quantum",link:"L4",
 intro:[{en:"In 1814 Pierre-Simon Laplace imagined an intellect that knows every particle's position and speed: for it, the future would be as clear as the past. Lesson 4 took this seriously for a thrown ball. The quantum world says something surprising about tiny things.",fr:"En 1814, Pierre-Simon Laplace imagine une intelligence qui connaîtrait la position et la vitesse de chaque particule : pour elle, l'avenir serait aussi clair que le passé. La leçon 4 a pris cette idée au sérieux pour un ballon lancé. Le monde quantique dit quelque chose de surprenant sur les très petites choses."},
  {en:"Take one radioactive atom. Physics can tell you, precisely, that it has a 50% chance of decaying within its half-life. It cannot tell you when this atom will decay, and as far as we know, no measurement we could ever make would tell you either. Yet a billion such atoms follow the half-life curve almost perfectly.",fr:"Prends un atome radioactif. La physique peut te dire, avec précision, qu'il a 50 % de chances de se désintégrer pendant sa demi-vie. Elle ne peut pas te dire quand cet atome-là se désintégrera, et à notre connaissance, aucune mesure possible ne le dirait non plus. Pourtant un milliard de ces atomes suivent presque parfaitement la courbe de demi-vie."}],
 idea:{en:"Lesson 4 asked whether knowing the present fixes the future. For a ball, almost. For a single atom, physics predicts only probabilities, and those probabilities are exact.",fr:"La leçon 4 demandait si connaître le présent fixe l'avenir. Pour un ballon, presque. Pour un seul atome, la physique ne prédit que des probabilités, mais ces probabilités sont exactes."},
 simT:{en:"Simulation: 100 radioactive atoms",fr:"Simulation : 100 atomes radioactifs"},
 note:{en:"Half-life in the simulation: 3 seconds. Click one atom before you start and bet that it will decay first.",fr:"Demi-vie dans la simulation : 3 secondes. Clique sur un atome avant de commencer et parie qu'il se désintégrera en premier."},
 sim(host,d,tx){
  host.innerHTML=xCv(900,420,tx("A grid of 100 atoms decaying at random, with the count graph","Une grille de 100 atomes qui se désintègrent au hasard, avec le graphe du nombre"))+`<div class="row" style="gap:8px"><button class="btn" id="xgo">${tx("Start","Démarrer")}</button><button class="btn ghost" id="xre">${tx("Reset","Recommencer")}</button><span class="muted" id="xbet" style="font-size:.92rem"></span></div>`;
  const T=3;let A=[],t=0,run=false,bet=null,firstDone=false,msg="",runs=[];
  const reset=()=>{A=Array.from({length:100},()=>({d:false,at:0}));t=0;run=false;bet=null;firstDone=false;msg=tx("Pick an atom to bet on, then press Start.","Choisis un atome sur lequel parier, puis Démarrer.");$("#xbet").textContent=msg;};
  reset();$("#xgo").onclick=()=>{run=true;};$("#xre").onclick=()=>{if(t>0)runs.push(hist.slice());hist=[];reset();};
  let hist=[];const cv=$("#xcv");
  cv.onclick=e=>{if(run)return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*420/r.height;const i=Math.floor((x-30)/38),j=Math.floor((y-30)/38);if(i>=0&&i<10&&j>=0&&j<10){bet=j*10+i;$("#xbet").textContent=tx("You bet on atom ","Tu paries sur l'atome ")+(bet+1)+".";}};
  const c=cv.getContext("2d");

     hist.push([t,A.filter(a=>!a.d).length]);if(t>18)run=false;}

   const gx=460,gy=40,gw=410,gh=320;c.strokeStyle="rgba(255,255,255,.3)";c.strokeRect(gx,gy,gw,gh);const X=s=>gx+s/18*gw,Y=n=>gy+gh-n/100*gh;

   c.fillStyle="rgba(255,255,255,.8)";c.font="13px system-ui";c.fillText(tx("Atoms left","Atomes restants")+": "+A.filter(a=>!a.d).length,gx,gy-12);c.fillStyle="rgba(255,209,102,.9)";c.fillText(tx("Prediction: half every 3 s","Prédiction : moitié toutes les 3 s"),gx+200,gy-12);
   c.fillStyle="rgba(255,255,255,.6)";c.fillText("t = "+nf(t,1)+" s",gx,gy+gh+22);

 },
 Q:[{q:{en:"After two half-lives, what fraction of the atoms is left, on average?",fr:"Après deux demi-vies, quelle fraction des atomes reste-t-il, en moyenne ?"},o:[{en:"0%",fr:"0 %"},{en:"25%",fr:"25 %"},{en:"50%",fr:"50 %"}],c:1,why:{en:"Half of a half: ½ × ½ = ¼. Not zero: each half-life removes half of what is left.",fr:"La moitié de la moitié : ½ × ½ = ¼. Pas zéro : chaque demi-vie retire la moitié de ce qui reste."}},
  {q:{en:"Run it several times. What stays the same from run to run, and what changes?",fr:"Lance plusieurs fois. Qu'est-ce qui reste pareil d'une fois à l'autre, et qu'est-ce qui change ?"},o:[{en:"Everything is identical every time",fr:"Tout est identique à chaque fois"},{en:"The overall curve is similar; which atoms decay, and when, is different",fr:"La courbe globale est semblable ; quels atomes se désintègrent, et quand, change"},{en:"Nothing is predictable at all",fr:"Rien n'est prévisible du tout"}],c:1,why:{en:"Randomness for one, regularity for many. With a billion atoms the curve becomes almost perfect.",fr:"Hasard pour un, régularité pour beaucoup. Avec un milliard d'atomes, la courbe devient presque parfaite."}},
  {q:{en:"Did your bet win? What would you need to know to win every time?",fr:"Ton pari a-t-il gagné ? Que faudrait-il savoir pour gagner à chaque fois ?"},o:[{en:"More about the atom's past",fr:"Plus sur le passé de l'atome"},{en:"As far as physics knows, no information we could obtain would tell us in advance; whether the outcome is \"written\" anywhere is still debated",fr:"D'après la physique, aucune information que nous pourrions obtenir ne le dirait à l'avance ; savoir si le résultat est « écrit » quelque part reste débattu"},{en:"A faster computer",fr:"Un ordinateur plus rapide"}],c:1,why:{en:"This is the deepest break from Laplace. Physicists still debate how to interpret it.",fr:"C'est la rupture la plus profonde avec Laplace. Les physiciens débattent encore de son interprétation."}},
  {q:{en:"Carbon-14 has a half-life of about 5,730 years. How do archaeologists use this?",fr:"Le carbone 14 a une demi-vie d'environ 5 730 ans. Comment les archéologues l'utilisent-ils ?"},o:[{en:"To date ancient wood, bone and cloth by how much carbon-14 is left",fr:"Pour dater bois, os et tissus anciens selon le carbone 14 restant"},{en:"To predict the future",fr:"Pour prédire l'avenir"},{en:"They can't: it is random",fr:"Impossible : c'est aléatoire"}],c:0,why:{en:"Random for one atom, reliable for billions: enough to date the cedar beams of an old building.",fr:"Aléatoire pour un atome, fiable pour des milliards : assez pour dater les poutres de cèdre d'un vieux bâtiment."}}],
 ladAr:"إذا كان الفرد غير متوقَّع والمجموع منتظمًا، فأيّ نوع من النظام هذا؟",ladEn:{en:"If one is unpredictable and many are regular, what kind of order is that?",fr:"Si un seul est imprévisible et que beaucoup sont réguliers, de quel ordre s'agit-il ?"},
 lad:["ما الفرق بين «لا نعرف» و«لا يمكن أن يُعرَف»؟","لا يعرف الفيزيائي متى تتفكّك ذرّة واحدة، لكنّه يعرف بدقّة متى يتفكّك نصف مليار ذرّة. كيف يجتمع الجهل واليقين؟","في المجتمع: شركات التأمين لا تعرف من سيمرض، لكنّها تعرف كم سيمرضون. ماذا يعني أن نكون «أرقامًا» في حساب؟","الذرّة لا تختار، والإنسان يختار. هل يصلح «الاحتمال» لوصف قرارات البشر؟ أين يتوقّف التشبيه؟"]},

/* ---------------- B8 two places ---------------- */
B8:{theme:"quantum",
 intro:[{en:"Send electrons, one at a time, toward a wall with two narrow slits. Each electron lands as a single dot on the screen behind, like a tiny bullet. But after thousands of dots, a pattern of stripes appears: the pattern waves make when they pass through both slits and overlap. Each electron seems to have gone through both slits.",fr:"Envoie des électrons, un par un, vers une paroi percée de deux fentes. Chaque électron arrive comme un point sur l'écran derrière, comme une petite balle. Mais après des milliers de points apparaît un motif de bandes : celui que font des ondes qui passent par les deux fentes et se superposent. Chaque électron semble être passé par les deux fentes."},
  {en:"Now place a detector to see which slit each electron uses. The stripes vanish: what is left is a smooth spread with no stripes, simply the sum of what each slit gives on its own. Richard Feynman said this experiment contains \"the only mystery\" of quantum mechanics. It has been done with electrons, atoms and even large molecules.",fr:"Place maintenant un détecteur pour voir par quelle fente passe chaque électron. Les bandes disparaissent : il ne reste qu'une répartition lisse sans bandes, simplement la somme de ce que donne chaque fente seule. Richard Feynman disait que cette expérience contient « le seul mystère » de la mécanique quantique. Elle a été réalisée avec des électrons, des atomes et même de grosses molécules."}],
 simT:{en:"Simulation: electrons through two slits",fr:"Simulation : des électrons à travers deux fentes"},
 note:{en:"The dots are drawn at random from the probability pattern quantum mechanics predicts; the real experiment gives the same result.",fr:"Les points sont tirés au hasard selon le motif de probabilité prédit par la mécanique quantique ; l'expérience réelle donne le même résultat."},
 sim(host,d,tx){
  host.innerHTML=xCv(900,420,tx("Electrons building up a pattern on a screen after two slits","Des électrons qui forment un motif sur un écran après deux fentes"))+`<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="x1">${tx("Send 1","Envoyer 1")}</button><button class="btn" id="x100">${tx("Send 100","Envoyer 100")}</button><button class="btn ghost" id="xauto" aria-pressed="false">${tx("Auto","Auto")}</button><button class="btn ghost" id="xwatch" aria-pressed="false">${tx("Watch which slit: off","Observer la fente : non")}</button><button class="btn ghost" id="xclr2">${tx("Clear","Effacer")}</button></div>`;
  let dots=[],watch=false,auto=false;const B=new Array(120).fill(0);const flights=[];
  const P=y=>watch?0.5*Math.exp(-Math.pow(y/0.5,2)):Math.cos(y*11)**2*Math.exp(-Math.pow(y/0.5,2));
  const sample=()=>{for(;;){const y=Math.random()*2-1;if(Math.random()<P(y))return y;}};
  const send=n=>{for(let i=0;i<n;i++){const y=sample();dots.push(y);B[Math.min(119,Math.floor((y+1)/2*120))]++;}if(n===1)flights.push({x:0,y:sample()});};
  $("#x1").onclick=()=>send(1);$("#x100").onclick=()=>send(100);
  $("#xauto").onclick=e=>{auto=!auto;e.currentTarget.setAttribute("aria-pressed",auto);};
  $("#xwatch").onclick=e=>{watch=!watch;dots=[];B.fill(0);e.currentTarget.setAttribute("aria-pressed",watch);e.currentTarget.textContent=watch?tx("Watch which slit: on","Observer la fente : oui"):tx("Watch which slit: off","Observer la fente : non");};
  $("#xclr2").onclick=()=>{dots=[];B.fill(0);};
  const c=$("#xcv").getContext("2d");
  xLoop($("#xcv"),dt=>{if(auto)send(XRM()?1:Math.ceil(dt*60));const W=900,H=420,cy=200;c.fillStyle="#0E1320";c.fillRect(0,0,W,H);
   c.fillStyle="#FFD166";c.beginPath();c.arc(60,cy,10,0,7);c.fill();c.fillStyle="rgba(255,255,255,.7)";c.font="12px system-ui";c.textAlign="center";c.fillText(tx("electron gun","canon à électrons"),60,cy+30);
   c.fillStyle="#6D7C8C";c.fillRect(300,30,12,cy-30-40);c.fillRect(300,cy-25,12,50);c.fillRect(300,cy+40,12,H-60-cy-40+30);
   if(watch){c.fillStyle="#E23B2E";c.beginPath();c.arc(330,cy-32,6,0,7);c.fill();c.fillText(tx("detector","détecteur"),350,cy-50);}
   c.fillStyle="#1B2233";c.fillRect(600,30,24,H-80);
   dots.slice(-4000).forEach((y,i)=>{const yy=cy+y*170;c.fillStyle="rgba(158,197,255,.8)";c.fillRect(600+((i*37)%22),yy,2,2);});
   const mx=Math.max(1,...B);c.fillStyle="rgba(158,197,255,.55)";B.forEach((n,i)=>{const yy=cy+(-1+i/60)*170;c.fillRect(640,yy,n/mx*220,2.8);});
   c.fillStyle="rgba(255,255,255,.75)";c.textAlign="left";c.font="13px system-ui";c.fillText(tx("electrons sent","électrons envoyés")+": "+dots.length,660,H-14);c.textAlign="center";c.fillText(tx("screen","écran"),612,24);c.textAlign="left";
  });
 },
 Q:[{q:{en:"Send electrons one at a time, slowly. Does each one arrive as a wave or as a dot?",fr:"Envoie des électrons un par un, lentement. Chacun arrive-t-il comme une onde ou comme un point ?"},o:[{en:"As a spread-out wave",fr:"Comme une onde étalée"},{en:"As a single dot",fr:"Comme un seul point"},{en:"Not at all",fr:"Pas du tout"}],c:1,why:{en:"One electron, one dot. The wave appears only in the pattern of many.",fr:"Un électron, un point. L'onde n'apparaît que dans le motif de beaucoup."}},
  {q:{en:"Send a few thousand with the detector off. What forms?",fr:"Envoie quelques milliers sans détecteur. Qu'est-ce qui se forme ?"},o:[{en:"Two bands",fr:"Deux bandes"},{en:"Many stripes: an interference pattern",fr:"De nombreuses bandes : une figure d'interférence"},{en:"One band in the middle only",fr:"Une seule bande au milieu"}],c:1,why:{en:"Stripes need something passing through both slits and overlapping with itself.",fr:"Les bandes exigent quelque chose qui passe par les deux fentes et se superpose à lui-même."}},
  {q:{en:"Turn the detector on. What happens to the stripes?",fr:"Allume le détecteur. Que deviennent les bandes ?"},o:[{en:"They get sharper",fr:"Elles deviennent plus nettes"},{en:"They disappear: a smooth spread with no stripes",fr:"Elles disparaissent : une répartition lisse sans bandes"},{en:"Nothing changes",fr:"Rien ne change"}],c:1,why:{en:"Measuring which slit changes the result. How to interpret this is still debated among physicists.",fr:"Mesurer la fente change le résultat. Son interprétation est encore débattue entre physiciens."}},
  {q:{en:"Is it correct to say the electron is \"a wave\" or \"a particle\"?",fr:"Est-il juste de dire que l'électron est « une onde » ou « une particule » ?"},o:[{en:"Only a particle",fr:"Seulement une particule"},{en:"Only a wave",fr:"Seulement une onde"},{en:"Neither word fits completely; each describes part of how it behaves",fr:"Aucun mot ne convient tout à fait ; chacun décrit une partie de son comportement"}],c:2,why:{en:"Our everyday words were made for everyday things. At this scale, they are models, as in Lesson 5.",fr:"Nos mots de tous les jours ont été faits pour des choses ordinaires. À cette échelle, ce sont des modèles, comme dans la leçon 5."}}],
 ladAr:"هل تُغيّر المراقبةُ الشيءَ المُراقَب؟",ladEn:{en:"Does watching something change it?",fr:"Observer une chose la change-t-il ?"},
 lad:["ما معنى «أن نراقب»؟ هل المراقبة مجرّد نظر، أم تفاعل؟","لكي نعرف من أيّ شقّ مرّ الإلكترون، يكفي أن نسجّل طريقه، حتّى من دون أن نصطدم به، فتختفي الخطوط. هل يمكن أن نعرف شيئًا من دون أن نؤثّر فيه؟","هل يتصرّف الناس بشكل مختلف حين يعرفون أنّهم مراقَبون؟ وهل يتصرّفون بشكل مختلف حين لا يراهم أحد؟","الإلكترون لا يعرف أنّه مراقَب، والإنسان يعرف. هل التشبيه بينهما صحيح؟ أين يتوقّف؟"]},

/* ---------------- B9 Arabic star names ---------------- */
B9:{theme:"sky",
 intro:[{en:"Look up at Orion on a winter night and you are reading Arabic. Betelgeuse comes from yad al-jawzāʾ, \"the hand of al-Jawzāʾ\", misread by European copyists. Rigel is rijl, \"the foot\". Aldebaran is al-dabarān, \"the follower\", because it follows the Pleiades (al-Thurayyā) across the sky.",fr:"Regarde Orion une nuit d'hiver : tu lis de l'arabe. Bételgeuse vient de yad al-jawzāʾ, « la main d'al-Jawzāʾ », mal recopié par des copistes européens. Rigel, c'est rijl, « le pied ». Aldébaran, c'est al-dabarān, « celui qui suit », parce qu'elle suit les Pléiades (al-Thurayyā) dans le ciel."},
  {en:"Many of these names reached Europe through translations of Arabic astronomy, including the Book of Fixed Stars by ʿAbd al-Raḥmān al-Ṣūfī (964). Al-Ṣūfī also gave the first known written description of the Andromeda galaxy, as a \"small cloud\".",fr:"Beaucoup de ces noms sont arrivés en Europe par des traductions de l'astronomie arabe, dont le Livre des étoiles fixes de ʿAbd al-Raḥmān al-Ṣūfī (964). Al-Ṣūfī a aussi donné la première description écrite connue de la galaxie d'Andromède, comme un « petit nuage »."}],
 simT:{en:"Interactive sky: tap a star",fr:"Ciel interactif : touche une étoile"},
 note:{en:"Positions are simplified. Distances of far stars are uncertain; values are approximate. A light-year is the distance light travels in a year: the light you see left the star long ago.",fr:"Positions simplifiées. Les distances des étoiles lointaines sont incertaines ; valeurs approchées. Une année-lumière est la distance parcourue par la lumière en un an : la lumière que tu vois a quitté l'étoile il y a longtemps."},
 sim(host,d,tx){

   s:[{n:"Vega",ar:"النسر الواقع",tr:"al-nasr al-wāqiʿ",m:tx("the swooping eagle","l'aigle qui fond"),ly:25,x:560,y:100,r:8,col:"#E8F0FF"},{n:"Deneb",ar:"ذنب الدجاجة",tr:"dhanab al-dajāja",m:tx("the tail of the hen","la queue de la poule"),ly:2600,x:260,y:80,r:7,col:"#F4F6FF"},{n:"Altair",ar:"النسر الطائر",tr:"al-nasr al-ṭāʾir",m:tx("the flying eagle","l'aigle qui vole"),ly:17,x:430,y:330,r:7,col:"#F4F6FF"}]};

  let sel=null;const cv=$("#xcv"),c=cv.getContext("2d");
  const info=()=>{if(!sel){$("#xread").innerHTML=`<div style="grid-column:1/-1"><small>${tx("Tap or click a star","Touche ou clique une étoile")}</small><b>${tx("Each name hides a story","Chaque nom cache une histoire")}</b></div>`;return;}
   $("#xread").innerHTML=`<div><small>${tx("Name used today","Nom utilisé aujourd'hui")}</small><b>${sel.n}</b></div><div><small>${tx("Original","Origine")}</small><b><span class="ar" style="display:inline">${sel.ar}</span> · ${sel.tr}</b></div><div><small>${tx("Meaning","Sens")}</small><b style="font-weight:500">${sel.m}</b></div><div><small>${tx("Distance · light left it around","Distance · lumière partie vers")}</small><b class="mono">~${nf(sel.ly,0)} ${tx("ly","al")} · ${2026-sel.ly>0?tx("year ","l'an ")+(2026-sel.ly):(sel.ly-2026)+tx(" BCE"," av. J.-C.")}</b></div>`;};
  info();

  cv.onclick=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*420/r.height;let best=null,bd=40;SK[d.sky].forEach(s=>{const dd=Math.hypot(s.x-x,s.y-y);if(dd<bd){bd=dd;best=s;}});sel=best;info();};
  let tt=0;xLoop(cv,dt=>{tt+=dt;const W=900,H=420;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#070B18");g.addColorStop(1,"#141C35");c.fillStyle=g;c.fillRect(0,0,W,H);xStars(c,W,H,120);
   const L=SK[d.sky];c.strokeStyle="rgba(158,197,255,.25)";c.lineWidth=1.5;c.beginPath();
   const lines=d.sky==="w"?[[0,2],[2,3],[3,4],[4,1],[0,1],[2,5],[4,6]]:[[0,1],[1,2],[2,0]];lines.forEach(([a,b])=>{c.moveTo(L[a].x,L[a].y);c.lineTo(L[b].x,L[b].y);});c.stroke();
   L.forEach((s,i)=>{const tw=0.85+0.15*Math.sin(tt*3+i*1.7);if(s.cl){for(let k=0;k<7;k++){c.fillStyle=s.col;c.beginPath();c.arc(s.x+Math.cos(k*0.9)*14*(k%3+1)/2,s.y+Math.sin(k*1.3)*10*(k%2+1)/2,2.2,0,7);c.fill();}}
    else{const gg=c.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3);gg.addColorStop(0,s.col);gg.addColorStop(0.4,s.col);gg.addColorStop(1,"rgba(0,0,0,0)");c.globalAlpha=tw;c.fillStyle=gg;c.beginPath();c.arc(s.x,s.y,s.r*3,0,7);c.fill();c.globalAlpha=1;}
    if(s===sel){c.strokeStyle="#FFD166";c.lineWidth=2;c.beginPath();c.arc(s.x,s.y,s.r*3+6,0,7);c.stroke();c.lineWidth=1;}
    c.fillStyle="rgba(255,255,255,.75)";c.font="12px system-ui";const lo={Alnitak:[-62,22],Alnilam:[-10,26],Mintaka:[12,-10]}[s.n]||[12,-10];c.fillText(s.n,s.x+lo[0],s.y+lo[1]);});

B10:{theme:"sky",
 intro:[{en:"You do not need a telescope. From a balcony in Lebanon you can follow the Moon's phases, spot planets that do not twinkle, and measure your own latitude with the Pole Star. In Lebanon, Polaris stands about 34° above the northern horizon, the same as the country's latitude.",fr:"Pas besoin de télescope. D'un balcon au Liban, tu peux suivre les phases de la Lune, repérer des planètes qui ne scintillent pas, et mesurer ta latitude avec l'étoile Polaire. Au Liban, la Polaire se trouve à environ 34° au-dessus de l'horizon nord, comme la latitude du pays."},
  {en:"The Moon's phases are not Earth's shadow. Half the Moon is always lit by the Sun; the phase is how much of that lit half faces us. The first thin crescent after the new moon, the hilāl, appears low in the west just after sunset, and it has marked the start of the months of the Hijri calendar for centuries.",fr:"Les phases de la Lune ne sont pas l'ombre de la Terre. La moitié de la Lune est toujours éclairée par le Soleil ; la phase, c'est la part de cette moitié tournée vers nous. Le premier fin croissant après la nouvelle lune, le hilāl, apparaît bas à l'ouest juste après le coucher du Soleil, et marque depuis des siècles le début des mois du calendrier hégirien."}],
 simT:{en:"Simulation: the Moon's phase on any date",fr:"Simulation : la phase de la Lune à n'importe quelle date"},
 note:{en:"Phase computed from the average lunar month (29.53 days) and a known new moon; it can be off by up to about 15 hours. The top view is not to scale.",fr:"Phase calculée à partir du mois lunaire moyen (29,53 jours) et d'une nouvelle lune connue ; l'écart peut atteindre environ 15 heures. La vue de dessus n'est pas à l'échelle."},
 sim(host,d,tx){
  d.off=d.off??0;d.chk=d.chk||{};
  host.innerHTML=xCv(900,380,tx("Top view of Sun, Earth and Moon, and the Moon's phase as seen from Earth","Vue de dessus du Soleil, de la Terre et de la Lune, et la phase vue de la Terre"))+`<div class="xctl"><label class="f" for="xo">${tx("Days from today","Jours à partir d'aujourd'hui")} <b id="xov"></b><input type="range" id="xo" min="-15" max="30" step="0.25" value="${d.off}"></label><button class="sbtn ghost" id="xtoday">${tx("Back to today","Revenir à aujourd'hui")}</button></div><div class="xread" id="xread"></div>
   <h3 style="margin:8px 0 0">${tx("Tonight's observing checklist","Liste d'observation de ce soir")}</h3><div class="xchk">${[tx("Find the Moon. Note the time, its direction and its phase. Does it match the simulation?","Trouve la Lune. Note l'heure, sa direction et sa phase. Correspond-elle à la simulation ?"),tx("Find a bright point that does not twinkle. Check with a free sky app (for example Stellarium or Sky Map): is it a planet?","Trouve un point brillant qui ne scintille pas. Vérifie avec une appli gratuite (par exemple Stellarium ou Sky Map) : est-ce une planète ?"),tx("Find Polaris. Measure its height above the horizon with your phone's level app (Lesson 5). You should get about 34°.","Trouve la Polaire. Mesure sa hauteur au-dessus de l'horizon avec l'appli niveau de ton téléphone (leçon 5). Tu devrais trouver environ 34°."),tx("Count the stars you can see inside Orion's rectangle (winter). Fewer than 5 means strong light pollution; compare with a friend in the mountains.","Compte les étoiles visibles dans le rectangle d'Orion (hiver). Moins de 5 signifie une forte pollution lumineuse ; compare avec un ami à la montagne.")].map((t,i)=>`<label class="xck"><input type="checkbox" data-chk="${i}" ${d.chk[i]?"checked":""}> <span>${t}</span></label>`).join("")}</div>`;
  const SYN=29.530588853,REF=Date.UTC(2000,0,6,18,14);
  const age=()=>{const ms=Date.now()+d.off*86400000;let a=((ms-REF)/86400000)%SYN;if(a<0)a+=SYN;return a;};
  const nameOf=a=>{const p=a/SYN;return p<0.03||p>0.97?tx("New moon","Nouvelle lune"):p<0.22?tx("Waxing crescent","Premier croissant"):p<0.28?tx("First quarter","Premier quartier"):p<0.47?tx("Waxing gibbous","Gibbeuse croissante"):p<0.53?tx("Full moon","Pleine lune"):p<0.72?tx("Waning gibbous","Gibbeuse décroissante"):p<0.78?tx("Last quarter","Dernier quartier"):tx("Waning crescent","Dernier croissant");};
  const upd=()=>{$("#xov").textContent=(d.off>0?"+":"")+nf(d.off,d.off%1?2:0);const a=age();const ill=(1-Math.cos(2*Math.PI*a/SYN))/2;const dt=new Date(Date.now()+d.off*86400000);
   $("#xread").innerHTML=`<div><small>${tx("Date","Date")}</small><b>${dt.toLocaleDateString(S.lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"long",year:"numeric"})}</b></div><div><small>${tx("Phase","Phase")}</small><b>${nameOf(a)}</b></div><div><small>${tx("Moon's age","Âge de la Lune")}</small><b class="mono">${nf(a,1)} ${tx("days","jours")}</b></div><div><small>${tx("Lit part we see","Partie éclairée visible")}</small><b class="mono">${nf(ill*100,0)} %</b></div>`;};
  $("#xo").oninput=e=>{d.off=+e.target.value;save();upd();};$("#xtoday").onclick=()=>{d.off=0;$("#xo").value=0;save();upd();};
  host.querySelectorAll("[data-chk]").forEach(b=>b.onchange=()=>{d.chk[b.dataset.chk]=b.checked;save();});upd();
  const c=$("#xcv").getContext("2d");
  xLoop($("#xcv"),()=>{const W=900,H=380;c.fillStyle="#0B1226";c.fillRect(0,0,W,H);xStars(c,W,H,50);
   const a=age(),th=2*Math.PI*a/SYN; // 0 = new moon (Moon between Earth and Sun)
   // top view: sun far left
   c.fillStyle="rgba(255,231,168,.08)";c.fillRect(0,0,480,H);c.fillStyle="#FFD166";c.beginPath();c.arc(-40,190,70,0,7);c.fill();c.fillStyle="rgba(255,255,255,.7)";c.font="12px system-ui";c.fillText(tx("sunlight →","lumière du Soleil →"),40,40);
   const ex=280,ey=190;c.fillStyle="#4C93AE";c.beginPath();c.arc(ex,ey,26,0,7);c.fill();c.fillStyle="rgba(0,0,0,.45)";c.beginPath();c.arc(ex,ey,26,-Math.PI/2,Math.PI/2);c.fill();
   c.strokeStyle="rgba(255,255,255,.2)";c.setLineDash([3,5]);c.beginPath();c.arc(ex,ey,120,0,7);c.stroke();c.setLineDash([]);
   const mx=ex-120*Math.cos(th),my=ey+120*Math.sin(th); // counter-clockwise seen from north
   c.fillStyle="#DADFE8";c.beginPath();c.arc(mx,my,14,0,7);c.fill();c.fillStyle="rgba(0,0,0,.6)";c.beginPath();c.arc(mx,my,14,-Math.PI/2,Math.PI/2);c.fill();
   c.fillStyle="rgba(255,255,255,.7)";c.fillText(tx("Earth","Terre"),ex-14,ey+44);c.fillText(tx("Moon","Lune"),mx-14,my-20);c.fillText(tx("Top view (north up)","Vue de dessus (nord en haut)"),330,360);
   // phase as seen from Earth (right)
   const px=700,py=190,R=110;c.fillStyle="#1B2233";c.beginPath();c.arc(px,py,R,0,7);c.fill();
   const k=Math.cos(th); // +1 new, -1 full
   c.fillStyle="#E8EAF0";c.beginPath();
   const waxing=a<SYN/2; // lit on the right when waxing (northern hemisphere)
   c.arc(px,py,R,-Math.PI/2,Math.PI/2,!waxing);c.ellipse(px,py,Math.max(0.01,Math.abs(k)*R),R,0,Math.PI/2,-Math.PI/2,(k>0)===waxing);c.fill();
   c.fillStyle="rgba(255,255,255,.7)";c.fillText(tx("As seen from Lebanon","Vue depuis le Liban"),px-60,py+R+30);
  });
 },
 Q:[{q:{en:"What causes the Moon's phases?",fr:"Qu'est-ce qui cause les phases de la Lune ?"},o:[{en:"Earth's shadow falling on the Moon",fr:"L'ombre de la Terre sur la Lune"},{en:"How much of the Moon's sunlit half faces us",fr:"La part de la moitié éclairée de la Lune tournée vers nous"},{en:"Clouds",fr:"Les nuages"}],c:1,why:{en:"Earth's shadow on the Moon is an eclipse, which is rare. Phases happen every month.",fr:"L'ombre de la Terre sur la Lune, c'est une éclipse, rare. Les phases, c'est chaque mois."}},
  {q:{en:"About how long from one new moon to the next?",fr:"Combien de temps environ d'une nouvelle lune à la suivante ?"},o:[{en:"7 days",fr:"7 jours"},{en:"29.5 days",fr:"29,5 jours"},{en:"365 days",fr:"365 jours"}],c:1,why:{en:"Twelve lunar months make about 354 days: that is why the Hijri year is about 11 days shorter than the solar year.",fr:"Douze mois lunaires font environ 354 jours : c'est pourquoi l'année hégirienne est plus courte d'environ 11 jours que l'année solaire."}},
  {q:{en:"When and where do you look for the first thin crescent (the hilāl)?",fr:"Quand et où chercher le premier fin croissant (le hilāl) ?"},o:[{en:"East, at sunrise",fr:"À l'est, au lever du Soleil"},{en:"West, just after sunset, a day or two after the new moon",fr:"À l'ouest, juste après le coucher du Soleil, un ou deux jours après la nouvelle lune"},{en:"Overhead at midnight",fr:"Au zénith à minuit"}],c:1,why:{en:"A young Moon is close to the Sun in the sky, so it sets soon after it.",fr:"Une jeune Lune est proche du Soleil dans le ciel, donc elle se couche peu après lui."}},
  {q:{en:"Why is Polaris's height above the horizon equal to your latitude?",fr:"Pourquoi la hauteur de la Polaire au-dessus de l'horizon est-elle égale à ta latitude ?"},o:[{en:"Coincidence",fr:"Par hasard"},{en:"Polaris sits almost straight above Earth's North Pole, so its angle changes exactly as you move north or south",fr:"La Polaire est presque à la verticale du pôle Nord, donc son angle change exactement quand on va vers le nord ou le sud"},{en:"Because Lebanon is small",fr:"Parce que le Liban est petit"}],c:1,why:{en:"At the North Pole it is overhead (90°); at the equator it sits on the horizon (0°). Arab navigators used this for centuries.",fr:"Au pôle Nord, elle est au zénith (90°) ; à l'équateur, sur l'horizon (0°). Les navigateurs arabes l'ont utilisé pendant des siècles."}}],
 ladAr:"لماذا قاس البشر الزمن بالسماء؟",ladEn:{en:"Why did people measure time by the sky?",fr:"Pourquoi les humains ont-ils mesuré le temps avec le ciel ?"},
 lad:["ما الذي يجعل شيئًا صالحًا لقياس الزمن؟","القمر يعود إلى الطور نفسه كلّ 29.5 يومًا تقريبًا بلا انقطاع. ماذا يعني هذا الانتظام للإنسان الذي يراقبه؟","كيف تغيّرت علاقتنا بالسماء حين صارت المدن مضيئة ليلًا؟ ماذا فقدنا وماذا ربحنا؟","السماء تعطينا تقويمًا دقيقًا. هل تعطينا أيضًا معنى لما نفعله بوقتنا؟ أين يتوقّف ما يستطيع العلم قوله؟"]}
};

function renderExploreGeneric(id){
  const X=EXPL[id], tx=(en,fr)=>S.lang==="fr"?fr:en; S.xs=S.xs||{}; const d=S.xs[id]=S.xs[id]||{ans:{},lad:{}};
  const item=BEYOND.flatMap(t=>t.items.map(i=>Object.assign({th:t},i))).find(i=>i.id===id);
  const all=BEYOND.flatMap(t=>t.items); const idx=all.findIndex(i=>i.id===id); const nxt=all[(idx+1)%all.length];
  $("#main").innerHTML=`
  <section class="card">
    <div class="row" style="justify-content:space-between"><span class="kicker">${tx("Beyond","Au-delà")} · ${L(item.th.t)}${X.link?` · ${tx("Connects to Lesson","Prolonge la leçon")} ${LESSON_NUM(X.link)}`:""}</span><button class="linkbtn" id="toBeyond">← ${tx("All explorations","Toutes les explorations")}</button></div>
    <h1>${L(item.t)}</h1><p class="ar" style="margin:0">${item.ar}</p>
    ${X.intro.map(p=>`<p>${L(p)}</p>`).join("")}
    ${X.idea?`<div class="disc"><span class="lbl">${X.link?tx("The idea from Lesson ","L'idée de la leçon ")+LESSON_NUM(X.link):tx("The idea","L'idée")}</span><p style="margin:0">${L(X.idea)}</p></div>`:""}
  </section>
  <section class="card"><h2>${L(X.simT)}</h2><div id="xhost" style="display:grid;gap:12px"></div><p class="muted" style="font-size:.86rem;margin:0">${L(X.note)}</p></section>
  <section class="card"><h2>${tx("Questions to answer with the simulation","Questions à résoudre avec la simulation")}</h2><div id="xq" style="display:grid;gap:16px"></div></section>
  <section class="card ladder"><span class="kicker">${tx("The big question","La grande question")}</span><h2 class="ar" style="margin:0">${X.ladAr}</h2><p class="muted" style="margin:0">${L(X.ladEn)}</p>
    <ol class="lad">${X.lad.map((q,i)=>{const r=[["المفهوم","The concept"],["في الفيزياء","In physics"],["في العالم والمجتمع","In the world and the community"],["حدود التشبيه","Limits of the analogy"]][i];return `<li><div class="lad-h"><span class="lad-n">${i+1}</span><span class="ar"><b>${r[0]}</b></span><small class="muted">${r[1]}</small></div><p class="ar">${q}</p><textarea class="ar" dir="rtl" data-xlad="${i}" aria-label="${r[1]}" placeholder="…">${esc(d.lad[i]||"")}</textarea></li>`;}).join("")}</ol></section>
  <section class="card"><div class="row" style="justify-content:space-between;gap:12px">${X.link?`<div><b>${tx("Back to the programme","Retour au programme")}</b><p class="muted" style="margin:0">${tx("Lesson","Leçon")} ${LESSON_NUM(X.link)}</p></div><button class="btn ghost" id="toLes">${tx("Open Lesson","Ouvrir la leçon")} ${LESSON_NUM(X.link)} →</button>`:""}<div><b>${tx("Next exploration","Exploration suivante")}</b><p class="muted" style="margin:0">${L(nxt.t)}</p></div><button class="btn" id="toNext">${tx("Explore","Explorer")} →</button></div></section>`;
  $("#toBeyond").onclick=()=>go("beyond"); if(X.link) $("#toLes").onclick=()=>openLesson(X.link,0); $("#toNext").onclick=()=>openExplore(nxt.id);
  document.querySelectorAll("[data-xlad]").forEach(t=>t.oninput=e=>{d.lad[t.dataset.xlad]=e.target.value;save();});
  X.sim($("#xhost"),d,tx);
  $("#xq").innerHTML=X.Q.map((q,i)=>`<div class="qi"><p><b>${i+1}.</b> ${L(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-xq="${i}" data-j="${j}" aria-pressed="${d.ans[i]===j}"><span class="l">${"ABCD"[j]}</span><span>${L(o)}</span></button>`).join("")}</div><p class="note" id="xw${i}" ${d.ans[i]==null?"hidden":""}>${d.ans[i]==null?"":(d.ans[i]===q.c?"✓ ":"✗ ")+L(q.why)}</p></div>`).join("");
  $("#xq").onclick=e=>{const b=e.target.closest("[data-xq]");if(!b)return;const i=+b.dataset.xq,j=+b.dataset.j;d.ans[i]=j;save();b.parentElement.querySelectorAll(".opt").forEach((o,k)=>o.setAttribute("aria-pressed",k===j));const w=$("#xw"+i);w.hidden=false;w.textContent=(j===X.Q[i].c?"✓ ":"✗ ")+L(X.Q[i].why);};
}

const THINKERS=[
 {id:"morin",n:"Edgar Morin",ar:"إدغار موران",d:"b. 1921 · France",g:"edu",
  idea:{en:"School teaches knowledge in separate boxes, but the world does not come in boxes. Complex thinking is the art of connecting what the system separates.",fr:"L'école enseigne un savoir en cases séparées, mais le monde ne se découpe pas en cases. La pensée complexe est l'art de relier ce que le système sépare."},
  para:true,why:{en:"Every Sabab ladder follows one physics concept into the community, the world and values: a small exercise in connecting.",fr:"Chaque échelle de Sabab suit un concept de physique jusque dans la société, le monde et les valeurs : un petit exercice de reliance."},
  q:{en:"Name one problem in Lebanon that is at the same time physical, economic and human.",fr:"Cite un problème au Liban qui est à la fois physique, économique et humain."},links:[["ladder",{en:"The concept ladders",fr:"Les échelles de concepts"}]]},
 {id:"haytham",n:"Ibn al-Haytham",ar:"ابن الهيثم",d:"c. 965–1040 · Basra, Cairo",g:"arab",
  idea:{en:"The seeker of truth does not simply trust what the ancients wrote, however great they were. He questions it, tests it, and trusts argument and demonstration.",fr:"Celui qui cherche la vérité ne se fie pas simplement à ce qu'ont écrit les anciens, si grands soient-ils. Il les interroge, les met à l'épreuve et se fie à l'argument et à la démonstration."},
  para:true,src:{en:"From his Doubts concerning Ptolemy",fr:"D'après ses Doutes sur Ptolémée"},why:{en:"His Book of Optics tested ideas about light with experiments. That is the spirit of steps 3 and 4 in every lesson.",fr:"Son Livre de l'optique testait les idées sur la lumière par l'expérience. C'est l'esprit des étapes 3 et 4 de chaque leçon."},
  q:{en:"Is it disrespectful to question a great scientist? When is doubt a form of respect?",fr:"Est-il irrespectueux de questionner un grand savant ? Quand le doute est-il une forme de respect ?"},links:[["L3",{en:"Lesson 3: Is a force real?",fr:"Leçon 3 : Une force, est-ce réel ?"}]]},
 {id:"sina",n:"Ibn Sīnā (Avicenna)",ar:"ابن سينا",d:"980–1037 · Bukhara, Hamadan",g:"arab",
  idea:{en:"A thrown stone keeps moving because the thrower gave it an inclination (mayl). The inclination is used up by the resistance of the air; without resistance, the motion would continue.",fr:"Une pierre lancée continue d'avancer parce que le lanceur lui a donné une inclination (mayl). L'inclination s'épuise par la résistance de l'air ; sans résistance, le mouvement continuerait."},
  para:true,why:{en:"Six centuries before Newton, he came close to the idea of inertia. Lesson 3 asks students to compare his view with Aristotle's and Newton's.",fr:"Six siècles avant Newton, il s'approchait de l'idée d'inertie. La leçon 3 fait comparer sa vision à celles d'Aristote et de Newton."},
  q:{en:"Is \"inclination\" a force inside the stone, or a description of its motion?",fr:"L'« inclination » est-elle une force dans la pierre, ou une description de son mouvement ?"},links:[["L3",{en:"Lesson 3",fr:"Leçon 3"}],["L4",{en:"Lesson 4",fr:"Leçon 4"}]]},
 {id:"sufi",n:"ʿAbd al-Raḥmān al-Ṣūfī",ar:"عبد الرحمن الصوفي",d:"903–986 · Rey, Isfahan",g:"arab",
  idea:{en:"Look carefully and record what you see, star by star: position, brightness, colour. Careful observation corrects the books.",fr:"Regarde attentivement et note ce que tu vois, étoile par étoile : position, éclat, couleur. L'observation attentive corrige les livres."},
  para:true,src:{en:"The Book of Fixed Stars (964)",fr:"Le Livre des étoiles fixes (964)"},why:{en:"Many star names used worldwide reached Europe through Arabic astronomy like his. He also described the Andromeda galaxy as a \"small cloud\".",fr:"Beaucoup de noms d'étoiles utilisés dans le monde sont arrivés en Europe par l'astronomie arabe comme la sienne. Il décrit aussi la galaxie d'Andromède comme un « petit nuage »."},
  q:{en:"Why does a name given a thousand years ago still survive?",fr:"Pourquoi un nom donné il y a mille ans survit-il encore ?"},links:[["B9",{en:"Why do so many stars have Arabic names?",fr:"Pourquoi tant d'étoiles portent-elles des noms arabes ?"}],["B10",{en:"Tonight's sky",fr:"Le ciel de ce soir"}]]},
 {id:"biruni",n:"Abū Rayḥān al-Bīrūnī",ar:"أبو الريحان البيروني",d:"973–1048 · Khwarazm, Ghazni",g:"arab",
