  para:true,why:{en:"He measured the Earth's radius from the top of a mountain with angles, and debated whether the Earth or the sky turns. That is Lesson 1's question.",fr:"Il a mesuré le rayon de la Terre depuis le sommet d'une montagne avec des angles, et débattu pour savoir si c'est la Terre ou le ciel qui tourne. C'est la question de la leçon 1."},
  q:{en:"If two descriptions give the same predictions, is one of them more \"real\"?",fr:"Si deux descriptions donnent les mêmes prédictions, l'une est-elle plus « réelle » ?"},links:[["L1",{en:"Lesson 1: Is motion real?",fr:"Leçon 1 : Le mouvement est-il réel ?"}]]},
 {id:"archimedes",n:"Archimedes",ar:"أرخميدس",d:"c. 287–212 BCE · Syracuse",g:"phys",
  idea:{en:"\"Give me a place to stand, and I will move the Earth.\"",fr:"« Donnez-moi un point d'appui, et je déplacerai la Terre. »"},
  para:false,src:{en:"Attributed; reported by Pappus of Alexandria (4th c. CE) and Plutarch",fr:"Attribué ; rapporté par Pappus d'Alexandrie (IVe s.) et Plutarque"},why:{en:"He stated the law of the lever. Lesson 7 asks whether a lever cheats nature.",fr:"Il a énoncé la loi du levier. La leçon 7 demande si le levier trompe la nature."},
  q:{en:"What would he really need besides a place to stand?",fr:"De quoi aurait-il vraiment besoin, en plus d'un point d'appui ?"},links:[["L7",{en:"Lesson 7",fr:"Leçon 7"}]]},
 {id:"galileo",n:"Galileo Galilei",ar:"غاليليو غاليلي",d:"1564–1642 · Italy",g:"phys",
  idea:{en:"Shut yourself below deck in a ship moving smoothly: no experiment inside will tell you whether the ship is moving or at rest.",fr:"Enferme-toi dans la cale d'un navire qui avance sans secousse : aucune expérience à l'intérieur ne te dira si le navire bouge ou est au repos."},
  para:true,src:{en:"Dialogue Concerning the Two Chief World Systems (1632)",fr:"Dialogue sur les deux grands systèmes du monde (1632)"},why:{en:"His ship is the service taxi of Lesson 1.",fr:"Son navire, c'est le taxi-service de la leçon 1."},
  q:{en:"If nothing inside can tell you that you move, in what sense are you moving?",fr:"Si rien à l'intérieur ne peut te dire que tu bouges, en quel sens bouges-tu ?"},links:[["L1",{en:"Lesson 1",fr:"Leçon 1"}]]},
 {id:"newton",n:"Isaac Newton",ar:"إسحاق نيوتن",d:"1643–1727 · England",g:"phys",
  idea:{en:"\"If I have seen further it is by standing on the shoulders of Giants.\"",fr:"« Si j'ai vu plus loin, c'est en me tenant sur les épaules de géants. »"},
  para:false,src:{en:"Letter to Robert Hooke, 5 February 1675/76",fr:"Lettre à Robert Hooke, 5 février 1675/76"},why:{en:"His three laws are the backbone of the Grade 11 mechanics unit.",fr:"Ses trois lois sont la colonne vertébrale de l'unité de mécanique de 1re."},
  q:{en:"Whose shoulders are you standing on?",fr:"Sur les épaules de qui te tiens-tu ?"},links:[["L3",{en:"Lesson 3",fr:"Leçon 3"}],["B3",{en:"Is gravity really a force?",fr:"La gravité est-elle vraiment une force ?"}]]},
 {id:"laplace",n:"Pierre-Simon Laplace",ar:"بيار سيمون لابلاس",d:"1749–1827 · France",g:"phys",
  idea:{en:"An intellect that knew every force and every particle's position at one instant would see the future as clearly as the past.",fr:"Une intelligence qui connaîtrait à un instant toutes les forces et la position de chaque particule verrait l'avenir aussi clairement que le passé."},
  para:true,src:{en:"Philosophical Essay on Probabilities (1814)",fr:"Essai philosophique sur les probabilités (1814)"},why:{en:"\"Laplace's demon\" is tested in Lesson 4 with projectiles and in Beyond with a single atom.",fr:"Le « démon de Laplace » est mis à l'épreuve dans la leçon 4 avec les projectiles et dans Au-delà avec un seul atome."},
  q:{en:"Can anything that is known be fully known?",fr:"Ce qui est connu peut-il être entièrement connu ?"},links:[["L4",{en:"Lesson 4",fr:"Leçon 4"}],["B7",{en:"Can we predict one electron?",fr:"Peut-on prédire un seul électron ?"}]]},
 {id:"mach",n:"Ernst Mach",ar:"إرنست ماخ",d:"1838–1916 · Austria",g:"phys",
  idea:{en:"Science should speak only of what can be observed and measured. \"Force\" and \"absolute space\" must earn their place by describing observations.",fr:"La science ne devrait parler que de ce qui s'observe et se mesure. La « force » et l'« espace absolu » doivent mériter leur place en décrivant des observations."},
  para:true,why:{en:"He is the fourth voice in Lesson 3's debate: is a force a thing, or a description?",fr:"Il est la quatrième voix du débat de la leçon 3 : une force est-elle une chose ou une description ?"},
  q:{en:"Is something unreal just because we cannot see it directly?",fr:"Une chose est-elle irréelle parce qu'on ne la voit pas directement ?"},links:[["L3",{en:"Lesson 3",fr:"Leçon 3"}],["B1",{en:"Planets we can't see",fr:"Des planètes qu'on ne voit pas"}]]},
 {id:"noether",n:"Emmy Noether",ar:"إيمي نويثر",d:"1882–1935 · Germany, USA",g:"phys",
  idea:{en:"Every continuous symmetry of the laws of physics comes with a conserved quantity. Energy is conserved because the laws of physics are the same today as tomorrow.",fr:"À chaque symétrie continue des lois de la physique correspond une grandeur conservée. L'énergie se conserve parce que les lois de la physique sont les mêmes aujourd'hui et demain."},
  para:true,src:{en:"Noether's theorem (1918)",fr:"Théorème de Noether (1918)"},why:{en:"The deepest answer to Lesson 10's question about why energy is conserved.",fr:"La réponse la plus profonde à la question de la leçon 10 sur la conservation de l'énergie."},
  q:{en:"What would change if the laws of nature changed from day to day?",fr:"Que changerait-il si les lois de la nature changeaient d'un jour à l'autre ?"},links:[["L10",{en:"Lesson 10",fr:"Leçon 10"}],["B4",{en:"Why do dead stars spin so fast?",fr:"Pourquoi les étoiles mortes tournent-elles si vite ?"}]]},
 {id:"einstein",n:"Albert Einstein",ar:"ألبرت أينشتاين",d:"1879–1955 · Germany, Switzerland, USA",g:"phys",
  idea:{en:"A person falling freely does not feel their own weight. He called this realisation (1907, recalled in a 1920 manuscript) \"the happiest thought of my life\".",fr:"Une personne en chute libre ne ressent pas son propre poids. Il a appelé cette idée (1907, racontée dans un manuscrit de 1920) « la pensée la plus heureuse de ma vie »."},
  para:true,why:{en:"From that thought came general relativity: gravity as curved spacetime.",fr:"De cette pensée est née la relativité générale : la gravité comme espace-temps courbé."},
  q:{en:"Why can a simple thought experiment be worth years of calculation?",fr:"Pourquoi une simple expérience de pensée peut-elle valoir des années de calcul ?"},links:[["B2",{en:"Is time the same for everyone?",fr:"Le temps est-il le même pour tous ?"}],["B3",{en:"Is gravity really a force?",fr:"La gravité est-elle vraiment une force ?"}]]},
 {id:"feynman",n:"Richard Feynman",ar:"ريتشارد فاينمان",d:"1918–1988 · USA",g:"phys",
  idea:{en:"The double-slit experiment contains the only mystery of quantum mechanics. We cannot explain it away; we can only describe how it works.",fr:"L'expérience des fentes d'Young contient le seul mystère de la mécanique quantique. On ne peut pas l'expliquer de façon rassurante ; seulement décrire comment elle marche."},
  para:true,src:{en:"The Feynman Lectures on Physics, vol. III",fr:"Le cours de physique de Feynman, vol. III"},why:{en:"His honesty about what physics does not understand is a model for Sabab.",fr:"Son honnêteté sur ce que la physique ne comprend pas est un modèle pour Sabab."},
  q:{en:"Is \"I don't know\" a failure or a starting point?",fr:"« Je ne sais pas » : échec ou point de départ ?"},links:[["B8",{en:"Two places at once",fr:"À deux endroits à la fois"}]]},
 {id:"bell",n:"Jocelyn Bell Burnell",ar:"جوسلين بيل بورنيل",d:"b. 1943 · Northern Ireland",g:"phys",
  idea:{en:"She noticed a tiny, regular signal on kilometres of chart paper that others could have dismissed as noise. It was the first pulsar.",fr:"Elle a remarqué un petit signal régulier sur des kilomètres de papier d'enregistrement que d'autres auraient pu prendre pour du bruit. C'était le premier pulsar."},
  para:true,why:{en:"A lesson in attention: discoveries often hide in what looks like error.",fr:"Une leçon d'attention : les découvertes se cachent souvent dans ce qui ressemble à une erreur."},
  q:{en:"When is an error actually a discovery?",fr:"Quand une erreur est-elle en fait une découverte ?"},links:[["B4",{en:"Why do dead stars spin so fast?",fr:"Pourquoi les étoiles mortes tournent-elles si vite ?"}]]},
 {id:"lipman",n:"Matthew Lipman",ar:"ماثيو ليبمان",d:"1922–2010 · USA",g:"edu",
  idea:{en:"Children can do philosophy. In a community of inquiry, a class thinks together: listening, questioning, giving reasons and building on each other's ideas.",fr:"Les enfants peuvent philosopher. Dans une communauté de recherche, une classe pense ensemble : écouter, questionner, donner des raisons et construire sur les idées des autres."},
  para:true,why:{en:"The founder of Philosophy for Children. Step 2 of every Sabab lesson is a community of inquiry.",fr:"Le fondateur de la Philosophie pour enfants. L'étape 2 de chaque leçon Sabab est une communauté de recherche."},
  q:{en:"What makes a discussion a real inquiry rather than a debate to win?",fr:"Qu'est-ce qui fait d'une discussion une vraie recherche plutôt qu'un débat à gagner ?"},links:[["voices",{en:"Student Voices",fr:"Voix des élèves"}]]}
];
const TGROUPS=[["all",{en:"All",fr:"Tous"}],["arab",{en:"Arab and Muslim scholars",fr:"Savants arabes et musulmans"}],["phys",{en:"Physicists",fr:"Physiciens"}],["edu",{en:"Education and philosophy",fr:"Éducation et philosophie"}]];
function renderThinkers(){
  const tx=(en,fr)=>S.lang==="fr"?fr:en; const f=S.thF||"all";
  const list=THINKERS.filter(t=>f==="all"||t.g===f);
  $("#main").innerHTML=`
  <section class="sec"><span class="kicker">${tx("Thinkers","Penseurs")} · <span class="ar" style="display:inline">مفكّرون</span></span>
    <h1>${tx("The people behind the questions","Les personnes derrière les questions")}</h1>
    <p class="lede">${tx("Scientists, scholars and educators whose ideas appear in Sabab's lessons and explorations. Each card gives one idea, where you meet it on the platform, and a question to argue about.","Des scientifiques, savants et éducateurs dont les idées apparaissent dans les leçons et explorations de Sabab. Chaque carte donne une idée, où la retrouver sur la plateforme, et une question à débattre.")}</p>
    <div class="filters" role="group" aria-label="${tx("Filter","Filtrer")}">${TGROUPS.map(([k,n])=>`<button class="fchip" data-thf="${k}" aria-pressed="${f===k}">${L(n)}</button>`).join("")}</div>
  </section>
  <div class="thgrid">${list.map(t=>`<article class="thcard" id="th-${t.id}">
    <div><h3 style="margin:0">${t.n}</h3><p class="ar" style="margin:0;font-size:.95rem">${t.ar}</p><small class="muted">${t.d}</small></div>
    <blockquote class="thq">${L(t.idea)}</blockquote>
    <small class="muted">${t.para?tx("Paraphrase","Paraphrase"):tx("Quotation","Citation")}${t.src?" · "+L(t.src):""}</small>
    <p style="margin:0;font-size:.95rem">${L(t.why)}</p>
    <div class="disc"><span class="lbl">${tx("Question to argue","Question à débattre")}</span><p style="margin:0">${L(t.q)}</p></div>
    <div class="row" style="gap:6px;flex-wrap:wrap">${t.links.map(([k,lab])=>`<button class="sbtn ghost" data-thl="${k}">${L(lab)} →</button>`).join("")}</div>
  </article>`).join("")}</div>
  <p class="muted" style="font-size:.88rem">${tx("Most ideas are given as paraphrases so the meaning stays clear; direct quotations are marked. Sources are named where known.","La plupart des idées sont données en paraphrase pour que le sens reste clair ; les citations directes sont signalées. Les sources sont indiquées quand elles sont connues.")}</p>`;
  document.querySelectorAll("[data-thf]").forEach(b=>b.onclick=()=>{S.thF=b.dataset.thf;save();renderThinkers();});
  document.querySelectorAll("[data-thl]").forEach(b=>b.onclick=()=>{const k=b.dataset.thl;
    if(/^L\d+$/.test(k)) openLesson(k,k==="L3"?1:0); else if(/^B\d+$/.test(k)) openExplore(k); else if(k==="voices") go("voices"); else if(k==="ladder"){openLesson("L3",5);}});
}
function morinBandHTML(tx){
  return `<section class="sec morin">
    <blockquote>
      <p>${tx("“School teaches knowledge in separate boxes: maths here, history there, science somewhere else. But the world does not come in boxes. We have to learn to connect what the system separates.”","« On continue à enseigner une pensée compartimentée et réductrice : les maths ici, l'histoire là, les sciences ailleurs. Mais le monde ne se découpe pas en cases. Il faut apprendre à relier ce que le système sépare. »")}</p>
      <p class="ar" style="margin:0">«نتعلّم المعرفة في صناديق منفصلة، لكنّ العالم لا ينقسم إلى صناديق.»</p>
      <footer>${tx("After Edgar Morin, philosopher of complex thinking (paraphrase)","D'après Edgar Morin, philosophe de la pensée complexe (paraphrase)")}</footer>
    </blockquote>
    <div class="morin-side"><p style="margin:0">${tx("Sabab starts from one physics concept and follows it into the community, the world and our values. Physics is where the connecting starts, not where it ends.","Sabab part d'un concept de physique et le suit jusque dans la société, le monde et nos valeurs. La physique est le point de départ des liens, pas leur fin.")}</p>
      <button class="btn ghost" id="hThink">${tx("Meet the thinkers","Découvrir les penseurs")} →</button></div>
  </section>`;
}

/* ===== Story reader: "The Swing Under the Fig Tree" (AR / EN / FR) ===== */
const STORIES={swing:{
 title:{ar:"أرجوحة تحت التينة",en:"The Swing Under the Fig Tree",fr:"La balançoire sous le figuier"},
 lesson:"L10",
 body:{
 ar:[
"لا أحد يسأل الأرجوحة عن رأيها.",
"يربطونها بحبلين إلى غصن تينة عجوز، ويتشاجرون على الدور، ثمّ يتركونها في المساء تتأرجح وحدها مع الريح. أنا تلك الأرجوحة: لوح خشب وحبلان، في حديقة بيت الجدّ أبي سليم، في قرية معلّقة على كتف الجبل.",
"ذلك الصباح وصل الولدان قبل أن يجفّ الندى عن خشبي. ريم أوّلًا، بخطواتها الطويلة وكتاب تحت إبطها لم تفتحه طوال الصيف. ثمّ سامي، أخوها الصغير، يركض ويصرخ:",
"— دوري أنا! سأطير أعلى منكِ!",
"جلس سامي، ودفعه الجدّ دفعة واحدة، ثمّ عاد إلى كرسيّه الخيزران وفنجان قهوته.",
"ارتفعنا. وكلّما ارتفعنا تباطأنا، حتّى جاءت تلك اللحظة التي أحبّها أكثر من أيّ شيء في العالم: في أعلى القوس توقّفنا. لا صعود ولا نزول. لحظة واحدة، كطرفة عين، لكنّها تبدو نصف ثانية كاملة يحبس فيها سامي أنفاسه، ويحبس العالم أنفاسه معه. ثمّ هوينا، أسرع فأسرع، ومررنا في الأسفل كالسهم، وصعدنا إلى الجهة الأخرى.",
"صرخ سامي:",
"— ريم! توقّفتُ! في الأعلى توقّفتُ، ولم يكن هناك شيء يمسكني!",
"قالت ريم من تحت التينة من دون أن ترفع عينيها عن الكتاب:",
"— هذا طبيعيّ. صارت سرعتك صفرًا.",
"— وأين ذهبت؟",
"رفعت ريم رأسها هذه المرّة. فتحت فمها لتجيب، ثمّ أغلقته. فالسرعة لا تذهب إلى الدكّان، ولا تنام في الخزانة. نظرت إليّ طويلًا وأنا أهوي من جديد، وقالت ببطء، كأنّها تكتشف الجواب وهي تقوله:",
"— لم تذهب إلى أيّ مكان… تحوّلت إلى ارتفاع. وحين تنزل، يعود الارتفاع سرعة.",
"ضحك الجدّ في فنجانه ولم يقل شيئًا. هو هكذا دائمًا: يترك الأسئلة تنضج وحدها، مثل التين.",
"*",
"لكنّ سامي كان مشغولًا بمشكلة أكبر. فبعد قليل صرخ غاضبًا:",
"— جدّي! إنّها تنزل! كلّ مرّة تصعد أقلّ!",
"وكان محقًّا. شبرًا بعد شبر، كانت أقواسي تقصر. لم أكن أفعل ذلك عمدًا. أنا نفسي كنت أشعر أنّ شيئًا ينسلّ منّي، كالماء من كفّ مفتوحة.",
"قال الجدّ:",
"— ومن تظنّه يأخذها منك؟",
"نظر سامي حوله بعينين تبحثان عن لصّ. الغصن؟ الريح؟ القطّة التي تراقبنا من فوق الحائط؟",
"وفي تلك اللحظة، من فوق رأسه تمامًا، أطلق حبلي صريره المعتاد: «زييييق… زييييق».",
"قالت ريم:",
"— ضع يدك على الحبل، هناك في الأعلى عند الغصن.",
"صعد سامي على الكرسيّ ولمس الحبل حيث يلتفّ على الغصن، ثمّ سحب يده مندهشًا:",
"— إنّه دافئ!",
"— أرأيت؟ لا يوجد لصّ. كلّما احتكّ الحبل بالغصن، صار قليل من حركتك دفئًا. وقليل منها يصير هذا الصوت. وقليل يضيع في الهواء الذي يضرب وجهك.",
"جلس سامي على الأرض يفكّر، وهي حالة نادرة عنده. ثمّ قال:",
"— يعني أنّ الأرجوحة تعطي من نفسها للغصن… من دون أن تقصد.",
"وسكت الجميع. حتّى أنا، لم أكن قد فكّرتُ في الأمر هكذا من قبل. هل يكون العطاء عطاءً إذا لم نقصده؟ أم أنّه مجرّد خسارة لها اسم جميل؟",
"*",
"عند الظهيرة نام الجدّ على كرسيّه، ودخلت ريم لتساعد جدّتها في لفّ ورق العنب. وبقي سامي وحده يريد أن يلعب.",
"قال: «سأدفعكِ أنا!» ووقف خلفي. دفعني بكلّ قوّته فابتعدتُ، ثمّ عدتُ نحوه… وفي تلك اللحظة بالذات، وأنا آتية إليه، دفعني من جديد.",
"ارتطمتُ بيديه الصغيرتين. توقّفتُ فجأة، وسقط سامي على ظهره في التراب.",
"ركضت ريم على صوت البكاء، وتبعها الجدّ نصف نائم. نفض سامي التراب عن ثيابه وقال وهو يشهق:",
"— كنتُ أساعدها!",
"جلس الجدّ القرفصاء أمامه:",
"— أعرف. لكنّ الدفعة يا صغيري لا تنفع إلّا في وقتها. إذا دفعتَها وهي تبتعد عنك رفعتَها، وإذا دفعتَها وهي آتية نحوك أوقفتَها. اليد نفسها، والقوّة نفسها.",
"ثمّ نظر إلى ريم نظرة طويلة، وقال كمن يتذكّر شيئًا بعيدًا:",
"— وهكذا البشر أيضًا. هناك مساعدة تصل في وقتها فترفعك، ومساعدة تصل في غير وقتها فتوقعك أرضًا.",
"سألت ريم:",
"— وكيف تعرف متى يكون الوقت الصحيح؟",
"ابتسم الجدّ:",
"— تراقب. تنتظر. تشعر بالحركة قبل أن تدفع.",
"ثمّ دفعني دفعات خفيفة، كلّ واحدة منها في اللحظة الصحيحة تمامًا، فارتفعتُ أعلى من كلّ دفعات سامي القويّة.",
"*",
"بعد الغداء، حين خفتت الأصوات في البيت، خرج أبو بريص من شقّ الحائط وتسلّق حبلي الأيسر حتّى صار فوقي تمامًا. أبو بريص هو فيلسوف الحديقة. لا يعمل شيئًا طوال اليوم إلّا الاستلقاء في الشمس والتفكير، ويقول إنّ هذا أصعب عمل في العالم.",
"همستُ له:",
"— يا أبا بريص، صرتُ أعرف من أين تأتي حركتي: من يد الجدّ. لكن يد الجدّ، من أين تأتي بحركتها؟",
"فتح عينًا واحدة:",
"— من الفطور. أكل منقوشة زعتر.",
"— والمنقوشة؟",
"— من القمح. والقمح نما في الشمس.",
"— والزعتر؟",
"— في الشمس.",
"— والتينة التي أتعلّق بها؟",
"أغمض عينه من جديد:",
"— تأكل الشمس كلّ يوم. انظري إلى أوراقها كيف تفتحها كالأيادي.",
"سكتُّ طويلًا. يعني أنّ هذه الشمس التي تشوي ظهر أبي بريص الآن هي نفسها التي رفعت سامي هذا الصباح؟ بعد رحلة طويلة من الشمس إلى القمح، إلى المنقوشة، إلى يد الجدّ، إلى خشبي، إلى صريري، إلى دفء الغصن؟",
"— وإلى أين يذهب الدفء الذي في الغصن؟",
"— إلى الهواء. إلى الليل. إلى كلّ مكان.",
"— يعني أنّه يضيع؟",
"تمطّى أبو بريص حتّى ظهرت أصابعه الصغيرة كلّها:",
"— لا يضيع. يتفرّق. يتفرّق كثيرًا حتّى لا يستطيع أحد أن يجمعه ويدفعك به من جديد.",
"ثمّ نام. ولم أعرف إن كان ما قاله حزينًا أم مطمئنًا.",
"*",
"في المساء جاءت أمّ ريم لتأخذ الولدين. مرّت من أمامي، ثمّ توقّفت ورجعت خطوتين. وضعت يدها على حبلي كما يضع أحدهم يده على كتف صديق قديم.",
"— أبي… أهذه الأرجوحة نفسها التي كنتَ تدفعني عليها؟",
"— هي نفسها.",
"ضحكت ريم:",
"— كيف تكون نفسها؟ الحبال جديدة، والخشبة تبدو جديدة.",
"— صحيح. غيّرتُ الحبال مرّتين، والخشبة ثلاث مرّات.",
"— يعني لم يبقَ منها شيء! فكيف تكون هي نفسها؟",
"حكّ الجدّ ذقنه ونظر إليّ، ثمّ إلى التينة، ثمّ إلى ابنته:",
"— ربّما ليست الأرجوحة هي الخشبة. ربّما هي المكان تحت التينة… واللعبة… والدفعات.",
"قالت الأمّ بصوت خفيض:",
"— وأنتَ الذي كنتَ تدفع.",
"وجلست عليّ. امرأة كبيرة على أرجوحة أطفال. ووقفت ريم خلفها من دون أن يطلب منها أحد، ودفعتها. دفعة خفيفة، في وقتها تمامًا.",
"سكت الجدّ. وضع فنجانه على الأرض ولم يلتقطه مرّة أخرى. ولاحظتُ أنّ عينيه لمعتا، كما يلمع خشبي حين يبلّله الندى.",
"وسأل سامي، الذي لا يترك صمتًا يمرّ من دون سؤال:",
"— جدّي، لماذا تبكي؟",
"— لا أبكي. لكن… ثلاثون سنة يا صغيري. الدفعة التي دفعتُها لأمّك، عادت إلى أمّك من يد ابنتها.",
"— يعني أنّ الدفعة لا تضيع؟",
"لم يُجب الجدّ. ولم يُجب أحد. لكنّ السؤال بقي معلّقًا في الهواء فوقنا، مثلي تمامًا في أعلى القوس.",
"*",
"قبل أن يغادروا، ركضت ريم وقفزت عليّ للمرّة الأخيرة. لم تطلب من أحد أن يدفعها. مالت إلى الخلف ومدّت ساقيها ونحن نندفع إلى الأمام، ثمّ اعتدلت وثنت ساقيها ونحن نرجع، مرّة بعد مرّة، في الوقت الصحيح تمامًا. وصعدنا. صعدنا أعلى من كلّ دفعات الجدّ.",
"صفّق سامي:",
"— كيف فعلتِها؟ لم يدفعكِ أحد!",
"قالت ريم وهي تلهث:",
"— دفعتُ نفسي.",
"— مستحيل! الأرجوحة لا تصعد وحدها!",
"— الأرجوحة لا. أنا نعم.",
"وكان سامي محقًّا، وكانت ريم محقّة. فأنا أعرف قانوني جيّدًا: لا أصعد أبدًا أعلى من المكان الذي بدأتُ منه، إلّا إذا أعطاني أحد شيئًا من الخارج. أمّا ريم، فأخرجت الحركة من داخلها.",
"*",
"الليلة، والحديقة مظلمة، والبيت نائم، لا يحرّكني إلّا الهواء. وأبو بريص ساهر على الحائط.",
"قلتُ له:",
"— ريم صعدت وحدها.",
"قال:",
"— من المنقوشة. كلّه من المنقوشة ومن الشمس.",
"— لكنّ المنقوشة لم تقرّر متى تميل ومتى تعتدل. ريم هي التي قرّرت.",
"لم يُجب أبو بريص هذه المرّة. وأظنّه لم يكن نائمًا.",
"ولأنّني أرجوحة، ولا أحد يسأل الأرجوحة عن رأيها، سأترككم مع السؤال الذي تركه الجميع معلّقًا عندي: هل الإرادة نوعٌ من الطاقة، أم شيء آخر لا تعرفه قوانيني؟"
 ],
 en:[
"Nobody ever asks the swing what it thinks.",
"They tie it with two ropes to the branch of an old fig tree, they fight over whose turn it is, and in the evening they leave it to rock alone in the wind. I am that swing: a plank of wood and two ropes, in the garden of Grandpa Abu Salim's house, in a village hanging on the shoulder of the mountain.",
"That morning the two children arrived before the dew had dried on my wood. Reem first, with her long strides and a book under her arm that she had not opened all summer. Then Sami, her little brother, running and shouting:",
"— My turn! I'm going to fly higher than you!",
"Sami sat down. Grandpa gave him one push, then went back to his cane chair and his cup of coffee.",
"We rose. And the higher we rose, the slower we went, until the moment came that I love more than anything in the world: at the top of the arc, we stopped. Not going up, not coming down. Just an instant, but it felt like a whole half-second, in which Sami held his breath, and the world held its breath with him. Then we fell, faster and faster, shot through the bottom like an arrow, and climbed up the other side.",
"Sami shouted:",
"— Reem! I stopped! At the top I stopped, and nothing was holding me!",
"Reem answered from under the fig tree without lifting her eyes from her book:",
"— That's normal. Your speed became zero.",
"— So where did it go?",
"This time Reem raised her head. She opened her mouth to answer, then closed it. Speed does not go to the corner shop, and it does not sleep in the cupboard. She watched me for a long time as I swooped down again, and said slowly, as if she were discovering the answer while saying it:",
"— It didn't go anywhere… it turned into height. And when you come down, the height turns back into speed.",
"Grandpa laughed into his coffee and said nothing. He is always like that: he lets questions ripen on their own, like figs.",
"*",
"But Sami was busy with a bigger problem. A little later he shouted, annoyed:",
"— Grandpa! It's going down! Every time it goes up less!",
"He was right. Inch by inch, my arcs were getting shorter. I was not doing it on purpose. I could feel it myself, something slipping away from me, like water from an open hand.",
"Grandpa said:",
"— And who do you think is taking it from you?",
"Sami looked around with the eyes of a detective looking for a thief. The branch? The wind? The cat watching us from the top of the wall?",
"At that very moment, right above his head, my rope let out its usual creak: \"Creeeak… creeeak.\"",
"Reem said:",
"— Put your hand on the rope, up there where it meets the branch.",
"Sami climbed onto the chair and touched the rope where it wraps around the branch, then pulled his hand back in surprise:",
"— It's warm!",
"— See? There's no thief. Every time the rope rubs against the branch, a little of your motion turns into warmth. A little turns into that sound. And a little gets lost in the air that hits your face.",
"Sami sat down on the ground to think, which is rare for him. Then he said:",
"— So the swing gives some of itself to the branch… without meaning to.",
"Everyone went quiet. Even I had never thought of it that way. Is giving still giving if we don't mean it? Or is it just a loss with a nice name?",
"*",
"At noon Grandpa fell asleep in his chair, and Reem went in to help her grandmother roll vine leaves. Sami stayed alone, wanting to play.",
"He said, \"I'll push you myself!\" and stood behind me. He pushed with all his strength and I swung away, then came back toward him… and at that exact moment, as I was coming toward him, he pushed again.",
"I crashed into his small hands. I stopped dead, and Sami fell on his back in the dust.",
"Reem ran out at the sound of crying, with Grandpa behind her, half asleep. Sami brushed the dust off his clothes and said between sobs:",
"— I was helping her!",
"Grandpa crouched down in front of him:",
"— I know. But a push, my little one, only helps at the right time. If you push while it's moving away from you, you lift it. If you push while it's coming toward you, you stop it. The same hand, the same strength.",
"Then he looked at Reem for a long time, and said like someone remembering something far away:",
"— And people are like that too. Some help arrives at the right time and lifts you up. Some help arrives at the wrong time and knocks you down.",
"Reem asked:",
"— And how do you know when it's the right time?",
"Grandpa smiled:",
"— You watch. You wait. You feel the movement before you push.",
"Then he gave me a few gentle pushes, each at exactly the right moment, and I rose higher than with all of Sami's strong pushes.",
"*",
"After lunch, when the house had gone quiet, Old Gecko came out of a crack in the wall and climbed my left rope until he was right above me. Old Gecko is the philosopher of the garden. He does nothing all day but lie in the sun and think, and he says it is the hardest job in the world.",
"I whispered to him:",
"— Old Gecko, now I know where my motion comes from: from Grandpa's hand. But Grandpa's hand, where does it get its motion?",
"He opened one eye:",
"— From breakfast. He ate a za'atar flatbread.",
"— And the flatbread?",
"— From wheat. And the wheat grew in the sun.",
"— And the za'atar?",
"— In the sun.",
"— And the fig tree I hang from?",
"He closed his eye again:",
"— It eats sunlight every day. Look at its leaves, open like hands.",
"I was silent for a long time. So this same sun roasting Old Gecko's back right now was the one that lifted Sami this morning? After a long journey from the sun to the wheat, to the flatbread, to Grandpa's hand, to my wood, to my creak, to the warmth in the branch?",
"— And where does the warmth in the branch go?",
"— Into the air. Into the night. Everywhere.",
"— So it's lost?",
"Old Gecko stretched until all his tiny toes showed:",
"— It isn't lost. It spreads out. It spreads out so much that no one can gather it up again to push you with it.",
"Then he fell asleep. And I could not tell whether what he said was sad or comforting.",
"*",
"In the evening, Reem's mother came to take the children home. She walked past me, then stopped and came back two steps. She put her hand on my rope the way you put your hand on an old friend's shoulder.",
"— Dad… is this the same swing you used to push me on?",
"— The very same.",
"Reem laughed:",
"— How can it be the same? The ropes are new, and the plank looks new.",
"— True. I've changed the ropes twice, and the plank three times.",
"— So nothing of it is left! How can it be the same?",
"Grandpa scratched his chin and looked at me, then at the fig tree, then at his daughter:",
"— Maybe the swing isn't the wood. Maybe it's the place under the fig tree… and the game… and the pushes.",
"The mother said quietly:",
"— And you, the one who pushed.",
"And she sat on me. A grown woman on a children's swing. Reem stood behind her without anyone asking, and pushed her. A gentle push, at exactly the right time.",
"Grandpa went silent. He put his cup down on the ground and did not pick it up again. I noticed his eyes were shining, the way my wood shines when the dew wets it.",
"And Sami, who never lets a silence pass without a question, asked:",
"— Grandpa, why are you crying?",
"— I'm not crying. It's just… thirty years, my little one. The push I gave your mother came back to your mother from her daughter's hand.",
"— So a push is never lost?",
"Grandpa did not answer. Nobody answered. But the question stayed hanging in the air above us, just like me at the top of the arc.",
"*",
"Before they left, Reem ran and jumped on me one last time. She did not ask anyone to push her. She leaned back and stretched out her legs as we swung forward, then sat up and tucked them in as we swung back, again and again, at exactly the right moments. And we rose. We rose higher than all of Grandpa's pushes.",
"Sami clapped:",
"— How did you do that? Nobody pushed you!",
"Reem said, out of breath:",
"— I pushed myself.",
"— Impossible! A swing can't go up by itself!",
"— The swing can't. I can.",
"Sami was right, and Reem was right. I know my law well: I never rise higher than the place I started from, unless someone gives me something from outside. But Reem brought the motion out from inside herself.",
"*",
"Tonight, with the garden dark and the house asleep, only the air moves me. Old Gecko is awake on the wall.",
"I said to him:",
"— Reem went up by herself.",
"He said:",
"— From the flatbread. It all comes from the flatbread and the sun.",
"— But the flatbread didn't decide when to lean back and when to sit up. Reem decided.",
"This time Old Gecko did not answer. And I don't think he was asleep.",
"And because I am a swing, and nobody ever asks the swing what it thinks, I will leave you with the question everyone left hanging with me: is will a kind of energy, or something else that my laws do not know?"
 ],
 fr:[
"Personne ne demande jamais son avis à la balançoire.",
"On l'attache avec deux cordes à la branche d'un vieux figuier, on se dispute pour savoir à qui le tour, et le soir on la laisse se balancer seule dans le vent. Je suis cette balançoire : une planche de bois et deux cordes, dans le jardin de la maison de grand-père Abou Salim, dans un village accroché à l'épaule de la montagne.",
"Ce matin-là, les deux enfants sont arrivés avant que la rosée ait séché sur mon bois. Reem d'abord, avec ses grandes enjambées et un livre sous le bras qu'elle n'avait pas ouvert de tout l'été. Puis Sami, son petit frère, qui courait en criant :",
"— C'est mon tour ! Je vais voler plus haut que toi !",
"Sami s'est assis. Grand-père lui a donné une seule poussée, puis il est retourné à sa chaise en rotin et à sa tasse de café.",
"Nous sommes montés. Et plus nous montions, plus nous ralentissions, jusqu'à ce que vienne l'instant que j'aime plus que tout au monde : en haut de l'arc, nous nous sommes arrêtés. Ni monter ni descendre. Un simple instant, qui semblait durer une demi-seconde entière, pendant lequel Sami retenait son souffle, et le monde retenait son souffle avec lui. Puis nous sommes retombés, de plus en plus vite, nous avons filé en bas comme une flèche, et nous sommes remontés de l'autre côté.",
"Sami a crié :",
"— Reem ! Je me suis arrêté ! En haut je me suis arrêté, et rien ne me tenait !",
"Reem a répondu de sous le figuier, sans lever les yeux de son livre :",
"— C'est normal. Ta vitesse est devenue nulle.",
"— Et elle est allée où ?",
"Cette fois, Reem a levé la tête. Elle a ouvert la bouche pour répondre, puis l'a refermée. La vitesse ne va pas à l'épicerie, et elle ne dort pas dans le placard. Elle m'a regardée longtemps redescendre, et elle a dit lentement, comme si elle découvrait la réponse en la disant :",
"— Elle n'est allée nulle part… elle s'est changée en hauteur. Et quand tu redescends, la hauteur redevient vitesse.",
"Grand-père a ri dans son café sans rien dire. Il est toujours comme ça : il laisse les questions mûrir toutes seules, comme les figues.",
"*",
"Mais Sami avait un problème plus grave. Un peu plus tard, il a crié, fâché :",
"— Grand-père ! Elle descend ! À chaque fois elle monte moins haut !",
"Il avait raison. Centimètre après centimètre, mes arcs raccourcissaient. Je ne le faisais pas exprès. Je sentais moi-même quelque chose s'échapper de moi, comme l'eau d'une main ouverte.",
"Grand-père a dit :",
"— Et qui, d'après toi, te la prend ?",
"Sami a regardé autour de lui avec des yeux de détective à la recherche d'un voleur. La branche ? Le vent ? Le chat qui nous observait du haut du mur ?",
"Juste à ce moment, au-dessus de sa tête, ma corde a lancé son grincement habituel : « Criiiic… criiiic. »",
"Reem a dit :",
"— Pose ta main sur la corde, là-haut, près de la branche.",
"Sami est monté sur la chaise et a touché la corde là où elle s'enroule autour de la branche, puis il a retiré sa main, étonné :",
"— Elle est chaude !",
"— Tu vois ? Il n'y a pas de voleur. Chaque fois que la corde frotte contre la branche, un peu de ton mouvement devient de la chaleur. Un peu devient ce bruit. Et un peu se perd dans l'air qui te frappe le visage.",
"Sami s'est assis par terre pour réfléchir, ce qui est rare chez lui. Puis il a dit :",
"— Alors la balançoire donne un peu d'elle-même à la branche… sans le vouloir.",
"Tout le monde s'est tu. Même moi, je n'y avais jamais pensé ainsi. Donner, est-ce encore donner quand on ne le veut pas ? Ou est-ce seulement une perte qui porte un joli nom ?",
"*",
"À midi, grand-père s'est endormi dans sa chaise, et Reem est rentrée aider sa grand-mère à rouler des feuilles de vigne. Sami est resté seul, avec l'envie de jouer.",
"Il a dit : « Je vais te pousser moi-même ! » et il s'est placé derrière moi. Il a poussé de toutes ses forces et je me suis éloignée, puis je suis revenue vers lui… et à cet instant précis, pendant que je venais vers lui, il a poussé de nouveau.",
"J'ai heurté ses petites mains. Je me suis arrêtée net, et Sami est tombé sur le dos dans la poussière.",
"Reem est accourue en entendant les pleurs, suivie de grand-père à moitié endormi. Sami a épousseté ses vêtements et a dit en sanglotant :",
"— Je voulais l'aider !",
"Grand-père s'est accroupi devant lui :",
"— Je sais. Mais une poussée, mon petit, n'aide qu'au bon moment. Si tu pousses pendant qu'elle s'éloigne de toi, tu la fais monter. Si tu pousses pendant qu'elle vient vers toi, tu l'arrêtes. La même main, la même force.",
"Puis il a regardé Reem longtemps, et il a dit, comme quelqu'un qui se souvient de quelque chose de lointain :",
"— Et les gens sont pareils. Il y a une aide qui arrive au bon moment et qui te relève, et une aide qui arrive au mauvais moment et qui te fait tomber.",
"Reem a demandé :",
"— Et comment sait-on quand c'est le bon moment ?",
"Grand-père a souri :",
"— On observe. On attend. On sent le mouvement avant de pousser.",
"Puis il m'a donné quelques poussées légères, chacune exactement au bon moment, et je suis montée plus haut qu'avec toutes les grosses poussées de Sami.",
"*",
"Après le déjeuner, quand la maison est devenue silencieuse, le vieux Gecko est sorti d'une fissure du mur et a grimpé le long de ma corde gauche jusqu'à se trouver juste au-dessus de moi. Le vieux Gecko est le philosophe du jardin. Il ne fait rien de la journée que s'allonger au soleil et réfléchir, et il dit que c'est le métier le plus difficile du monde.",
"Je lui ai chuchoté :",
"— Vieux Gecko, maintenant je sais d'où vient mon mouvement : de la main de grand-père. Mais la main de grand-père, d'où tient-elle son mouvement ?",
"Il a ouvert un œil :",
"— Du petit-déjeuner. Il a mangé une galette au zaatar.",
"— Et la galette ?",
"— Du blé. Et le blé a poussé au soleil.",
"— Et le zaatar ?",
"— Au soleil.",
"— Et le figuier auquel je suis suspendue ?",
"Il a refermé son œil :",
"— Il mange du soleil tous les jours. Regarde ses feuilles, ouvertes comme des mains.",
"Je suis restée longtemps silencieuse. Alors ce même soleil qui chauffe le dos du vieux Gecko en ce moment est celui qui a fait monter Sami ce matin ? Après un long voyage du soleil au blé, à la galette, à la main de grand-père, à mon bois, à mon grincement, à la chaleur de la branche ?",
"— Et la chaleur qui est dans la branche, où va-t-elle ?",
"— Dans l'air. Dans la nuit. Partout.",
"— Alors elle est perdue ?",
"Le vieux Gecko s'est étiré jusqu'à montrer tous ses petits doigts :",
"— Elle n'est pas perdue. Elle se disperse. Elle se disperse tellement que personne ne peut la rassembler pour te pousser avec elle de nouveau.",
"Puis il s'est endormi. Et je n'ai pas su si ce qu'il avait dit était triste ou rassurant.",
"*",
"Le soir, la mère de Reem est venue chercher les enfants. Elle est passée devant moi, puis elle s'est arrêtée et a reculé de deux pas. Elle a posé la main sur ma corde comme on pose la main sur l'épaule d'un vieil ami.",
"— Papa… c'est bien la même balançoire sur laquelle tu me poussais ?",
"— La même.",
"Reem a ri :",
"— Comment ça, la même ? Les cordes sont neuves, et la planche a l'air neuve.",
"— C'est vrai. J'ai changé les cordes deux fois, et la planche trois fois.",
"— Alors il n'en reste rien ! Comment peut-elle être la même ?",
"Grand-père s'est gratté le menton et m'a regardée, puis il a regardé le figuier, puis sa fille :",
"— Peut-être que la balançoire, ce n'est pas le bois. Peut-être que c'est l'endroit sous le figuier… et le jeu… et les poussées.",
"La mère a dit à voix basse :",
"— Et toi, celui qui poussait.",
"Et elle s'est assise sur moi. Une femme adulte sur une balançoire d'enfant. Reem s'est placée derrière elle sans que personne le lui demande, et l'a poussée. Une poussée légère, exactement au bon moment.",
"Grand-père s'est tu. Il a posé sa tasse par terre et ne l'a plus reprise. J'ai remarqué que ses yeux brillaient, comme brille mon bois quand la rosée le mouille.",
"Et Sami, qui ne laisse jamais passer un silence sans une question, a demandé :",
"— Grand-père, pourquoi tu pleures ?",
"— Je ne pleure pas. C'est juste… trente ans, mon petit. La poussée que j'ai donnée à ta mère lui est revenue par la main de sa fille.",
"— Alors une poussée n'est jamais perdue ?",
"Grand-père n'a pas répondu. Personne n'a répondu. Mais la question est restée suspendue dans l'air au-dessus de nous, exactement comme moi en haut de l'arc.",
"*",
"Avant de partir, Reem a couru et a sauté sur moi une dernière fois. Elle n'a demandé à personne de la pousser. Elle se penchait en arrière et tendait les jambes quand nous partions vers l'avant, puis se redressait et repliait les jambes quand nous revenions, encore et encore, exactement aux bons moments. Et nous sommes montées. Nous sommes montées plus haut qu'avec toutes les poussées de grand-père.",
"Sami a applaudi :",
"— Comment tu as fait ? Personne ne t'a poussée !",
"Reem a répondu, essoufflée :",
"— Je me suis poussée moi-même.",
"— Impossible ! Une balançoire ne monte pas toute seule !",
"— La balançoire, non. Moi, oui.",
"Sami avait raison, et Reem avait raison. Je connais bien ma loi : je ne monte jamais plus haut que l'endroit d'où je suis partie, sauf si quelqu'un me donne quelque chose de l'extérieur. Reem, elle, a tiré le mouvement de l'intérieur d'elle-même.",
"*",
"Ce soir, le jardin est sombre et la maison dort. Seul l'air me fait bouger. Le vieux Gecko veille sur le mur.",
"Je lui ai dit :",
"— Reem est montée toute seule.",
"Il a répondu :",
"— Grâce à la galette. Tout vient de la galette et du soleil.",
"— Mais la galette n'a pas décidé quand se pencher et quand se redresser. C'est Reem qui a décidé.",
"Cette fois, le vieux Gecko n'a pas répondu. Et je ne crois pas qu'il dormait.",
"Et parce que je suis une balançoire, et que personne ne demande jamais son avis à la balançoire, je vous laisse avec la question que tout le monde a laissée suspendue près de moi : la volonté est-elle une forme d'énergie, ou autre chose que mes lois ne connaissent pas ?"
 ]}}};

 ar:[
"في الساعة التاسعة وسبع دقائق مساءً، كان الفيديو قد تجاوز ثمانمئة ألف مشاهدة.",
"جلست ريم على الدرج الحجريّ في حديقة جدّها، والهاتف يهتزّ في يدها كطائر صغير يريد أن يفلت. كلّ اهتزازة إشعار جديد: إعجاب، مشاركة، تعليق، متابع. كانت قد توقّفت عن قراءتها منذ ساعة. صارت تكتفي بالنظر إلى الرقم وهو يكبر.",
"الفيديو مدّته أربعون ثانية. صوّرته قبل ثلاثة أيّام لمشروع مادّة الفيزياء: «لماذا يصعد الدخان؟». وقفت أمام شمعة، وشرحت بجدّيّة الكثافة والطفو وأرخميدس. وفي الثانية الثانية والعشرين، قفز قطّ الجيران على الطاولة، وأسقط الشمعة، وحدّق في الكاميرا بوجه متّهم بجريمة لم يرتكبها. ضحكت ريم ضحكة لم تستطع إيقافها، وتركت الفيديو كما هو، لأنّ الوقت كان متأخّرًا.",
"ثمانمئة ألف مشاهدة. أغلب التعليقات عن القطّ.",
"— ما زال يصعد؟",
"رفعت رأسها. كان يوسف، ابن عمّها، يثبّت حامل الكاميرا الثلاثيّ قرب الجرن الحجريّ في آخر الحديقة. يوسف في السابعة عشرة، يقضي ليالي الصيف كلّها في تصوير النجوم، ولديه في حسابه أحد عشر متابعًا، أغلبهم من العائلة.",
"— تسعمئة ألف تقريبًا.",
"— مبروك.",
"قالها من دون سخرية، ومن دون حماس. هكذا يقول يوسف كلّ شيء.",
"*",
"في زاوية الحديقة، كان الجدّ قد جمع أكوام الأوراق اليابسة وأغصان التين المقطوعة، وأشعل فيها النار كما يفعل كلّ آخر صيف، في ليلة هادئة بلا ريح، ودلو ماء إلى جانبه. ارتفع الدخان رماديًّا كثيفًا، ملتفًّا على نفسه، وأخذ يعلو فوق التينة، فوق السطح، فوق عمود الكهرباء.",
"نظرت ريم إليه، ثمّ إلى هاتفها، ثمّ إليه مرّة أخرى، وضحكت وحدها.",
"— ما المضحك؟ سأل يوسف من دون أن يرفع عينه عن الكاميرا.",
"— الدخان. شرحتُ في الفيديو لماذا يصعد، ولم يسمع أحد الشرح. الجميع شاهدوا القطّ.",
"— وماذا قلتِ في الشرح؟",
"— قلتُ إنّه لا يصعد بنفسه. الهواء حول النار ساخن، فيتمدّد وتقلّ كثافته. والهواء البارد حوله أثقل، فينزلق تحته ويدفعه إلى الأعلى. مثل الفلّينة في الماء. الدخان لا «يطير»… يُدفَع.",
"توقّف يوسف عمّا يفعله ونظر إليها. ثمّ نظر إلى الهاتف في يدها. لم يقل شيئًا، لكنّ ريم فهمت. وشعرت بشيء بارد يزحف تحت جلدها، كالهواء الذي يزحف نحو النار.",
"— قلها.",
"— لم أقل شيئًا.",
"— قلها. أنا أيضًا دخان. لم أصعد بنفسي. صعدتُ لأنّ قطًّا قفز على الطاولة، ولأنّ آلافًا من الناس ضغطوا زرّ المشاركة. أنا لم أفعل شيئًا.",
"— لم أقل ذلك.",
"— لكنّك فكّرت فيه.",
"صمت يوسف قليلًا، ثمّ قال بهدوء:",
"— فكّرتُ في شيء آخر. فكّرتُ: هل يوجد شيء يصعد بنفسه أصلًا؟",
"*",
"اقترب سامي، أخو ريم الصغير، يحمل كوب شاي لجدّه، ووقف قرب الجرن. ثمّ صرخ فجأة:",
"— يوسف! في الماء نجمة!",
"كانت هناك فعلًا. نقطة ضوء بيضاء مائلة إلى الزرقة، مستقرّة في منتصف الجرن، على سطح الماء الساكن تحت الحنفيّة. كانت ترتجف قليلًا مع كلّ قطرة تسقط، ثمّ تهدأ.",
"— هذه «النسر الواقع»، قال يوسف. أنا أصوّرها منذ ساعة. في هذا الوقت من الصيف تمرّ فوق رؤوسنا تقريبًا، ولهذا نراها حين ننظر إلى الأسفل في الجرن.",
"جاءت ريم ونظرت. كانت النجمة في الماء تبدو قريبة إلى حدّ أنّها لو مدّت يدها لأخذتها. لكنّها حين انحنت وحدّقت، رأتها بعيدة، في عمق لا يملكه الجرن.",
"— غريب. تبدو كأنّها في قاع أعمق من البئر.",
"— لأنّ الصورة في المرآة تكون خلفها بقدر ما يكون الجسم أمامها. والنجمة بعيدة جدًّا، فصورتها في الماء بعيدة جدًّا أيضًا. الجرن لا يقرّبها. نحن فقط ننظر إليها من الأعلى.",
"— وكم هي بعيدة؟",
"— خمس وعشرون سنة ضوئيّة تقريبًا. الضوء الذي في الجرن الآن خرج منها قبل أن نولد أنا وأنتِ.",
"نظرت ريم إلى النقطة المرتجفة في الماء. ضوء سافر خمسًا وعشرين سنة من دون أن يعرف إلى أين يذهب، ثمّ انتهى في جرن حجريّ في حديقة جدّها، بجانب قشرة بطّيخ.",
"— وهي لا تعرف أنّنا ننظر إليها.",
"— لا. ولا يهمّها.",
"— هذا ما تظنّه أنت.",
"*",
"التقط سامي حصاة ورماها في الجرن.",
"انكسرت النجمة إلى عشرات النقاط الراقصة. شهق سامي، وضحكت ريم. ثمّ هدأ الماء، دائرة بعد دائرة، وعادت النجمة كاملة في مكانها، كأنّ شيئًا لم يحدث.",
"— كسرتُها وعادت! قال سامي.",
"— لم تكسرها، قال يوسف. كسرتَ الماء. النجمة لم تكن هنا أصلًا. ضوؤها يصل في كلّ لحظة، والماء يعيده حين يهدأ.",
"قالت ريم ببطء، وعيناها على الجرن:",
"— وماذا لو كنتُ أنا الصورة، لا النجمة؟",
"— ماذا تقصدين؟",
"— تسعمئة ألف شخص رأوني. لكنّهم لم يروني. رأوا صورتي على شاشاتهم. صورة تنكسر إذا مرّ إصبع على الشاشة، وتعود، وتنكسر. أين أنا من كلّ هذا؟ هل أنا هنا، على الدرج، أم هناك، في تسعمئة ألف هاتف؟",
"لم يُجب يوسف. أدار الكاميرا نحو نجمة الشمال، وضغط الزرّ، وسمعا معًا صوت الغالق يُفتح ولا يُغلق.",
"*",
"— ماذا تفعل؟",
"— صورة بتعريض طويل. سيبقى الغالق مفتوحًا عشرين دقيقة.",
"— لماذا؟",
"— سترين.",
"جلست ريم بجانبه على حافّة الجرن. في الأعلى، كان الدخان قد تغيّر. لم يعد يصعد عموديًّا كما في البداية. صار يعلو أبطأ، ثمّ توقّف عند ارتفاع معيّن فوق الوادي، وبدأ ينبسط أفقيًّا، كأنّه اصطدم بسقف لا يُرى، حتّى صار طبقة رماديّة رقيقة ممدودة فوق بيوت القرية.",
"— لماذا توقّف هناك؟ سألت ريم. كان يجب أن يستمرّ في الصعود.",
"— لماذا؟",
"— لأنّ… لأنّ الدخان يصعد.",
"— أنتِ نفسك قلتِ إنّه لا يصعد، بل يُدفَع. يُدفع ما دام أخفّ من الهواء حوله. لكنّه كلّما علا برد، واختلط بالهواء، فثقل. وفي ليالي الصيف الهادئة، يبرد الهواء القريب من أرض الوادي أسرع من الهواء فوقه، فتتكوّن طبقة دافئة فوق طبقة باردة. حين يصل الدخان إلى هناك، يصير بثقل ما حوله. لا أحد يدفعه بعد ذلك. فيتوقّف، وينتشر.",
"— يعني أنّه صعد ما دام هناك من يدفعه… وتوقّف حين توقّف الدفع.",
"— تقريبًا. حين يتوقّف الدفع لا يتوقّف الدخان فورًا. يتجاوز قليلًا، فيصير أثقل ممّا حوله، فينزل قليلًا، ويهدّئه الهواء. ثمّ ينتشر.",
"نظرت ريم إلى الطبقة الرماديّة فوق القرية، ثمّ إلى هاتفها. توقّفت الاهتزازات منذ دقائق. كانت الأرقام ما تزال تكبر، لكن أبطأ.",
"— كم من الوقت يبقى الدخان هناك؟",
"— حتّى الصباح، ربّما. ثمّ تسخن الأرض، ويتحرّك الهواء، فيتفرّق. يصير في كلّ مكان، ولا يراه أحد.",
"*",
"جاء الجدّ يحرّك النار بعصا طويلة. ارتفعت الشرارات، ثمّ اشتعلت النار أقوى.",
"قالت ريم فجأة، بنبرة فيها شيء من التحدّي:",
"— جدّي، لماذا تشعل النار كلّ سنة؟ الدخان لا ينفع أحدًا. يصعد ويختفي فقط.",
"توقّف الجدّ، ونظر إليها باستغراب:",
"— لا ينفع أحدًا؟",
"ثمّ أشار بالعصا إلى أسفل النار، حيث كانت الجمرات تتوهّج:",
"— لو لم يصعد الدخان والهواء الساخن، هل يأتي هواء جديد إلى النار؟",
"فكّرت ريم لحظة. الهواء الساخن يصعد، فيأخذ الهواء البارد مكانه من الجوانب… يحمل معه أكسجينًا جديدًا…",
"— النار تنطفئ.",
"— تنطفئ. الدخان الذي تقولين إنّه لا ينفع أحدًا، هو الذي يجعل النار تتنفّس.",
"وعاد إلى ناره، وتركها مع أفكارها.",
"قالت ريم ليوسف بصوت خفيض:",
"— هذا يفسد كلّ شيء.",
"— لماذا؟",
"— لأنّني كنت أريد أن يكون الدخان سيّئًا، والنجمة جيّدة. كان الأمر أسهل.",
"ابتسم يوسف لأوّل مرّة تلك الليلة.",
"*",
"— وأنت؟ سألته بعد صمت. لماذا لا تنشر صورك؟ صورك أجمل من كلّ ما رأيت. لو نشرتها لصار عندك آلاف المتابعين.",
"— لا أحتاج إلى متابعين.",
"— هذا ما يقوله الجميع.",
"توقّف يوسف. نظر إلى الكاميرا طويلًا، ثمّ قال بصوت لم تسمعه منه من قبل:",
"— نشرتُ صورة مرّة. قبل سنتين. صورة لدرب التبّانة فوق الأرز. أمضيتُ ثلاث ليالٍ في البرد لأصوّرها. أوّل تعليق كان: «صورة من الإنترنت، لا تكذب». ثاني تعليق: «معدّلة بالفوتوشوب». حذفتُها بعد ساعة.",
"— وهذا هو السبب؟",
"— لا أعرف إن كان هو السبب. أقول لنفسي إنّني أصوّر النجوم لأجل النجوم، ولا يهمّني أن يراني أحد. لكن ربّما… ربّما أنا فقط خائف.",
"نظرت ريم إلى الجرن. كانت «النسر الواقع» ما تزال هناك، ساكنة، لا تطلب شيئًا ولا تخاف من شيء.",
"— إذن النجمة ليست متواضعة، قالت ريم ببطء.",
"— ماذا؟",
"— النجمة في الجرن. كنتُ أظنّها متواضعة لأنّها لا تتكلّم، ولا تتباهى، ولا تهتمّ بمن ينظر إليها. لكنّها لا تستطيع أن تفعل غير ذلك. لا تستطيع أن تختار. فهل يكون التواضع تواضعًا إذا لم يكن هناك خيار؟",
"— وهل يكون الصمت تواضعًا إذا كان خوفًا؟ قال يوسف.",
"لم يُجب أحدهما.",
"*",
"بعد عشرين دقيقة، أُغلق الغالق. ظهرت الصورة على شاشة الكاميرا الصغيرة، فانحنت ريم تنظر إليها.",
"لم تكن النجوم نقاطًا. كانت أقواسًا قصيرة. مئات الأقواس المضيئة الصغيرة، كلّها تنحني حول نقطة واحدة في الشمال، كأنّ السماء كلّها بدأت تدور.",
"— النجوم تحرّكت!",
"— لا. نحن الذين تحرّكنا. الأرض تدور، ونحن معها. النجوم في مكانها. لكن من هنا، من على هذا الدرج، يبدو أنّ السماء كلّها هي التي تدور.",
"— يعني أنّ ما نراه يعتمد على المكان الذي نقف فيه.",
"— دائمًا.",
"نظرت ريم إلى الأقواس، ثمّ إلى هاتفها. كان فيه إشعار جديد، لكنّه هذه المرّة ليس إعجابًا. رسالة من برنامج تلفزيونيّ للشباب: «شاهدنا الفيديو وأحببناه. نودّ استضافتك في حلقة الأسبوع المقبل للحديث عن… تجربتك. الرجاء الردّ قبل الصباح».",
"قرأتها ريم مرّتين. ثمّ أعطت الهاتف ليوسف.",
"— للحديث عن ماذا؟ قال يوسف. عن الفيزياء؟ أم عن القطّ؟",
"— لا يقولون.",
"*",
"في الثانية بعد منتصف الليل، كان الجميع نائمين إلّا ريم.",
"جلست وحدها على حافّة الجرن. انطفأت النار وصارت جمرًا خافتًا. والطبقة الرماديّة ما تزال ممدودة فوق القرية، ساكنة، تنتظر الصباح لتتفرّق. وفي الماء، كانت «النسر الواقع» قد انحدرت بعيدًا نحو الغرب، مع دوران الأرض، وكادت تخرج من حافّة الجرن.",
"كتبت ريم ردًّا على الرسالة: «شكرًا، يسعدني ذلك».",
"ثمّ مسحته.",
"كتبت: «شكرًا، لكنّني لا أظنّ أنّ لديّ ما أقوله».",
"ثمّ مسحته.",
"كتبت: «هل يمكن أن أتحدّث عن لماذا يصعد الدخان؟».",
"وتوقّف إصبعها فوق زرّ الإرسال.",
"فكّرت: لو ذهبتُ، هل أصعد أنا، أم يدفعني القطّ؟ ولو لم أذهب، هل أكون متواضعة، أم خائفة مثل يوسف؟ ولو ذهبتُ وتكلّمتُ عن الفيزياء ولم يسمع أحد، هل أكون قد صعدت أصلًا؟ ثمّ: هل يوجد أحد يصعد بنفسه؟ الجدّ علّمها، والمعلّمة شجّعتها، ويوسف فتح الغالق عشرين دقيقة لتعرف أنّ السماء لا تدور. كلّ من صعد يومًا، دفعه أحد.",
"إذن، ما الذي يبقى منّي حين يتوقّف الدفع؟",
"خرجت «النسر الواقع» من الجرن. لم يبقَ في الماء إلّا الظلام وورقة تين طافية.",
"رفعت ريم رأسها. كانت النجمة هناك، في السماء، حيث كانت دائمًا.",
"وإصبعها ما يزال فوق زرّ الإرسال."
 ],
 en:[
"At seven minutes past nine in the evening, the video had passed eight hundred thousand views.",
"Reem sat on the stone steps in her grandfather's garden, the phone buzzing in her hand like a small bird trying to escape. Every buzz was a new notification: a like, a share, a comment, a follower. She had stopped reading them an hour ago. Now she just watched the number grow.",
"The video was forty seconds long. She had filmed it three days earlier for a physics project: \"Why does smoke rise?\" She stood in front of a candle and explained, very seriously, density, buoyancy and Archimedes. At second twenty-two, the neighbours' cat jumped onto the table, knocked over the candle, and stared into the camera with the face of someone accused of a crime he did not commit. Reem burst into a laugh she could not stop, and left the video as it was, because it was late.",
"Eight hundred thousand views. Most of the comments were about the cat.",
"— Still going up?",
"She raised her head. It was Youssef, her cousin, setting up his tripod by the stone basin at the far end of the garden. Youssef is seventeen and spends every summer night photographing the stars. His account has eleven followers, most of them family.",
"— Almost nine hundred thousand.",
"— Congratulations.",
"He said it without irony, and without enthusiasm. That is how Youssef says everything.",
"*",
"In a corner of the garden, Grandpa had gathered piles of dry leaves and cut fig branches and set them alight, as he does at the end of every summer, on a calm night with no wind and a bucket of water beside him. The smoke rose thick and grey, curling around itself, climbing above the fig tree, above the roof, above the electricity pole.",
"Reem looked at it, then at her phone, then at the smoke again, and laughed to herself.",
"— What's funny? Youssef asked, without taking his eye off the camera.",
"— The smoke. In the video I explained why it rises, and nobody heard the explanation. Everyone watched the cat.",
"— And what did you say in the explanation?",
"— I said it doesn't rise by itself. The air around the fire is hot, so it expands and becomes less dense. The cold air around it is heavier, so it slides underneath and pushes it up. Like a cork in water. Smoke doesn't \"fly\"… it's pushed.",
"Youssef stopped what he was doing and looked at her. Then he looked at the phone in her hand. He said nothing, but Reem understood. She felt something cold creep under her skin, like the air creeping toward the fire.",
"— Say it.",
"— I didn't say anything.",
"— Say it. I'm smoke too. I didn't rise by myself. I rose because a cat jumped on a table, and because thousands of people pressed \"share\". I didn't do anything.",
"— I didn't say that.",
"— But you thought it.",
"Youssef was quiet for a moment, then said calmly:",
"— I thought something else. I thought: does anything rise by itself at all?",
"*",
"Sami, Reem's little brother, came over carrying a glass of tea for Grandpa and stopped by the basin. Then he suddenly shouted:",
"— Youssef! There's a star in the water!",
"There really was. A point of white, slightly bluish light, resting in the middle of the basin, on the still water under the tap. It trembled a little with every drop that fell, then settled.",
"— That's Vega, \"the swooping eagle\", Youssef said. I've been photographing it for an hour. At this time of summer it passes almost straight over our heads, and that's why we can see it when we look down into the basin.",
"Reem came and looked. The star in the water seemed so close that if she reached out she could take it. But when she leaned over and stared, she saw it far away, at a depth the basin did not have.",
"— Strange. It looks like it's at the bottom of something deeper than the well.",
"— Because the image in a mirror is as far behind it as the object is in front. The star is very far, so its image in the water is very far too. The basin doesn't bring it closer. We're just looking at it from above.",
"— And how far is it?",
"— About twenty-five light-years. The light in the basin right now left it before you and I were born.",
"Reem looked at the trembling point in the water. Light that had travelled twenty-five years without knowing where it was going, and ended up in a stone basin in her grandfather's garden, next to a slice of watermelon rind.",
"— And it doesn't know we're looking at it.",
"— No. And it doesn't care.",
"— That's what you think.",
"*",
"Sami picked up a pebble and threw it into the basin.",
"The star broke into dozens of dancing points. Sami gasped, and Reem laughed. Then the water calmed, ring after ring, and the star came back whole in its place, as if nothing had happened.",
"— I broke it and it came back! said Sami.",
"— You didn't break it, said Youssef. You broke the water. The star was never here. Its light arrives every moment, and the water gives it back when it's calm.",
"Reem said slowly, her eyes on the basin:",
"— And what if I'm the image, not the star?",
"— What do you mean?",
"— Nine hundred thousand people saw me. But they didn't see me. They saw my image on their screens. An image that breaks when a finger swipes the screen, and comes back, and breaks. Where am I in all this? Am I here, on the steps, or there, in nine hundred thousand phones?",
"Youssef didn't answer. He turned the camera toward the North Star, pressed the button, and together they heard the shutter open and not close.",
"*",
"— What are you doing?",
"— A long-exposure photo. The shutter will stay open for twenty minutes.",
"— Why?",
"— You'll see.",
"Reem sat next to him on the edge of the basin. Above them, the smoke had changed. It no longer rose straight up as it had at first. It climbed more slowly, then stopped at a certain height above the valley and began to spread out sideways, as if it had hit an invisible ceiling, until it became a thin grey layer stretched over the houses of the village.",
"— Why did it stop there? Reem asked. It should keep rising.",
"— Why?",
"— Because… because smoke rises.",
"— You said yourself it doesn't rise, it's pushed. It's pushed as long as it's lighter than the air around it. But the higher it goes, the more it cools and mixes with the air, and the heavier it gets. And on calm summer nights, the air near the valley floor cools faster than the air above it, so a warm layer forms over a cold one. When the smoke gets there, it's as heavy as what surrounds it. Nothing pushes it any more. So it stops, and spreads.",
"— So it rose as long as something was pushing it… and it stopped when the pushing stopped.",
"— Almost. When the pushing stops, the smoke doesn't stop at once. It overshoots a little, becomes heavier than the air around it, sinks back a little, and the air calms it. Then it spreads.",
"Reem looked at the grey layer over the village, then at her phone. The buzzing had stopped a few minutes ago. The numbers were still growing, but more slowly.",
"— How long does the smoke stay up there?",
"— Until morning, maybe. Then the ground warms up, the air moves, and it breaks apart. It will be everywhere, and no one will see it.",

"Grandpa came to stir the fire with a long stick. Sparks flew up, and the fire burned stronger.",
"Reem said suddenly, with a hint of challenge:",
"— Grandpa, why do you light this fire every year? The smoke is no use to anyone. It just rises and disappears.",
"Grandpa stopped and looked at her, surprised:",
"— No use to anyone?",
"Then he pointed the stick at the bottom of the fire, where the embers were glowing:",
"— If the smoke and the hot air didn't rise, would fresh air come to the fire?",
"Reem thought for a moment. The hot air rises, the cold air takes its place from the sides… bringing new oxygen with it…",
"— The fire would go out.",
"— It would go out. The smoke you say is no use to anyone is what lets the fire breathe.",
"And he went back to his fire, leaving her with her thoughts.",

"— Why?",
"— Because I wanted the smoke to be bad and the star to be good. It was simpler.",
"Youssef smiled for the first time that night.",
"*",
"— And you? she asked him after a silence. Why don't you post your photos? They're more beautiful than anything I've seen. If you posted them, you'd have thousands of followers.",
"— I don't need followers.",
"— That's what everyone says.",
"Youssef stopped. He looked at the camera for a long time, then said in a voice she had never heard from him:",
"— I posted a photo once. Two years ago. The Milky Way over the cedars. I spent three nights in the cold to take it. The first comment was: \"It's from the internet, stop lying.\" The second: \"Photoshopped.\" I deleted it an hour later.",

"— I don't know if it's the reason. I tell myself I photograph the stars for the stars, and I don't care whether anyone sees me. But maybe… maybe I'm just afraid.",
"Reem looked at the basin. Vega was still there, still, asking for nothing and afraid of nothing.",
"— Then the star isn't humble, Reem said slowly.",
"— What?",
"— The star in the basin. I thought it was humble because it doesn't speak, doesn't show off, doesn't care who's looking. But it can't do anything else. It can't choose. So is humility still humility if there's no choice?",
"— And is silence humility if it's fear? said Youssef.",
"Neither of them answered.",
"*",
"Twenty minutes later, the shutter closed. The photo appeared on the camera's small screen, and Reem leaned in to look.",
"The stars were not points. They were short arcs. Hundreds of small glowing arcs, all curving around a single point in the north, as if the whole sky had begun to turn.",
"— The stars moved!",
"— No. We moved. The Earth turns, and we turn with it. The stars stayed where they are. But from here, from these steps, it looks as if the whole sky is turning.",
"— So what we see depends on where we're standing.",
"— Always.",
"Reem looked at the arcs, then at her phone. There was a new notification, but this time it wasn't a like. It was a message from a TV show for young people: \"We saw your video and loved it. We'd like to have you on next week's episode to talk about… your experience. Please reply before morning.\"",

"— To talk about what? said Youssef. Physics? Or the cat?",

"*",
"At two in the morning, everyone was asleep except Reem.",
"She sat alone on the edge of the basin. The fire had died down to faint embers. The grey layer was still stretched over the village, still, waiting for morning to break apart. And in the water, Vega had swung far toward the west as the Earth turned, and was about to leave the edge of the basin.",

"She typed: \"Thank you, but I don't think I have anything to say.\"",

"À neuf heures sept du soir, la vidéo avait dépassé les huit cent mille vues.",
"Reem était assise sur les marches de pierre du jardin de son grand-père, le téléphone vibrant dans sa main comme un petit oiseau qui veut s'échapper. Chaque vibration, une nouvelle notification : un j'aime, un partage, un commentaire, un abonné. Elle avait arrêté de les lire depuis une heure. Elle se contentait maintenant de regarder le chiffre grandir.",
"La vidéo durait quarante secondes. Elle l'avait tournée trois jours plus tôt pour un projet de physique : « Pourquoi la fumée monte-t-elle ? » Debout devant une bougie, elle expliquait très sérieusement la densité, la poussée et Archimède. À la vingt-deuxième seconde, le chat des voisins avait sauté sur la table, renversé la bougie, et fixé la caméra avec la tête de quelqu'un accusé d'un crime qu'il n'a pas commis. Reem avait éclaté d'un rire qu'elle ne pouvait plus arrêter, et elle avait laissé la vidéo telle quelle, parce qu'il était tard.",
"Huit cent mille vues. La plupart des commentaires parlaient du chat.",
"— Ça monte encore ?",
"Elle leva la tête. C'était Youssef, son cousin, qui installait son trépied près du bassin de pierre, au fond du jardin. Youssef a dix-sept ans et passe toutes ses nuits d'été à photographier les étoiles. Son compte a onze abonnés, presque tous de la famille.",
"— Presque neuf cent mille.",
"— Félicitations.",
"Il le dit sans ironie, et sans enthousiasme. C'est ainsi que Youssef dit tout.",
"*",
"Dans un coin du jardin, grand-père avait rassemblé des tas de feuilles sèches et de branches de figuier coupées, et y avait mis le feu, comme il le fait à chaque fin d'été, par une nuit calme et sans vent, un seau d'eau à côté de lui. La fumée montait, grise et épaisse, enroulée sur elle-même, au-dessus du figuier, au-dessus du toit, au-dessus du poteau électrique.",
"Reem la regarda, puis regarda son téléphone, puis la fumée à nouveau, et rit toute seule.",
"— Qu'est-ce qui te fait rire ? demanda Youssef sans quitter l'appareil des yeux.",
"— La fumée. Dans la vidéo, j'expliquais pourquoi elle monte, et personne n'a entendu l'explication. Tout le monde a regardé le chat.",
"— Et qu'est-ce que tu disais, dans l'explication ?",
"— Je disais qu'elle ne monte pas toute seule. L'air autour du feu est chaud, alors il se dilate et devient moins dense. L'air froid autour est plus lourd, il se glisse dessous et le pousse vers le haut. Comme un bouchon dans l'eau. La fumée ne « vole » pas… elle est poussée.",
"Youssef s'arrêta et la regarda. Puis il regarda le téléphone dans sa main. Il ne dit rien, mais Reem comprit. Elle sentit quelque chose de froid ramper sous sa peau, comme l'air qui rampe vers le feu.",
"— Dis-le.",
"— Je n'ai rien dit.",
"— Dis-le. Moi aussi, je suis de la fumée. Je ne suis pas montée toute seule. Je suis montée parce qu'un chat a sauté sur une table, et parce que des milliers de gens ont appuyé sur « partager ». Je n'ai rien fait.",
"— Je n'ai pas dit ça.",
"— Mais tu l'as pensé.",
"Youssef se tut un instant, puis dit calmement :",
"— J'ai pensé autre chose. J'ai pensé : est-ce que quelque chose monte tout seul, au fond ?",
"*",
"Sami, le petit frère de Reem, s'approcha avec un verre de thé pour grand-père et s'arrêta près du bassin. Puis il cria soudain :",
"— Youssef ! Il y a une étoile dans l'eau !",
"Il y en avait une, vraiment. Un point de lumière blanche, un peu bleutée, posé au milieu du bassin, sur l'eau immobile sous le robinet. Il tremblait un peu à chaque goutte qui tombait, puis se calmait.",
"— C'est Véga, « l'aigle qui fond », dit Youssef. Je la photographie depuis une heure. À cette période de l'été, elle passe presque juste au-dessus de nos têtes, c'est pour ça qu'on la voit en regardant dans le bassin.",
"Reem vint regarder. L'étoile dans l'eau semblait si proche qu'en tendant la main elle aurait pu la prendre. Mais quand elle se pencha et la fixa, elle la vit lointaine, à une profondeur que le bassin n'avait pas.",
"— Bizarre. On dirait qu'elle est au fond de quelque chose de plus profond que le puits.",
"— Parce que l'image dans un miroir est aussi loin derrière lui que l'objet est loin devant. L'étoile est très loin, donc son image dans l'eau est très loin aussi. Le bassin ne la rapproche pas. C'est juste nous qui la regardons d'en haut.",
"— Et elle est à quelle distance ?",
"— Environ vingt-cinq années-lumière. La lumière qui est dans le bassin en ce moment est partie d'elle avant que toi et moi soyons nés.",
"Reem regarda le point tremblant dans l'eau. Une lumière qui avait voyagé vingt-cinq ans sans savoir où elle allait, pour finir dans un bassin de pierre dans le jardin de son grand-père, à côté d'une écorce de pastèque.",
"— Et elle ne sait pas qu'on la regarde.",
"— Non. Et ça lui est égal.",
"— C'est ce que tu crois.",
"*",
"Sami ramassa un caillou et le lança dans le bassin.",
"L'étoile se brisa en dizaines de points dansants. Sami poussa un cri, et Reem rit. Puis l'eau se calma, cercle après cercle, et l'étoile revint entière à sa place, comme si rien ne s'était passé.",
"— Je l'ai cassée et elle est revenue ! dit Sami.",
"— Tu ne l'as pas cassée, dit Youssef. Tu as cassé l'eau. L'étoile n'a jamais été ici. Sa lumière arrive à chaque instant, et l'eau la renvoie quand elle est calme.",
"Reem dit lentement, les yeux sur le bassin :",
"— Et si c'était moi, l'image, et pas l'étoile ?",

"— Neuf cent mille personnes m'ont vue. Mais elles ne m'ont pas vue. Elles ont vu mon image sur leurs écrans. Une image qui se brise quand un doigt glisse sur l'écran, puis revient, puis se brise. Où suis-je dans tout ça ? Ici, sur les marches, ou là-bas, dans neuf cent mille téléphones ?",
"Youssef ne répondit pas. Il tourna l'appareil vers l'étoile Polaire, appuya sur le bouton, et ensemble ils entendirent l'obturateur s'ouvrir et ne pas se refermer.",

"Reem s'assit à côté de lui sur le bord du bassin. Là-haut, la fumée avait changé. Elle ne montait plus tout droit comme au début. Elle s'élevait plus lentement, puis elle s'arrêta à une certaine hauteur au-dessus de la vallée et commença à s'étaler sur les côtés, comme si elle avait heurté un plafond invisible, jusqu'à devenir une fine couche grise étendue au-dessus des maisons du village.",
"— Pourquoi elle s'est arrêtée là ? demanda Reem. Elle devrait continuer à monter.",
"— Pourquoi ?",
"— Parce que… parce que la fumée monte.",
"— Tu l'as dit toi-même : elle ne monte pas, elle est poussée. Elle est poussée tant qu'elle est plus légère que l'air autour d'elle. Mais plus elle monte, plus elle refroidit et se mélange à l'air, et plus elle s'alourdit. Et les nuits d'été calmes, l'air près du fond de la vallée refroidit plus vite que l'air au-dessus, alors une couche chaude se forme au-dessus d'une couche froide. Quand la fumée arrive là, elle est aussi lourde que ce qui l'entoure. Plus rien ne la pousse. Alors elle s'arrête, et elle s'étale.",
"— Donc elle est montée tant que quelque chose la poussait… et elle s'est arrêtée quand la poussée s'est arrêtée.",
"— Presque. Quand la poussée s'arrête, la fumée ne s'arrête pas tout de suite. Elle dépasse un peu, devient plus lourde que l'air autour, redescend un peu, et l'air la calme. Puis elle s'étale.",
"Reem regarda la couche grise au-dessus du village, puis son téléphone. Les vibrations avaient cessé depuis quelques minutes. Les chiffres grandissaient encore, mais plus lentement.",
"— Combien de temps la fumée reste là-haut ?",
"— Jusqu'au matin, peut-être. Puis le sol se réchauffe, l'air bouge, et elle se disperse. Elle sera partout, et personne ne la verra.",
"*",
"Grand-père vint remuer le feu avec un long bâton. Des étincelles s'envolèrent, et le feu brûla plus fort.",
"Reem dit soudain, avec un brin de défi :",
"— Grand-père, pourquoi tu allumes ce feu chaque année ? La fumée ne sert à personne. Elle monte et elle disparaît, c'est tout.",
"Grand-père s'arrêta et la regarda, surpris :",
"— Elle ne sert à personne ?",
"Puis il pointa le bâton vers le bas du feu, où les braises rougeoyaient :",
"— Si la fumée et l'air chaud ne montaient pas, est-ce que de l'air frais viendrait au feu ?",
"Reem réfléchit un instant. L'air chaud monte, l'air froid prend sa place par les côtés… en apportant de l'oxygène neuf…",
"— Le feu s'éteindrait.",
"— Il s'éteindrait. La fumée qui, selon toi, ne sert à personne, c'est elle qui fait respirer le feu.",
"Et il retourna à son feu, la laissant avec ses pensées.",
"Reem dit à Youssef à voix basse :",
"— Ça gâche tout.",
"— Pourquoi ?",
"— Parce que je voulais que la fumée soit mauvaise et l'étoile bonne. C'était plus simple.",
"Youssef sourit pour la première fois de la soirée.",
"*",
"— Et toi ? lui demanda-t-elle après un silence. Pourquoi tu ne publies pas tes photos ? Elles sont plus belles que tout ce que j'ai vu. Si tu les publiais, tu aurais des milliers d'abonnés.",
"— Je n'ai pas besoin d'abonnés.",
"— C'est ce que tout le monde dit.",
"Youssef s'arrêta. Il regarda longtemps l'appareil, puis dit d'une voix qu'elle ne lui connaissait pas :",
"— J'ai publié une photo, une fois. Il y a deux ans. La Voie lactée au-dessus des cèdres. J'ai passé trois nuits dans le froid pour la prendre. Le premier commentaire disait : « Photo prise sur internet, arrête de mentir. » Le deuxième : « Retouchée sur Photoshop. » Je l'ai supprimée au bout d'une heure.",
"— Et c'est pour ça ?",
"— Je ne sais pas si c'est pour ça. Je me dis que je photographie les étoiles pour les étoiles, et que ça m'est égal qu'on me voie. Mais peut-être… peut-être que j'ai juste peur.",
"Reem regarda le bassin. Véga était toujours là, immobile, ne demandant rien et n'ayant peur de rien.",
"— Alors l'étoile n'est pas humble, dit Reem lentement.",
"— Quoi ?",
"— L'étoile dans le bassin. Je la croyais humble parce qu'elle ne parle pas, ne se vante pas, ne se soucie pas de qui la regarde. Mais elle ne peut pas faire autrement. Elle ne peut pas choisir. Alors, l'humilité est-elle encore de l'humilité s'il n'y a pas de choix ?",
"— Et le silence est-il de l'humilité si c'est de la peur ? dit Youssef.",
"Aucun des deux ne répondit.",
"*",
"Vingt minutes plus tard, l'obturateur se referma. La photo apparut sur le petit écran de l'appareil, et Reem se pencha pour la regarder.",
"Les étoiles n'étaient pas des points. C'étaient de courts arcs. Des centaines de petits arcs lumineux, tous courbés autour d'un seul point au nord, comme si le ciel entier avait commencé à tourner.",

"— Donc ce qu'on voit dépend de l'endroit où l'on se tient.",
"— Toujours.",

"Reem le lut deux fois. Puis elle tendit le téléphone à Youssef.",
"— Pour parler de quoi ? dit Youssef. De physique ? Ou du chat ?",
"— Ils ne le disent pas.",
"*",
"À deux heures du matin, tout le monde dormait, sauf Reem.",

  ()=>genModel({title:{en:"Which formula gives the acceleration on the slope?",fr:"Quelle formule donne l'accélération sur la pente ?"},

    usable:r=>true,varied:rs=>new Set(rs.map(r=>r.th)).size>=2&&new Set(rs.map(r=>r.sk)).size>=2,

    yes:{en:"Your formula fits every run. Without friction (f = 0) it becomes a = g·sin α, and the mass disappears.",fr:"Ta formule correspond à tous les essais. Sans frottement (f = 0), elle devient a = g·sin α, et la masse disparaît."},
    forNow:()=>`<span class="kicker">${tx2("The best answer, for now","La meilleure réponse, pour l'instant")}</span>
      <p style="margin:0">${tx2("In this model, friction is one force f that you measure. In reality it comes from countless tiny bumps and bonds between the two surfaces, and it changes with the surfaces, the speed and even the temperature. Treating it as a single force is a simplification, and a very useful one.","Dans ce modèle, le frottement est une seule force f que l'on mesure. En réalité, il vient d'innombrables petites aspérités et liaisons entre les deux surfaces, et il change avec les surfaces, la vitesse et même la température. Le traiter comme une seule force est une simplification, et une simplification très utile.")}</p>
      <p class="muted" style="margin:0">${tx2("Question to keep: we solve problems on smooth planes that do not exist. Are ideal models useful truths or useful fictions?","Question à garder : on résout des problèmes sur des plans lisses qui n'existent pas. Les modèles idéaux sont-ils des vérités utiles ou des fictions utiles ?")}</p>`,
    law:()=>`<div class="law"><span class="kicker">${tx2("Newton's 2nd law on an inclined plane","2e loi de Newton sur un plan incliné")}</span><span class="eq">m·a = m·g·sin α − f</span>
      <p>${tx2("Three forces act: the weight P⃗, the normal reaction N⃗ and the friction force f⃗, opposite to the motion. Projecting ΣF⃗ = m·a⃗ along the slope: m·a = m·g·sin α − f, so a = g·sin α − f/m. Perpendicular to the slope there is no motion: N = m·g·cos α. On a smooth slope (f = 0), a = g·sin α: the mass cancels. At rest, friction balances the component of the weight along the slope, up to a limit; beyond that limit, the block slides.","Trois forces agissent : le poids P⃗, la réaction normale N⃗ et le frottement f⃗, opposé au mouvement. En projetant ΣF⃗ = m·a⃗ le long de la pente : m·a = m·g·sin α − f, donc a = g·sin α − f/m. Perpendiculairement à la pente, il n'y a pas de mouvement : N = m·g·cos α. Sur un plan lisse (f = 0), a = g·sin α : la masse se simplifie. Au repos, le frottement compense la composante du poids le long de la pente, jusqu'à une limite ; au-delà, le bloc glisse.")}</p></div>`,
    preds:L5.preds,right:0,
    explain:{en:"Back to Faraya: on ice, the friction the road can give is much smaller, so it can no longer balance the component of the weight along the slope, m·g·sin α, and the car slides. A wheel pushes back on the road and the road pushes the car forward: that push is friction. On perfect ice, the wheels would spin and the car could neither start nor brake. Friction wastes energy, but without it we could not walk, drive or even hold a pen.",fr:"Retour à Faraya : sur la glace, le frottement que la route peut fournir est beaucoup plus petit ; il ne peut plus compenser la composante du poids le long de la pente, m·g·sin α, et la voiture glisse. Une roue pousse la route vers l'arrière et la route pousse la voiture vers l'avant : cette poussée, c'est le frottement. Sur un verglas parfait, les roues patineraient et la voiture ne pourrait ni démarrer ni freiner. Le frottement gaspille de l'énergie, mais sans lui on ne pourrait ni marcher, ni conduire, ni même tenir un stylo."},

     {kick:{en:"Arduino option",fr:"Option Arduino"},h:{en:"A slope checker",fr:"Un contrôleur de pente"},p:{en:"An MPU-6050 sensor (VCC→5V, GND→GND, SDA→A4, SCL→A5) measures the tilt; a passive buzzer on pin 8 (other leg to GND) sounds when a ramp is steeper than 1 : 12. Align the sensor's x-axis with the slope, and check that mpu.begin() returns true.",fr:"Un capteur MPU-6050 (VCC→5V, GND→GND, SDA→A4, SCL→A5) mesure l'inclinaison ; un buzzer passif sur la broche 8 (autre patte à GND) sonne quand une rampe est plus raide que 1 : 12. Aligne l'axe x du capteur avec la pente, et vérifie que mpu.begin() renvoie true."},
