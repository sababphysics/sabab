<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232D4BD8'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='700' font-size='38' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">

<title>Sabab · Physics that asks why</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#E4E7EE; --ink:#14203A; --muted:#58627A; --line:#D3D8E2;
  --primary:#2D4BD8; --primary-ink:#FFFFFF; --primary-soft:#E1E6FB; --amber:#E0A100; --amber-soft:#FBF0CC;
  --good:#1F8A55; --good-soft:#DDF2E6; --bad:#C23A3A; --bad-soft:#F8E0E0;
  --road:#3A4150; --sky:#DCE6F5; --taxi:#F4F4F2; --plate:#C8281E;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --ar:"Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1320; --surface:#161D2E; --surface-2:#1F2839; --ink:#E6E9F1; --muted:#98A2B8; --line:#2A3448;
    --primary:#7D93FF; --primary-ink:#0E1320; --primary-soft:#1E2748; --amber:#F2C14E; --amber-soft:#3A3016;
    --good:#5CCB8F; --good-soft:#15352A; --bad:#EE8080; --bad-soft:#3A1C1F;
    --road:#262C38; --sky:#1B2436; --taxi:#D9DBE0; --plate:#E0473C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1320; --surface:#161D2E; --surface-2:#1F2839; --ink:#E6E9F1; --muted:#98A2B8; --line:#2A3448;
  --primary:#7D93FF; --primary-ink:#0E1320; --primary-soft:#1E2748; --amber:#F2C14E; --amber-soft:#3A3016;
  --good:#5CCB8F; --good-soft:#15352A; --bad:#EE8080; --bad-soft:#3A1C1F;
  --road:#262C38; --sky:#1B2436; --taxi:#D9DBE0; --plate:#E0473C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem)}
h2{font-size:clamp(1.3rem,3vw,1.7rem)}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.ar{font-family:var(--ar);direction:rtl;text-align:right;unicode-bidi:isolate;line-height:1.9}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.brand b span{color:var(--primary)}
.brand .ar{font-size:1rem;color:var(--muted);line-height:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.shell{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}
@media (max-width:860px){.shell{grid-template-columns:1fr}}

/* unit header + rail */
.rail{display:grid;gap:16px;align-content:start;position:sticky;top:78px}
@media (max-width:860px){.rail{position:static}}
.unit{display:grid;gap:6px}
.unit .kick{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
@media (max-width:860px){.steps{grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);overflow-x:auto;padding-bottom:4px}}
.steps button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;width:100%;box-sizing:border-box}
.steps button:hover{background:var(--surface)}
.steps button[aria-current="step"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--primary)}
.steps .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;background:var(--surface-2);color:var(--muted)}
.steps .done .dot{background:var(--good);color:#fff}
.steps [aria-current="step"] .dot{background:var(--primary);color:var(--primary-ink)}
.steps .lb{font-size:.9rem;font-weight:600;line-height:1.2}
.steps .lb small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);transition:width .4s}
.meta{font-size:.8rem;color:var(--muted);display:grid;gap:2px}

/* main card */
main{display:grid;gap:18px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px}
.card.flat{background:transparent;border:0;padding:0}
.kicker{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big-q{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.2}
.ladder .lad{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.ladder .lad li{direction:rtl;border-right:3px solid var(--amber-soft);padding:2px 12px 2px 0;display:grid;gap:6px}
.ladder .lad-h small{direction:ltr}
.ladder .lad-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ladder .lad-n{width:24px;height:24px;border-radius:50%;background:var(--amber-soft);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.ladder .lad p.ar{margin:0}
.ladder .lad textarea{min-height:56px;width:100%;direction:rtl;text-align:right}
.ladder .lad-c{font-size:.95rem;opacity:.8;margin:0}
.disc{background:var(--amber-soft);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.disc .lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink);opacity:.7}
.disc .ar{font-size:1.05rem;font-weight:500}

canvas{display:block;width:100%;border-radius:12px;background:var(--sky)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;background:var(--primary);color:var(--primary-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.opt:hover{border-color:var(--primary)}
.opt .l{font-family:var(--mono);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .l{background:var(--primary);color:var(--primary-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.note{font-size:.9rem;padding:10px 14px;border-radius:10px;background:var(--surface-2)}
.note.good{background:var(--good-soft)}
.note.bad{background:var(--bad-soft)}

/* voices */
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.voice{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;background:var(--bg)}
.voice .who{font-weight:600}
.voice .when{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.voice q{font-style:italic;quotes:"“" "”"}
.voice .src{font-size:.75rem;color:var(--muted)}

/* slider */
.stance{display:grid;gap:8px}
.stance .ends{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;font-weight:600}
input[type=range]{width:100%;accent-color:var(--primary)}
textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
label.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}
@media (max-width:760px){.lab{grid-template-columns:1fr}}
.ctrl{display:grid;gap:14px;align-content:start}
.ctrl .v{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600}
.ctrl .v span{font-family:var(--mono);color:var(--primary)}
.switch{display:flex;align-items:center;gap:10px;font-size:.92rem;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--primary)}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.readout div{background:var(--bg);border-radius:10px;padding:10px 12px;display:grid}
.readout small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.readout b{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
td.mono{font-family:var(--mono)}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}
.chip{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.fr{background:var(--amber-soft);color:var(--ink)}
.ard{border:1px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;font-size:.92rem}

.formula{font-family:var(--mono);font-size:1.05rem}
.shell.wide{grid-template-columns:1fr}
[hidden]{display:none!important}
.views{flex-wrap:wrap}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:#14203A;font-size:.7rem;font-family:var(--mono)}
/* home */
.hero{display:grid;gap:18px;padding-block:18px 8px}
.hero .kick{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);font-weight:600}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);letter-spacing:-.02em;max-width:16ch}
.hero h1 .why{color:var(--primary)}
.hero .ar-tag{font-family:var(--ar);font-size:1.3rem;color:var(--muted)}
.hero .lede{font-size:1.15rem;max-width:60ch;color:var(--muted)}
.sec{display:grid;gap:16px;padding-block:28px 4px}
.sec>h2{max-width:28ch}
.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.signals{grid-template-columns:1fr}}
.signal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;align-content:start;position:relative}
.signal .yr{font-family:var(--mono);font-size:2rem;font-weight:500;color:var(--primary);line-height:1}
.signal .cty{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.signal h3{font-family:var(--display);font-weight:800;font-size:1.2rem}
.signal p{font-size:.95rem}
.signal .src{font-size:.82rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.signal .src a{color:var(--primary)}
.signal .kind{position:absolute;top:18px;right:18px}
.gap{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:12px;align-items:stretch}
@media (max-width:860px){.gap{grid-template-columns:1fr}}
.gap div{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start;background:var(--surface)}
.gap div b{font-size:1rem}
.gap div small{color:var(--muted);font-size:.88rem}
.gap .us{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.gap .us small{color:inherit;opacity:.85}
.inside{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start}
.bcard.live{border-color:var(--primary)}
.bcard h3{margin:0}
.bcard .btn{justify-self:start}
.gofur{border:1px dashed var(--primary)}
.xsim{border-radius:14px;overflow:hidden;background:#0B1226}
.xsim canvas{display:block;width:100%;height:auto}
.xctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:end}
.xctl input[type=range]{width:100%}
.xread{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.xread div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.xread small{color:var(--muted);font-size:.8rem}
.xread .ok b{color:#1F8A55}.xread .no b{color:#B4532A}
.qi{display:grid;gap:8px}.qi p{margin:0}
.xchk{display:grid;gap:8px}.xck{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}.xck input{margin-top:4px;width:18px;height:18px;flex:none}
.morin{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:28px}
.morin blockquote{margin:0;display:grid;gap:10px}
.morin blockquote p:first-child{font-family:var(--display);font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.35;margin:0;text-wrap:balance}
.morin footer{color:var(--muted);font-size:.9rem}
.morin-side{display:grid;gap:12px;justify-items:start}
@media (max-width:760px){.morin{grid-template-columns:1fr}}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.thcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;align-content:start}
.thq{margin:0;font-family:var(--display);font-size:1.08rem;line-height:1.45;border-left:3px solid var(--primary);padding-left:12px}
.story-wrap{max-width:760px;margin-inline:auto;display:grid;gap:20px}
.story-read{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,44px);display:grid;gap:14px}
.story-read h1{margin:0 0 6px}
.story-read p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.12rem;line-height:1.8}
.story-read.rtl p,.story-read.rtl h1{font-family:"Noto Naskh Arabic","Noto Kufi Arabic",Tahoma,serif;text-align:right}
.story-read.rtl p{font-size:1.25rem;line-height:2.05}
.story-read .st-dia{padding-inline-start:14px}
.story-read.rtl .kicker{letter-spacing:0;text-transform:none;font-size:.9rem}
.story-read .st-dash{color:var(--muted)}
.story-read .st-break{text-align:center!important;color:var(--muted);letter-spacing:.4em}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px;align-content:start}
.tile:hover{border-color:var(--primary)}
.tile:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tile .go{color:var(--primary);font-weight:600;font-size:.9rem}
/* shop */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.88rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.shopgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.shopgrid{grid-template-columns:1fr}}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.cover{aspect-ratio:3/4;max-width:100%;padding:16px;display:grid;align-content:space-between;color:#fff;position:relative;overflow:hidden}
.cover .ct{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.15;position:relative;z-index:1}
.cover .ca{font-family:var(--ar);font-size:.95rem;direction:rtl;text-align:right;position:relative;z-index:1;opacity:.92}
.cover .cb{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;position:relative;z-index:1;opacity:.85}
.cover svg{position:absolute;inset:auto -10% -6% auto;width:80%;opacity:.28}
.book .info{padding:14px;display:grid;gap:6px;align-content:start}
.book .info b{font-size:.98rem;line-height:1.25}
.book .info small{color:var(--muted);font-size:.82rem}
.book .buy{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.price{font-family:var(--mono);font-weight:500}
.sbtn{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:600;background:var(--primary);color:var(--primary-ink)}
.sbtn.ghost{background:var(--surface-2);color:var(--ink)}
.sbtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;position:sticky;top:80px}
@media (max-width:900px){.cart{position:static}}
.cart .ln{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cart .qty{display:flex;gap:6px;align-items:center}
.cart .qty button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono)}
.cart .tot{display:flex;justify-content:space-between;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal.wide{max-width:980px}
.film{display:grid;gap:10px}
.film-stage{position:relative;border-radius:14px;overflow:hidden;background:#0E1320;aspect-ratio:16/9;max-width:100%}
.film-stage canvas{width:100%;height:100%;display:block;cursor:pointer}
.film-big{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#14203A;font-size:2rem;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.film-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  let v=16,braking=false,lean=0,lv=0,off=0,last=performance.now(),raf;
  function size(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=240*d;ctx.setTransform(d,0,0,d,0,0);}
  size(); addEventListener("resize",size);
  $("#brake").onclick=()=>{braking=true;};
  $("#drive").onclick=()=>{braking=false;};
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const W=cv.clientWidth,H=240;
    let a=0;
    if(braking&&v>0){a=-7;v=Math.max(0,v+a*dt);}
    if(!braking&&v<16){v=Math.min(16,v+3*dt);a=3;}
    // passenger lean: driven by car's deceleration (pseudo-force in car frame), damped spring back
    const target=a<0?0.42:(a>0?-0.12:0);
    lv+= ((target-lean)*28 - lv*7)*dt; lean+=lv*dt;
    off=(off+v*dt*28)%60;
    // draw
    ctx.fillStyle=css("--sky");ctx.fillRect(0,0,W,H);
    // sea line + distant hills
    ctx.fillStyle=css("--primary-soft");ctx.fillRect(0,H*0.42,W,H*0.12);
    ctx.fillStyle=css("--road");ctx.fillRect(0,H*0.62,W,H*0.38);
    ctx.fillStyle=css("--amber");for(let x=-off;x<W;x+=60){ctx.fillRect(x,H*0.8,32,4);}
    // car
    const cw=Math.min(300,W*0.62),ch=74,cx=(W-cw)/2,cy=H*0.62-ch+8;
    ctx.fillStyle=css("--taxi");roundRect(ctx,cx,cy+22,cw,ch-22,12);ctx.fill();
    roundRect(ctx,cx+cw*0.18,cy-8,cw*0.58,40,12);ctx.fill();
    ctx.fillStyle=css("--sky");roundRect(ctx,cx+cw*0.22,cy-2,cw*0.24,26,6);ctx.fill();roundRect(ctx,cx+cw*0.49,cy-2,cw*0.23,26,6);ctx.fill();
    // plate (red: Lebanese public-transport plate)
    ctx.fillStyle=css("--plate");roundRect(ctx,cx+cw-46,cy+44,38,16,3);ctx.fill();
    ctx.fillStyle="#fff";ctx.font="bold 10px "+css("--mono");ctx.fillText("ع 123",cx+cw-43,cy+56);
    // wheels
    ctx.fillStyle="#111";[cx+cw*0.2,cx+cw*0.8].forEach(x=>{ctx.beginPath();ctx.arc(x,cy+ch,15,0,7);ctx.fill();});
    // passenger in rear window (car moves to the right)
    const px=cx+cw*0.35,py=cy+30;
    ctx.save();ctx.translate(px,py);ctx.rotate(lean);
    ctx.strokeStyle=css("--ink");ctx.lineWidth=5;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-20);ctx.stroke();
    ctx.fillStyle=css("--ink");ctx.beginPath();ctx.arc(0,-28,8,0,7);ctx.fill();ctx.restore();
    // direction arrow
    ctx.fillStyle=css("--muted");ctx.font="12px "+css("--sans");ctx.fillText(L({en:"direction of travel →",fr:"sens du déplacement →"}),12,20);
    $("#spd").textContent=`v = ${nf(v*3.6,0)} km/h`;
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  stopAnim=()=>{cancelAnimationFrame(raf);removeEventListener("resize",size);};
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

    const vmax=Math.max(10,...trace.map(p=>p[1]));const vtop=Math.ceil(vmax/5)*5;
    for(let i=0;i<=5;i++){const yy=b-(b-tp)*i/5;gc.beginPath();gc.moveTo(l,yy);gc.lineTo(r,yy);gc.stroke();gc.fillText(nf(vtop*i/5,0),6,yy+4);}
    for(let s=0;s<=5;s++){const xx=l+(r-l)*s/5;gc.fillText(s+" s",xx-8,GH-8);}
    gc.fillText("v (m/s)",l+4,tp+10);
    if(trace.length>1){gc.strokeStyle=css("--primary");gc.lineWidth=2.5;gc.beginPath();trace.forEach(([tt,vv],i)=>{const xx=l+(r-l)*tt/5,yy=b-(b-tp)*vv/vtop;i?gc.lineTo(xx,yy):gc.moveTo(xx,yy);});gc.stroke();
      const [tt,vv]=trace[trace.length-1];gc.fillStyle=css("--primary");gc.beginPath();gc.arc(l+(r-l)*tt/5,b-(b-tp)*vv/vtop,4,0,7);gc.fill();}
  }
  function arrow(c,x1,y1,x2,y2,col){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=3;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-6*Math.sign(x2-x1),y2);c.stroke();c.beginPath();const d=Math.sign(x2-x1);c.moveTo(x2,y2);c.lineTo(x2-9*d,y2-6);c.lineTo(x2-9*d,y2+6);c.closePath();c.fill();}
  function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    t+=dt;v+=a*dt;x+=v*dt;trace.push([t,v]);
    $("#rT").textContent=nf(t)+" s";$("#rV").textContent=nf(v)+" m/s";
    draw();
    if(x>=TRACK||t>=5){running=false;$("#run").disabled=false;
      S.runs.push({F:+Fi.value,m:+mi.value,fr:fri.checked,a:aMeas});if(S.runs.length>12)S.runs.shift();save();listRuns();return;}
    raf=requestAnimationFrame(step);
  }
  $("#run").onclick=()=>{
    if(running)return;const F=+Fi.value,m=+mi.value;const fmax=fri.checked?MU*m*G:0;
    a=F>fmax?(F-fmax)/m:0; x=0;v=0;t=0;trace=[[0,0]];
    aMeas=a===0?0:+(a*(1+(Math.random()-0.5)*0.02)).toFixed(2); // simulated sensor: ±1 % measurement noise
    $("#rA").textContent=a===0?"0 m/s²":nf(aMeas)+" m/s² "+L({en:"(simulated sensor, ±1 %)",fr:"(capteur simulé, ±1 %)"});
    const msg=$("#labMsg");
    if(a===0){msg.hidden=false;msg.className="note bad";msg.textContent=F===0?L({en:"No force is applied: the cart stays at rest.",fr:"Aucune force n'est appliquée : le chariot reste au repos."}):L({en:"The cart does not move: static friction balances the push. Try a bigger force.",fr:"Le chariot ne bouge pas : le frottement statique équilibre la poussée. Essaie une force plus grande."});
      S.runs.push({F,m,fr:fri.checked,a:0});save();listRuns();draw();return;}
    msg.hidden=true;running=true;$("#run").disabled=true;last=performance.now();raf=requestAnimationFrame(step);
  };
  $("#clr").onclick=()=>{S.runs=[];save();listRuns();};
  Fi.addEventListener("input",draw);mi.addEventListener("input",draw);fri.addEventListener("change",draw);
  size();addEventListener("resize",size);
  stopAnim=()=>{cancelAnimationFrame(raf);removeEventListener("resize",size);};
}

/* ================= STEP 4: MODEL ================= */
const MODELS=[{k:"Fm",f:"a = F × m",fn:(F,m)=>F*m},{k:"F/m",f:"a = F ÷ m",fn:(F,m)=>F/m},{k:"F-m",f:"a = F − m",fn:(F,m)=>F-m},{k:"m/F",f:"a = m ÷ F",fn:(F,m)=>m/F}];

const QUIZ=[
  {q:{en:"A 1,200 kg car slows from 20 m/s to rest in 4 s. What is the magnitude of the braking force?",fr:"Une voiture de 1 200 kg passe de 20 m/s à l'arrêt en 4 s. Quelle est l'intensité de la force de freinage ?"},o:["3 000 N","6 000 N","24 000 N","4 800 N"],c:1,obj:"A3",fb:[{en:"You halved the acceleration. First a = Δv ÷ Δt = 20 ÷ 4 = 5 m/s², then F = m·a.",fr:"Tu as divisé l'accélération par deux. D'abord a = Δv ÷ Δt = 20 ÷ 4 = 5 m/s², puis F = m·a."},null,{en:"You multiplied the mass by the change in speed. Divide the change in speed by the time first: a = 20 ÷ 4 = 5 m/s².",fr:"Tu as multiplié la masse par la variation de vitesse. Divise d'abord par la durée : a = 20 ÷ 4 = 5 m/s²."},{en:"You multiplied by the time. Acceleration is the change in speed divided by the time.",fr:"Tu as multiplié par la durée. L'accélération est la variation de vitesse divisée par la durée."}],
   why:{en:"a = Δv/Δt = 20/4 = 5 m/s², so F = m·a = 1,200 × 5 = 6,000 N.",fr:"a = Δv/Δt = 20/4 = 5 m/s², donc F = m·a = 1 200 × 5 = 6 000 N."}},
  {q:{en:"A 2 kg cart is pushed with 10 N against a 4 N friction force. Its acceleration is:",fr:"Un chariot de 2 kg est poussé avec 10 N contre un frottement de 4 N. Son accélération vaut :"},o:["5 m/s²","7 m/s²","3 m/s²","2 m/s²"],c:2,obj:"A4",fb:[{en:"You forgot friction. The net force is 10 − 4 = 6 N, not 10 N.",fr:"Tu as oublié le frottement. La force résultante vaut 10 − 4 = 6 N, pas 10 N."},{en:"You added friction. It acts against the push, so subtract it: 10 − 4 = 6 N.",fr:"Tu as ajouté le frottement. Il s'oppose à la poussée, donc on le soustrait : 10 − 4 = 6 N."},null,{en:"You used only the friction force. Use the net force: 10 − 4 = 6 N.",fr:"Tu as utilisé seulement le frottement. Utilise la force résultante : 10 − 4 = 6 N."}],
   why:{en:"Net force = 10 − 4 = 6 N, so a = 6 / 2 = 3 m/s².",fr:"Force résultante = 10 − 4 = 6 N, donc a = 6 / 2 = 3 m/s²."}},
  {q:{en:"A student pulls a 10 kg crate on a horizontal floor with a horizontal force of 200 N. The friction force is 80 N. After representing the forces and applying Newton's second law along the motion, the acceleration of the crate is:",fr:"Un élève tire une caisse de 10 kg sur un sol horizontal avec une force horizontale de 200 N. La force de frottement vaut 80 N. Après avoir représenté les forces et appliqué la deuxième loi de Newton selon le mouvement, l'accélération de la caisse vaut :"},o:["20 m/s²","28 m/s²","12 m/s²","8 m/s²"],c:2,obj:"A4",fb:[{en:"You forgot friction. Along the motion, F − f = m·a.",fr:"Tu as oublié le frottement. Selon le mouvement, F − f = m·a."},{en:"You added friction. It points against the motion, so its projection is negative: F − f.",fr:"Tu as ajouté le frottement. Il est opposé au mouvement, donc sa projection est négative : F − f."},null,{en:"You used only the friction force. The net force along the motion is F − f = 120 N.",fr:"Tu as utilisé seulement le frottement. La force résultante selon le mouvement est F − f = 120 N."}],
   why:{en:"Forces: P (down), N (up), F (forward), f (backward). P and N cancel vertically. Along the motion: F − f = m·a, so a = (200 − 80) / 10 = 12 m/s².",fr:"Forces : P (vers le bas), N (vers le haut), F (vers l'avant), f (vers l'arrière). P et N se compensent verticalement. Selon le mouvement : F − f = m·a, donc a = (200 − 80) / 10 = 12 m/s²."}},
  {q:{en:"A hockey puck slides on nearly frictionless ice after being hit. Which statement is best supported by evidence?",fr:"Un palet glisse sur une glace presque sans frottement après avoir été frappé. Quelle affirmation est la mieux appuyée par les preuves ?"},
   o:[{en:"A force from the stick keeps pushing it.",fr:"Une force de la crosse continue de le pousser."},{en:"It keeps moving at constant velocity because the net force is almost zero.",fr:"Il garde une vitesse constante car la force résultante est presque nulle."},{en:"It slows down because its force runs out.",fr:"Il ralentit car sa force s'épuise."},{en:"It speeds up because it is moving.",fr:"Il accélère car il est en mouvement."}],c:1,obj:"C1",fb:[{en:"The stick touches the puck only during the hit. After that, no object pushes it forward. Motion does not need a force.",fr:"La crosse ne touche le palet que pendant la frappe. Ensuite, aucun objet ne le pousse. Le mouvement n'a pas besoin de force."},null,{en:"A moving body does not carry a force that gets used up (the old impetus idea). On real ice, it slows only because of a little friction.",fr:"Un corps en mouvement ne transporte pas une force qui s'épuise (l'ancienne idée d'impetus). Sur une vraie glace, il ralentit seulement à cause d'un peu de frottement."},{en:"Speeding up needs a net force forward, and nothing pushes the puck forward.",fr:"Accélérer demande une force résultante vers l'avant, et rien ne pousse le palet vers l'avant."}],
   why:{en:"First law: with no net force, velocity stays constant. The stick's force acted only during contact.",fr:"Première loi : sans force résultante, la vitesse reste constante. La force de la crosse n'a agi que pendant le contact."}},
  {q:{en:"A cart on a smooth track is pulled by a constant net force. What happens to its speed?",fr:"Un chariot sur un rail lisse est tiré par une force résultante constante. Que devient sa vitesse ?"},
   o:[{en:"It stays constant, because the force is constant.",fr:"Elle reste constante, car la force est constante."},{en:"It keeps increasing, by the same amount every second.",fr:"Elle augmente sans arrêt, de la même quantité chaque seconde."},{en:"It increases, then stays constant once the force is used up.",fr:"Elle augmente, puis reste constante une fois la force épuisée."},{en:"It increases only while the force is getting bigger.",fr:"Elle n'augmente que si la force grandit."}],c:1,obj:"A3",fb:[{en:"A constant force does not give a constant speed. It gives a constant acceleration.",fr:"Une force constante ne donne pas une vitesse constante. Elle donne une accélération constante."},null,{en:"A force is not used up. As long as the net force acts, the speed keeps increasing.",fr:"Une force ne s'épuise pas. Tant que la force résultante agit, la vitesse continue d'augmenter."},{en:"The force does not need to grow. A constant force already changes the speed steadily.",fr:"La force n'a pas besoin de grandir. Une force constante change déjà la vitesse régulièrement."}],

  {q:{en:"The taxi has stopped. A 70 kg passenger sits still on the seat. Which forces act on him?",fr:"Le taxi est arrêté. Un passager de 70 kg est assis immobile sur le siège. Quelles forces s'exercent sur lui ?"},
   o:[{en:"None, because he does not move.",fr:"Aucune, puisqu'il ne bouge pas."},{en:"Only his weight P.",fr:"Seulement son poids P."},{en:"His weight P and the push N of the seat, equal and opposite.",fr:"Son poids P et la poussée N du siège, égales et opposées."},{en:"His weight P and a force inside him that keeps him in place.",fr:"Son poids P et une force en lui qui le maintient en place."}],c:2,obj:"A4",fb:[{en:"At rest, the forces cancel: they do not disappear.",fr:"Au repos, les forces se compensent : elles ne disparaissent pas."},{en:"If only P acted, he would accelerate downward. The seat must push up with an equal force.",fr:"Si seul P agissait, il accélérerait vers le bas. Le siège doit pousser vers le haut avec une force égale."},null,{en:"A body cannot push itself. Every force comes from another object: here the Earth (P) and the seat (N).",fr:"Un corps ne peut pas se pousser lui-même. Toute force vient d'un autre objet : ici la Terre (P) et le siège (N)."}],
   why:{en:"At rest, a = 0, so ΣF = 0: the forces cancel, they do not disappear. The Earth pulls him down (P = m·g ≈ 686 N) and the seat pushes him up with N = 686 N. A seat can push: it is squeezed a little, like a spring.",fr:"Au repos, a = 0, donc ΣF = 0 : les forces se compensent, elles ne disparaissent pas. La Terre l'attire vers le bas (P = m·g ≈ 686 N) et le siège le pousse vers le haut avec N = 686 N. Un siège peut pousser : il est un peu comprimé, comme un ressort."}},
  {q:{en:"On smooth tracks, cart A (1 kg) is pulled with 2 N and cart B (2 kg) with 4 N. Which one accelerates more?",fr:"Sur des rails lisses, le chariot A (1 kg) est tiré avec 2 N et le chariot B (2 kg) avec 4 N. Lequel accélère le plus ?"},
   o:[{en:"A, because the lighter cart always accelerates more.",fr:"A, car le chariot léger accélère toujours plus."},{en:"B, because it is pulled with the bigger force.",fr:"B, car il est tiré avec la plus grande force."},{en:"Neither: both accelerate at 2 m/s².",fr:"Aucun : les deux accélèrent à 2 m/s²."},{en:"B, because heavier objects move faster.",fr:"B, car les objets lourds vont plus vite."}],c:2,obj:"A2",fb:[{en:"Mass alone does not decide: B has twice the mass, but also twice the force.",fr:"La masse seule ne décide pas : B a deux fois plus de masse, mais aussi deux fois plus de force."},{en:"Force alone does not decide: B's force is doubled, but so is its mass.",fr:"La force seule ne décide pas : la force de B est doublée, mais sa masse aussi."},null,{en:"Heavier objects are not faster in themselves. Compare F ÷ m for each cart.",fr:"Les objets lourds ne vont pas plus vite en eux-mêmes. Compare F ÷ m pour chaque chariot."}],
   why:{en:"a = F ÷ m: for A, 2 ÷ 1 = 2 m/s²; for B, 4 ÷ 2 = 2 m/s². What matters is the ratio of force to mass, not the mass alone or the force alone.",fr:"a = F ÷ m : pour A, 2 ÷ 1 = 2 m/s² ; pour B, 4 ÷ 2 = 2 m/s². Ce qui compte, c'est le rapport de la force à la masse, pas la masse seule ni la force seule."}}

function model(){
  const free=S.runs.filter(r=>!r.fr&&r.a>0), withFr=S.runs.filter(r=>r.fr&&r.a>0);
  const chosen=MODELS.find(m=>m.k===S.model);
  const rows=chosen?free.map(r=>{const p=chosen.fn(r.F,r.m);const ok=Math.abs(p-r.a)<=Math.max(.02,Math.abs(r.a)*.02);return {r,p,ok};}):[];

    ${chosen&&free.length?`<div class="tbl"><table><thead><tr><th>F (N)</th><th>m (kg)</th><th>${L({en:"measured a",fr:"a mesurée"})}</th><th>${L({en:"model predicts",fr:"le modèle prédit"})}</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td class="mono">${nf(x.r.F,0)}</td><td class="mono">${nf(x.r.m,1)}</td><td class="mono">${nf(x.r.a)}</td><td class="mono">${nf(x.p)}</td><td class="${x.ok?"ok":"no"}">${x.ok?"✓":"✗"}</td></tr>`).join("")}</tbody></table></div>
    ${!varied?`<p class="note">${L({en:"To tell the models apart, you need runs with at least two different forces and two different masses. Go back to step 3 and add some.",fr:"Pour départager les modèles, il te faut des essais avec au moins deux forces et deux masses différentes. Retourne à l'étape 3 pour en ajouter."})}</p>`:""}
    ${(!varied&&rows.every(x=>x.ok))?"":`<p class="note ${allOk?"good":"bad"}">`}${(!varied&&rows.every(x=>x.ok))?"":allOk?L({en:"Your model fits every run. You have built, from your own data, the model physicists call Newton's second law.",fr:"Ton modèle correspond à tous les essais. Tu as construit, à partir de tes données, le modèle que les physiciens appellent la deuxième loi de Newton."}):L({en:"This rule does not fit all your data. Try another one.",fr:"Cette règle ne correspond pas à toutes tes données. Essaies-en une autre."})}${(!varied&&rows.every(x=>x.ok))?"":"</p>"}`:""}
  </section>
  ${S.modelOK?`
  <section class="card">
    <div class="law"><span class="kicker">${L({en:"Newton's second law",fr:"Deuxième loi de Newton"})}</span><span class="eq">ΣF⃗ = m · a⃗</span>
      <p>${L({en:"The <b>net</b> force on an object equals its mass times its acceleration: ΣF = m·a. It is a vector law: the acceleration points in the direction of the net force. Force is measured by the change in motion it causes.",fr:"La force <b>résultante</b> sur un objet est égale à sa masse multipliée par son accélération : ΣF = m·a. C'est une loi vectorielle : l'accélération a la direction de la force résultante. On mesure une force par le changement de mouvement qu'elle produit."})}</p></div>

    ${disc("إذا لم نرَ القوّة أبدًا، بل رأينا أثرها فقط، فكيف نعرف أنّها موجودة؟ هل «القوّة» التي يشعر بها الراكب حقيقية؟")}

    <svg class="fbd" viewBox="0 0 380 210" role="img" aria-label="${L({en:"Free-body diagram of the crate: N up, P down, F to the right, f to the left",fr:"Bilan des forces sur la caisse : N vers le haut, P vers le bas, F vers la droite, f vers la gauche"})}">
      <defs><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>

      <line x1="220" y1="122" x2="310" y2="122" stroke="var(--primary)" stroke-width="3" marker-end="url(#ah3)"/><text x="296" y="112" fill="var(--primary)" font-weight="700">F</text>
      <line x1="140" y1="140" x2="80" y2="140" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah3)"/><text x="84" y="132" fill="var(--bad)" font-weight="700">f</text>
      <text x="206" y="176" fill="var(--muted)" font-size="12">${L({en:"direction of motion →",fr:"sens du mouvement →"})}</text>
    </svg>
    <p><b>${L({en:"Project P + N + F + f = m·a on the direction of motion. Which equation do you get?",fr:"Projette P + N + F + f = m·a sur la direction du mouvement. Quelle équation obtiens-tu ?"})}</b></p>
    <div class="opts" id="crate">${CRATE.map((o,j)=>{const a=S.crate;const cls=a==null?"":(j===1?"right":(j===a?"wrong":""));return `<button class="opt ${cls}" data-j="${j}" ${a!=null?"disabled":""}><span class="l">${"ABCD"[j]}</span><span>${o}</span></button>`;}).join("")}</div>
    ${S.crate!=null?`<p class="note ${S.crate===1?"good":"bad"}">${S.crate===1?"✓ ":"✗ "}${L({en:"P and N are perpendicular to the motion, so their projections are zero (and N = P, since the crate does not move vertically). F points in the direction of motion (+), f against it (−): F − f = m·a.",fr:"P et N sont perpendiculaires au mouvement : leurs projections sont nulles (et N = P, car la caisse ne bouge pas verticalement). F est dans le sens du mouvement (+), f en sens contraire (−) : F − f = m·a."})}</p>`:""}

const ARD_CODE=`// Sabab · Newton's 2nd law with an HC-SR04 sensor
const int TRIG = 9;
const int ECHO = 10;

void setup() {
  Serial.begin(9600);
  pinMode(TRIG, OUTPUT);
  pinMode(ECHO, INPUT);

}

void loop() {
  digitalWrite(TRIG, LOW);  delayMicroseconds(2);
  digitalWrite(TRIG, HIGH); delayMicroseconds(10);
  digitalWrite(TRIG, LOW);
  long echo = pulseIn(ECHO, HIGH, 30000);  // echo time in microseconds
  float cm = echo * 0.0343 / 2;            // sound travels 343 m/s, there and back
  Serial.print(millis());
  Serial.print(",");
  Serial.println(cm);
  delay(60);                               // the HC-SR04 needs about 60 ms between pings
}`;
function sampleData(){
  // Sample run: 0.5 kg cart, 50 g hanging mass, a ≈ 0.80 m/s² (friction included), small sensor noise
  const out=["time_ms,distance_cm"]; let seed=7;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280-0.5;};
  for(let i=0;i<=30;i++){const t=i*0.05;const x=20+0.5*80*t*t+rnd()*0.6;out.push(`${1200+i*50},${x.toFixed(1)}`);}
  return out.join("\n");
}
function fitQuad(pts){
  // least squares x = c0 + c1 t + c2 t²
  let S0=0,S1=0,S2=0,S3=0,S4=0,Y0=0,Y1=0,Y2=0;
  pts.forEach(([t,x])=>{const t2=t*t;S0++;S1+=t;S2+=t2;S3+=t2*t;S4+=t2*t2;Y0+=x;Y1+=x*t;Y2+=x*t2;});
  const M=[[S0,S1,S2,Y0],[S1,S2,S3,Y1],[S2,S3,S4,Y2]];
  for(let i=0;i<3;i++){let p=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];
    for(let r=0;r<3;r++){if(r===i)continue;const f=M[r][i]/M[i][i];for(let c=i;c<4;c++)M[r][c]-=f*M[i][c];}}
  return [M[0][3]/M[0][0],M[1][3]/M[1][1],M[2][3]/M[2][2]];
}
const MATS=[
  {k:"wall",n:{en:"Bare front (no protection)",fr:"Avant nu (sans protection)"},d:0.002},
  {k:"card",n:{en:"Folded cardboard",fr:"Carton plié"},d:0.010},

  {k:"bottle",n:{en:"Plastic-bottle crumple zone",fr:"Zone de déformation en bouteille plastique"},d:0.050}
];
// Keep only the part where the cart moves: drop the rest before release and the points after it reaches the stopper.
function trimMove(pts){
  const x0=pts[0][1];let s0=0;while(s0<pts.length-1&&pts[s0+1][1]-x0<0.005)s0++;
  let xm=-Infinity;for(let i=s0;i<pts.length;i++)xm=Math.max(xm,pts[i][1]);
  let im=s0;while(im<pts.length-1&&pts[im][1]<xm-0.005)im++;
  let seg=pts.slice(s0,im+1);if(seg.length<5)seg=pts;
  const t0=seg[0][0];return seg.map(([t,x])=>[t-t0,x]);
}

      <p>${L({en:"Design a poster for service-taxi passengers: why wear a seatbelt in the back seat? Use one force diagram, one number from your test, and a short message in Arabic and in French or English. The best posters can be printed for real taxis in your town.",fr:"Conçois une affiche pour les passagers des taxis-service : pourquoi mettre la ceinture à l'arrière ? Utilise un schéma de forces, un chiffre de ton test et un court message en arabe et en français ou en anglais. Les meilleures affiches peuvent être imprimées pour de vrais taxis de ta ville."})}</p></div>

  </section>`;
  const cv=$("#crash"),cx=cv.getContext("2d");let anim=null,raf;
  function size(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=170*d;cx.setTransform(d,0,0,d,0,0);draw(0,false);}
  function calc(){const h=M.h/100,v=Math.sqrt(2*9.8*h),d=MATS[M.mat].d,a=v*v/(2*d),F=0.06*a;return {v,a,F,ok:F<=25};}
  function upd(){const r=calc();$("#hV").textContent=M.h+" cm";$("#sv").textContent=nf(r.v)+" m/s";$("#sa").textContent=nf(r.a,0)+" m/s²";$("#sf").textContent=nf(r.F,1)+" N";
    const vd=$("#verdict");vd.className="note "+(r.ok?"good":"bad");vd.textContent=r.ok?L({en:"Prediction: the egg survives.",fr:"Prédiction : l'œuf survit."}):L({en:"Prediction: the egg breaks. Lengthen the stopping distance or lower the ramp.",fr:"Prédiction : l'œuf casse. Allonge la distance d'arrêt ou abaisse la rampe."});}
  function draw(p,broken){
    const W=cv.clientWidth,H=170;cx.fillStyle=css("--sky");cx.fillRect(0,0,W,H);
    const gy=H-30;cx.fillStyle=css("--road");cx.fillRect(0,gy,W,30);
    cx.fillStyle=css("--muted");cx.fillRect(W-30,gy-90,16,90);
    const crushW=Math.max(4,MATS[M.mat].d*900);
    const x=20+(W-30-crushW-90-20)*p;
    cx.fillStyle=css("--primary");roundRect(cx,x,gy-34,90,26,6);cx.fill();
    cx.fillStyle=css("--amber");const cw=p>=1?crushW*0.35:crushW;cx.fillRect(x+90,gy-30,cw,18);
    cx.fillStyle=css("--ink");[x+18,x+72].forEach(q=>{cx.beginPath();cx.arc(q,gy-6,7,0,7);cx.fill();});
    cx.save();cx.translate(x+45,gy-46);
    if(broken){cx.fillStyle="#F6E27A";cx.beginPath();cx.ellipse(6,10,16,5,0,0,7);cx.fill();cx.strokeStyle=css("--ink");cx.lineWidth=1.5;cx.beginPath();cx.moveTo(-10,4);cx.lineTo(-4,-2);cx.lineTo(0,4);cx.lineTo(4,-2);cx.stroke();}
    else{cx.fillStyle="#FFF8EC";cx.strokeStyle=css("--ink");cx.lineWidth=1.2;cx.beginPath();cx.ellipse(0,0,9,12,0,0,7);cx.fill();cx.stroke();}
    cx.restore();
  }
  $("#mats").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;M.mat=+b.dataset.i;save();$("#mats").querySelectorAll(".opt").forEach((o,i)=>o.setAttribute("aria-pressed",i===M.mat));upd();draw(0,false);};
  $("#h").oninput=e=>{M.h=+e.target.value;save();upd();};
  $("#test").onclick=()=>{cancelAnimationFrame(raf);const r=calc();const t0=performance.now();
    const go=now=>{const p=Math.min(1,(now-t0)/900);draw(p*p,p>=1&&!r.ok);if(p<1)raf=requestAnimationFrame(go);else{if(!M.steam&&M.design.trim().length>=10){M.steam=true;save();const b=$("#bNext");if(b)b.disabled=false;}}};raf=requestAnimationFrame(go);};
  $("#design").oninput=e=>{M.design=e.target.value;save();if(M.design.trim().length>=10&&!M.steam){M.steam=true;save();const b=$("#bNext");if(b)b.disabled=false;}};
  upd();size();addEventListener("resize",size);
  stopAnim=()=>{cancelAnimationFrame(raf);removeEventListener("resize",size);};
}

   sample:{en:"Rami always sat in the back of the service taxi, by the window, because from there he could watch the sea.\n\nThat morning, on the road to Saida, the driver braked so hard that Rami's forehead nearly hit the seat in front.\n\n\"Who pushed me?\" he asked.\n\nThe old man beside him laughed. \"Nobody pushed you, habibi. You just didn't want to stop.\"\n\nRami frowned. How can you move forward if nobody pushes you? And if nobody pushed him, why did he feel it so clearly?\n\nThat evening he wrote two questions in his notebook:\nWhat is a force?\nCan I feel something that isn't there?",
           fr:"Rami s'asseyait toujours à l'arrière du taxi-service, près de la fenêtre, parce que de là il voyait la mer.\n\nCe matin-là, sur la route de Saïda, le chauffeur freina si fort que le front de Rami faillit heurter le siège de devant.\n\n« Qui m'a poussé ? » demanda-t-il.\n\nLe vieil homme à côté de lui rit. « Personne ne t'a poussé, habibi. Tu ne voulais simplement pas t'arrêter. »\n\nRami fronça les sourcils. Comment avancer si personne ne vous pousse ? Et si personne ne l'avait poussé, pourquoi l'avait-il senti si clairement ?\n\nCe soir-là, il écrivit deux questions dans son carnet :\nQu'est-ce qu'une force ?\nPeut-on sentir quelque chose qui n'existe pas ?"}},
  {id:"s2",type:"story",aud:["student","parent"],price:4,ic:"stone",bg:"linear-gradient(160deg,#A8621F,#4A2A10)",

   sample:{en:"Isfahan, a thousand years ago. A young student throws a stone across the courtyard and turns to his teacher.\n\n\"Why does it keep flying after it leaves my hand? My hand is no longer touching it.\"\n\nThe teacher, Ibn Sina, picks up the stone and weighs it in his palm. \"You gave it something,\" he says. \"Call it mayl, an inclination. The air slowly takes it away.\"\n\n\"And if there were no air?\"\n\nThe master smiles. \"Then tell me: what would ever stop it?\"\n\nThe student is silent. Six centuries later, in England, a man named Newton will answer the same question.",
           fr:"Ispahan, il y a mille ans. Un jeune élève lance une pierre à travers la cour et se tourne vers son maître.\n\n« Pourquoi continue-t-elle de voler après avoir quitté ma main ? Ma main ne la touche plus. »\n\nLe maître, Ibn Sina, ramasse la pierre et la soupèse. « Tu lui as donné quelque chose, dit-il. Appelle-le mayl, une inclination. L'air la lui retire peu à peu. »\n\n« Et s'il n'y avait pas d'air ? »\n\nLe maître sourit. « Alors dis-moi : qu'est-ce qui l'arrêterait ? »\n\nL'élève se tait. Six siècles plus tard, en Angleterre, un certain Newton répondra à la même question."}},

   sample:{en:"At Raouché, Lina and her brother Karim watch the sun sink into the sea.\n\n\"It's red,\" says Karim.\n\n\"It's white,\" says Lina. \"It was white at noon. The sun didn't change. Your eyes did.\"\n\n\"So the red isn't real?\"\n\n\"I didn't say that.\"\n\nThey argue all the way home, and neither of them notices that they are asking one of the oldest questions in physics: is colour in the object, in the light, or in us?",
           fr:"À la Raouché, Lina et son frère Karim regardent le soleil plonger dans la mer.\n\n« Il est rouge », dit Karim.\n\n« Il est blanc, répond Lina. Il était blanc à midi. Le soleil n'a pas changé. Ce sont tes yeux. »\n\n« Alors le rouge n'est pas réel ? »\n\n« Je n'ai pas dit ça. »\n\nIls se disputent jusqu'à la maison, sans remarquer qu'ils posent l'une des plus vieilles questions de la physique : la couleur est-elle dans l'objet, dans la lumière, ou en nous ?"}},

   sample:{en:"The power cut comes at eight, as always. In the dark, the generator in the street coughs, then roars.\n\n\"Teta, where does the electricity go when it's used up?\"\n\nHis grandmother lights a candle. \"Nowhere, habibi. Your teacher says energy is never lost.\"\n\n\"Then why don't we have any?\"\n\nShe laughs, but she doesn't answer. And Youssef lies awake, listening to the generator, trying to understand how something that is never lost can still run out.",
           fr:"La coupure arrive à vingt heures, comme toujours. Dans le noir, le générateur de la rue tousse, puis rugit.\n\n« Teta, où va l'électricité quand on l'a utilisée ? »\n\nSa grand-mère allume une bougie. « Nulle part, habibi. Ton professeur dit que l'énergie ne se perd jamais. »\n\n« Alors pourquoi on n'en a pas ? »\n\nElle rit, mais ne répond pas. Et Youssef reste éveillé, à écouter le générateur, en cherchant à comprendre comment une chose qui ne se perd jamais peut quand même manquer."}},

      await V.db.collection("posts").add({type:ctype,q:ctype==="answer"?$("#cq").value:null,title:title.slice(0,120),body:body.slice(0,3000),by:V.me,anon:$("#canon").checked,at:Date.now(),lang:S.lang});
      $("#ctitle").value="";$("#cbody").value="";show(tx("Published. It is now visible to everyone on Student Voices.","Publié. C'est maintenant visible par tous sur Voix des élèves."),"good");
      V.filter="all";V.q="all";V.sort="new";
    }catch(e){
      show(e&&e.code==="quota_exceeded"?tx("The board is full. Ask your teacher to archive old posts.","Le mur est plein. Demande à ton enseignant d'archiver d'anciens messages."):e&&e.code==="invalid_argument"?tx("You can read posts here, but your access does not allow publishing.","Tu peux lire ici, mais ton accès ne permet pas de publier."):tx("Could not publish. Check your connection and try again.","Publication impossible. Vérifie ta connexion et réessaie."),"bad");
    }finally{V.busy=false;$("#cpub").disabled=false;}
  };
  if(V.readOnly){$("#composeCard").innerHTML=`<h3>${tx("Publish","Publier")}</h3><p class="muted">${tx("You can read and follow the discussion. Your access to this page does not allow publishing.","Tu peux lire et suivre la discussion. Ton accès ne permet pas de publier.")}</p>`;}

}
async function drawFeed(){
  const feed=$("#feed"); if(!feed)return;
  const tx=(en,fr)=>S.lang==="fr"?fr:en;
  if(V.failed){feed.innerHTML=`<div class="card"><h3>${tx("Sharing isn't available in this view","Le partage n'est pas disponible ici")}</h3><p class="muted">${tx("Open this page on claude.ai while signed in to read and publish posts.","Ouvre cette page sur claude.ai en étant connecté pour lire et publier.")}</p></div>`;return;}
  if(!V.loaded){feed.innerHTML=`<p class="muted">${tx("Loading posts…","Chargement…")}</p>`;return;}
  // keep comment drafts and focus across live refreshes
  let focusId=null,selS=0,selE=0; const ae=document.activeElement;
  feed.querySelectorAll("textarea[data-cdraft]").forEach(t=>{V.drafts[t.dataset.cdraft]=t.value; if(t===ae){focusId=t.dataset.cdraft;selS=t.selectionStart;selE=t.selectionEnd;}});
  const count=pid=>V.reacts.filter(r=>r.post===pid).length;
  let list=V.posts.filter(p=>(V.filter==="all"||p.type===V.filter)&&(V.q==="all"||p.q===V.q));
  if(V.sort==="top") list=list.slice().sort((a,b)=>count(b.id)-count(a.id)||(b.at||0)-(a.at||0));
  const ids=[...new Set([...list.map(p=>p.by),...V.comments.map(c=>c.by)].filter(x=>x&&x!=="sabab-team"))];
  const ps=V.user&&ids.length?await V.user.profiles(ids):{};
  const who=(id,anon)=>{ if(id==="sabab-team")return {name:tx("Sabab team (example)","Équipe Sabab (exemple)"),av:null};
    if(anon)return {name:tx("A student","Un élève"),av:null}; const p=ps[id]; return {name:(p&&p.name)||tx("A student","Un élève"),av:p?p.avatarUrl:null,me:id&&id===V.me}; };
  const typeName=t=>L({answer:{en:"Answer",fr:"Réponse"},story:{en:"Story",fr:"Récit"},case:{en:"Case study",fr:"Étude de cas"}}[t]||{en:"Post",fr:"Message"});
  if(!list.length){feed.innerHTML=`<div class="card"><p class="muted">${V.posts.length?tx("No posts match these filters.","Aucun message pour ces filtres."):tx("No posts yet. Be the first to publish.","Aucun message pour l'instant. Sois le premier à publier.")}</p></div>`;return;}
  feed.innerHTML=list.map(p=>{
    const a=who(p.by,p.anon); const q=QS.find(x=>x.k===p.q); const n=count(p.id); const mine=V.me&&V.reacts.some(r=>r.post===p.id&&r.by===V.me);
    const cm=V.comments.filter(c=>c.post===p.id); const reported=V.reports.filter(r=>r.post===p.id).length; const canDel=(V.me&&p.by===V.me)||V.owner;
    const isOpen=!!V.open[p.id];
    return `<article class="post">
      <div class="phead">${a.av?`<img class="av" src="${esc(a.av)}" alt="">`:`<span class="av av0">${p.by==="sabab-team"?"S":"?"}</span>`}
        <div><b>${esc(a.name)}</b>${a.me?` <span class="chip">${tx("you","toi")}</span>`:""}<br><small class="muted">${fmtDate(p.at)}</small></div>
        <span class="chip ptype ${esc(p.type)}">${esc(typeName(p.type))}</span></div>
      ${q?`<p class="pq">${esc(L(q.t))} <span class="ar">${q.ar}</span></p>`:""}
      <h3>${esc(p.title||"")}</h3>
      <p class="pbody" dir="auto">${esc(p.body||"")}</p>
      ${V.owner&&reported?`<p class="note bad" style="font-size:.85rem">${tx("Reported","Signalé")} ×${reported}</p>`:""}
      <div class="pact">
        <button class="pbtn ${mine?"on":""}" data-think="${p.id}" aria-pressed="${!!mine}">${tx("Made me think","M'a fait réfléchir")} · <span class="mono">${n}</span></button>
        <button class="pbtn" data-open="${p.id}" aria-expanded="${isOpen}">${tx("Comments","Commentaires")} · <span class="mono">${cm.length}</span></button>
        ${canDel?`<button class="pbtn" data-del="${p.id}">${tx("Delete","Supprimer")}</button>`:(V.me?`<button class="pbtn" data-rep="${p.id}">${tx("Report","Signaler")}</button>`:"")}
      </div>
      ${isOpen?`<div class="comments">${cm.map(c=>{const ca=who(c.by,false);return `<div class="cm"><b>${esc(ca.name)}</b> <small class="muted">${fmtDate(c.at)}</small>${(V.me&&c.by===V.me)||V.owner?` <button class="linkbtn" data-cdel="${c.id}">${tx("delete","supprimer")}</button>`:""}<p dir="auto">${esc(c.text||"")}</p></div>`;}).join("")||`<p class="muted" style="font-size:.9rem">${tx("No comments yet.","Pas encore de commentaires.")}</p>`}
        ${V.readOnly?"":`<div class="cbox"><textarea data-cdraft="${p.id}" id="cd_${p.id}" maxlength="1000" dir="auto" placeholder="${tx("Add a reasoned comment…","Ajoute un commentaire argumenté…")}">${esc(V.drafts[p.id]||"")}</textarea><button class="sbtn" data-csend="${p.id}">${tx("Send","Envoyer")}</button></div>`}</div>`:""}
    </article>`;}).join("");
  if(focusId){const t=$("#cd_"+focusId);if(t){t.focus();try{t.setSelectionRange(selS,selE);}catch(e){}}}
  feed.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{V.open[b.dataset.open]=!V.open[b.dataset.open];drawFeed();});
  feed.querySelectorAll("[data-think]").forEach(b=>b.onclick=async()=>{if(!V.db||!V.me)return;const ref=V.db.collection("reactions").doc(b.dataset.think+"__"+V.me);
    try{ if(b.getAttribute("aria-pressed")==="true") await ref.delete(); else await ref.set({post:b.dataset.think,by:V.me,at:Date.now()}); }catch(e){}});
  feed.querySelectorAll("[data-csend]").forEach(b=>b.onclick=async()=>{const pid=b.dataset.csend;const t=$("#cd_"+pid);const text=(t.value||"").trim();if(text.length<2||!V.db)return;b.disabled=true;
    try{await V.db.collection("comments").add({post:pid,by:V.me,text:text.slice(0,1000),at:Date.now()});V.drafts[pid]="";t.value="";}catch(e){b.disabled=false;}});
  feed.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent=tx("Confirm delete","Confirmer");return;}
    const pid=b.dataset.del;try{await V.db.collection("posts").doc(pid).delete();for(const c of V.comments.filter(c=>c.post===pid))await V.db.collection("comments").doc(c.id).delete();}catch(e){}});
  feed.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=async()=>{try{await V.db.collection("comments").doc(b.dataset.cdel).delete();}catch(e){}});
  feed.querySelectorAll("[data-rep]").forEach(b=>b.onclick=async()=>{if(!V.me)return;try{await V.db.collection("reports").doc(b.dataset.rep+"__"+V.me).set({post:b.dataset.rep,by:V.me,at:Date.now()});b.textContent=tx("Reported","Signalé");b.disabled=true;}catch(e){}});
}

function ladderHTML(){
  const id=S.lesson||"L3"; const set=LADDERS[id]; if(!set) return "";
  S.lad=S.lad||{}; const k=S.ladTab&&S.ladTab[id]||0; const lad=set[Math.min(k,set.length-1)];
  const tabs=set.length>1?`<div class="row" role="tablist" style="gap:6px">${set.map((x,i)=>`<button class="btn ${i===k?"":"ghost"}" data-ladt="${i}" role="tab" aria-selected="${i===k}"><span class="ar" style="display:inline">${x.t}</span></button>`).join("")}</div>`:"";
  return `<section class="card ladder">
    <span class="kicker">${L({en:"From physics to life",fr:"De la physique à la vie"})}</span>
    <h2 class="ar" style="margin:0">من الفيزياء إلى الحياة: ${lad.t}</h2>
    <p class="muted" style="font-size:.92rem">${L({en:"One concept, six rungs. Climb as far as you can; answer at least one rung in writing. There is no right answer, but there are better reasons.",fr:"Un concept, six marches. Monte aussi loin que tu peux ; réponds par écrit à au moins une marche. Il n'y a pas de bonne réponse, mais il y a de meilleures raisons."})}</p>
    ${tabs}
    <p class="ar lad-c">${lad.c}</p>
    <ol class="lad">${lad.q.map((q,i)=>{const key=id+":"+k+":"+i;return `<li><div class="lad-h"><span class="lad-n">${i+1}</span><span class="ar"><b>${RUNGS[i]}</b></span><small class="muted">${L(RUNG_EN[i])}</small></div>
      <p class="ar">${q}</p>
      <textarea class="ar" dir="rtl" data-lad="${key}" aria-label="${L(RUNG_EN[i])}" placeholder="…">${esc(S.lad[key]||"")}</textarea></li>`;}).join("")}</ol>
  </section>`;
}
function bindLadder(rerender){
  document.querySelectorAll("[data-lad]").forEach(t=>t.oninput=e=>{S.lad=S.lad||{};S.lad[t.dataset.lad]=e.target.value;save();});
  document.querySelectorAll("[data-explore]").forEach(b=>b.onclick=()=>openExplore(b.dataset.explore));
  document.querySelectorAll(".gofur [data-read]").forEach(b=>b.onclick=()=>openStory(b.dataset.read));
  document.querySelectorAll("[data-ladt]").forEach(b=>b.onclick=()=>{S.ladTab=S.ladTab||{};S.ladTab[S.lesson||"L3"]=+b.dataset.ladt;save();rerender();});
}
function teacherLayerHTML(tx){

    <div class="row"><button class="btn ghost" id="valOn">${tx("Show the reference layer (school opted in)","Afficher la couche de référence (école ayant choisi l'option)")}</button></div></section>`;
  return `<section class="card"><div class="row" style="justify-content:space-between"><span class="kicker">${tx("Values track · teacher reference","Parcours des valeurs · référence enseignant")}</span><button class="linkbtn" id="valOff">${tx("Hide","Masquer")}</button></div>

    <p>${tx("Each lesson ends with a six-rung concept ladder (concept, physics, community, world, values, limits of the analogy) in the Reflect step. Students see only the questions. This table gives the value each ladder leads toward, the Divine Name it reflects in the research framework of education through the Names, and a Qur'anic reference, for teachers who want the background. Do not read it out; let the value emerge from the students' own reasoning.","Chaque leçon se termine, à l'étape Réfléchir, par une échelle de concepts à six marches (concept, physique, société, monde, valeurs, limites de l'analogie). Les élèves ne voient que les questions. Ce tableau donne la valeur visée par chaque échelle, le Nom divin qu'elle reflète dans le cadre de recherche de l'éducation par les Noms, et une référence coranique, pour l'enseignant qui veut le contexte. Ne pas le lire en classe ; laisser la valeur émerger du raisonnement des élèves.")}</p>
    <div class="tbl"><table class="rub"><thead><tr><th>${tx("Lesson","Leçon")}</th><th>${tx("Ladder","Échelle")}</th><th>${tx("Value","Valeur")}</th><th>${tx("Name","Nom")}</th><th>${tx("Reference","Référence")}</th></tr></thead><tbody>
    ${LAYER.map(x=>`<tr><td>${x.l.replace("L","")}</td><td class="ar">${LADDERS[x.l][x.lad].t}</td><td>${L(x.v)}</td><td class="ar">${x.n}</td><td class="ar">${x.r}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:.9rem">${tx("Facilitation: take one rung per session in the discussion circle; rung 6 matters most, because it stops the analogy from becoming a moral lesson disguised as physics. Transparency: school agreements state that the values track is inspired by an educational research framework.","Animation : une marche par séance dans le cercle de discussion ; la marche 6 est la plus importante, car elle empêche l'analogie de devenir une leçon de morale déguisée en physique. Transparence : les conventions avec les écoles précisent que le parcours des valeurs s'inspire d'un cadre de recherche éducative.")}</p>
  </section>`;
}

 L6:{ch:9,title:{en:"Is the centre of mass a real place?",fr:"Le centre de masse est-il un lieu réel ?"},

 L8:{ch:10,title:{en:"Why is it harder to turn some things than others?",fr:"Pourquoi certains objets sont-ils plus durs à faire tourner ?"},

function mountFilm(){
  const cv=document.getElementById("filmCv"); if(!cv) return; const c=cv.getContext("2d");
  let t=0,playing=false,last=0,raf=0; const seek=document.getElementById("filmSeek"),tm=document.getElementById("filmTime"),pb=document.getElementById("filmPlay"),big=document.getElementById("filmBig");
  const fmt=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
  const paint=()=>{FILM_BRAKE.draw(c,t);seek.value=t;tm.textContent=fmt(t);pb.textContent=playing?"❚❚":"▶";big.hidden=playing;};
  const loop=now=>{ if(!document.body.contains(cv)){playing=false;au.pause();return;} const dtt=Math.min((now-last)/1000,0.1);last=now; if(playing){t+=dtt; if(t>=FILM_BRAKE.DUR){t=FILM_BRAKE.DUR;playing=false;au.pause();} else if(Math.abs(au.currentTime-t)>0.4) syncA();} paint(); if(playing) raf=requestAnimationFrame(loop); };
  const play=()=>{ if(t>=FILM_BRAKE.DUR) t=0; playing=true; last=performance.now(); syncA(); au.play().catch(()=>{}); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); };
  const au=new Audio(FILM_AUDIO); au.preload="metadata"; let muted=false; const mb=document.getElementById("filmMute");
  const syncA=()=>{try{if(Math.abs(au.currentTime-t)>0.25)au.currentTime=t;}catch(e){}};
  mb.onclick=()=>{muted=!muted;au.muted=muted;mb.setAttribute("aria-pressed",muted);mb.textContent=muted?L({en:"Sound off",fr:"Son coupé"}):L({en:"Sound on",fr:"Son activé"});};
  const pause=()=>{playing=false;au.pause();paint();};
  pb.onclick=()=>playing?pause():play(); big.onclick=play; cv.onclick=()=>playing?pause():play();
  seek.oninput=e=>{t=+e.target.value;syncA();paint();};
  document.getElementById("filmSlow").onclick=()=>{t=34;play();};
  const draw0=()=>{ t=Math.min(t,FILM_BRAKE.DUR); paint(); };
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw0); draw0();
}

/* ===== Beyond: explorations B2–B10 (generic engine) ===== */
function xLoop(cv,fn){let last=performance.now();const f=now=>{if(!document.body.contains(cv))return;const dt=Math.min((now-last)/1000,0.1);last=now;fn(dt);requestAnimationFrame(f);};requestAnimationFrame(f);}
function xCv(w,h,label){return `<div class="xsim"><canvas id="xcv" width="${w}" height="${h}" aria-label="${esc(label)}"></canvas></div>`;}
const XRM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function xStars(c,W,H,n){for(let i=0;i<n;i++){const x=(i*137.5)%W,y=(i*89.3)%H;c.fillStyle="rgba(255,255,255,"+(0.2+0.5*((i*7)%10)/10)+")";c.fillRect(x,y,1.5,1.5);}}
