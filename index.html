  lede:{en:"From average velocity to instantaneous velocity, the velocity vector as the derivative of position, and how to read x(t) and v(t) graphs.",fr:"De la vitesse moyenne à la vitesse instantanée, le vecteur vitesse comme dérivée de la position, et la lecture des graphes x(t) et v(t)."},
  key:()=>kbox("v = dx/dt  ;  v⃗ = dOM⃗/dt",tx2(
    "<b>Average velocity</b> between two instants: v_avg = Δx ÷ Δt (the slope of the <i>secant</i> on the x(t) graph). <b>Instantaneous velocity</b> is the limit when Δt → 0: v = dx/dt, the slope of the <i>tangent</i> to x(t). In a plane, OM⃗ = x·i⃗ + y·j⃗, so <b>v⃗ = dOM⃗/dt</b> with components vx = dx/dt and vy = dy/dt; v⃗ is always <b>tangent to the trajectory</b>. In the same way, the acceleration is <b>a⃗ = dv⃗/dt</b>: the slope of the v(t) graph. Reading graphs: a straight x(t) means uniform motion (v constant); a straight, sloped v(t) means uniformly accelerated motion (a constant); the area under v(t) is the displacement.",
    "<b>Vitesse moyenne</b> entre deux instants : v_moy = Δx ÷ Δt (la pente de la <i>sécante</i> sur le graphe x(t)). La <b>vitesse instantanée</b> est la limite quand Δt → 0 : v = dx/dt, la pente de la <i>tangente</i> à x(t). Dans le plan, OM⃗ = x·i⃗ + y·j⃗, donc <b>v⃗ = dOM⃗/dt</b> de composantes vx = dx/dt et vy = dy/dt ; v⃗ est toujours <b>tangent à la trajectoire</b>. De même, l'accélération est <b>a⃗ = dv⃗/dt</b> : la pente du graphe v(t). Lecture des graphes : x(t) droite = mouvement uniforme (v constante) ; v(t) droite inclinée = mouvement uniformément varié (a constante) ; l'aire sous v(t) est le déplacement.")),
  exTitle:{en:"Shrink Δt and watch the secant become the tangent",fr:"Réduis Δt et regarde la sécante devenir la tangente"},
  exText:{en:"Motion: x(t) = ½·a·t² + v₀·t. Top: x(t) with the secant (amber) over [t, t + Δt] and the tangent (blue) at t. Bottom: v(t).",fr:"Mouvement : x(t) = ½·a·t² + v₀·t. En haut : x(t) avec la sécante (orange) sur [t, t + Δt] et la tangente (bleu) en t. En bas : v(t)."},
  H:360,
  ctrl:()=>slider("sa","Acceleration a","Accélération a",-2,2,0.5,1)+slider("sv","Initial velocity v₀","Vitesse initiale v₀",-3,4,1,1)+slider("st","Instant t","Instant t",0,5,0.1,2)+slider("sd","Interval Δt","Intervalle Δt",0.1,3,0.1,2)+
    `<div class="readout"><div><small>${tx2("Average v on [t, t+Δt]","v moyenne sur [t, t+Δt]")}</small><b id="rAvg">—</b></div><div><small>${tx2("Instantaneous v(t)","v(t) instantanée")}</small><b id="rIns">—</b></div></div>`,
  run:()=>{const I=id=>+$("#"+id).value;
    const x=(t,a,v0)=>0.5*a*t*t+v0*t;
    const redraw=canvasSetup("skc",360,(ctx,W,H)=>{const a=I("sa"),v0=I("sv"),t=I("st"),dt=I("sd"),T=6;
      ctx.fillStyle=css("--surface");ctx.fillRect(0,0,W,H);
      const xs=[];for(let i=0;i<=60;i++)xs.push(x(T*i/60,a,v0));const xmin=Math.min(0,...xs),xmax=Math.max(1,...xs);
      const vmin=Math.min(0,v0,v0+a*T),vmax=Math.max(1,v0,v0+a*T);
      const plot=(y0,h,lo,hi,label,fn,col)=>{const l=46,r=W-12;const X=tt=>l+(r-l)*tt/T,Y=v=>y0+h-(h*(v-lo)/((hi-lo)||1));
        ctx.strokeStyle=css("--line");ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(l,y0);ctx.lineTo(l,y0+h);ctx.lineTo(r,y0+h);ctx.stroke();
        if(lo<0&&hi>0){ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(l,Y(0));ctx.lineTo(r,Y(0));ctx.stroke();ctx.setLineDash([]);}
        ctx.fillStyle=css("--muted");ctx.font="11px "+css("--mono");ctx.fillText(label,6,y0+12);for(let s=0;s<=6;s+=2)ctx.fillText(s+"s",X(s)-6,y0+h+13);
        ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=60;i++){const tt=T*i/60;i?ctx.lineTo(X(tt),Y(fn(tt))):ctx.moveTo(X(tt),Y(fn(tt)));}ctx.stroke();return {X,Y};};
      const P=plot(10,H*0.5-30,xmin,xmax,"x (m)",tt=>x(tt,a,v0),css("--ink"));
      const t2=Math.min(T,t+dt),x1=x(t,a,v0),x2=x(t2,a,v0),avg=(x2-x1)/((t2-t)||1e-9),ins=v0+a*t;
      const line=(slope,col,dash)=>{ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(P.X(t-1.2),P.Y(x1-slope*1.2));ctx.lineTo(P.X(t+2.5),P.Y(x1+slope*2.5));ctx.stroke();ctx.setLineDash([]);};
      ctx.save();ctx.beginPath();ctx.rect(46,10,W-58,H*0.5-30);ctx.clip();line(avg,css("--amber"),[6,4]);line(ins,css("--primary"));ctx.restore();
      ctx.fillStyle=css("--primary");ctx.beginPath();ctx.arc(P.X(t),P.Y(x1),5,0,7);ctx.fill();ctx.fillStyle=css("--amber");ctx.beginPath();ctx.arc(P.X(t2),P.Y(x2),5,0,7);ctx.fill();
      const Q=plot(H*0.5+10,H*0.5-34,vmin,vmax,"v (m/s)",tt=>v0+a*tt,css("--primary"));
      ctx.fillStyle=css("--primary");ctx.beginPath();ctx.arc(Q.X(t),Q.Y(ins),5,0,7);ctx.fill();
      ["sa","sv"].forEach(k=>$("#"+k+"V").textContent=nf(I(k),1)+(k==="sa"?" m/s²":" m/s"));$("#stV").textContent=nf(t,1)+" s";$("#sdV").textContent=nf(dt,1)+" s";
      $("#rAvg").textContent=nf(avg)+" m/s";$("#rIns").textContent=nf(ins)+" m/s";});
    setupSliders(["sa","sv","st","sd"],redraw);},
  example:()=>`<p>${tx2("A particle moves on an axis with <b>x(t) = 2t² − 4t + 1</b> (SI units).","Un mobile se déplace sur un axe avec <b>x(t) = 2t² − 4t + 1</b> (unités SI).")}</p>
    <ol style="margin:0;padding-left:20px;display:grid;gap:6px"><li>${tx2("Velocity: v = dx/dt = <b>4t − 4</b>.","Vitesse : v = dx/dt = <b>4t − 4</b>.")}</li><li>${tx2("Acceleration: a = dv/dt = <b>4 m/s²</b>, constant: the motion is uniformly accelerated.","Accélération : a = dv/dt = <b>4 m/s²</b>, constante : le mouvement est uniformément varié.")}</li><li>${tx2("v = 0 when 4t − 4 = 0, so at <b>t = 1 s</b>: the particle turns back, at x(1) = −1 m.","v = 0 quand 4t − 4 = 0, donc à <b>t = 1 s</b> : le mobile fait demi-tour, en x(1) = −1 m.")}</li><li>${tx2("For t &lt; 1 s, v &lt; 0 and a &gt; 0: the motion is <b>decelerated</b>; for t &gt; 1 s it is <b>accelerated</b>.","Pour t &lt; 1 s, v &lt; 0 et a &gt; 0 : le mouvement est <b>retardé</b> ; pour t &gt; 1 s il est <b>accéléré</b>.")}</li></ol>`,
  quiz:[
    {q:{en:"x(t) = 3t² + 2t (SI). What is the velocity at t = 2 s?",fr:"x(t) = 3t² + 2t (SI). Quelle est la vitesse à t = 2 s ?"},o:["16 m/s","14 m/s","12 m/s","8 m/s"],c:1,why:{en:"v = 6t + 2 = 14 m/s.",fr:"v = 6t + 2 = 14 m/s."}},
    {q:{en:"On an x(t) graph, the instantaneous velocity at t is…",fr:"Sur un graphe x(t), la vitesse instantanée en t est…"},o:[{en:"the value of x at t",fr:"la valeur de x en t"},{en:"the slope of the tangent at t",fr:"la pente de la tangente en t"},{en:"the area under the curve",fr:"l'aire sous la courbe"},{en:"x divided by t",fr:"x divisé par t"}],c:1,why:{en:"v = dx/dt is the slope of the tangent.",fr:"v = dx/dt est la pente de la tangente."}},
    {q:{en:"A v(t) graph is a horizontal line above the time axis. The motion is…",fr:"Un graphe v(t) est une droite horizontale au-dessus de l'axe des temps. Le mouvement est…"},o:[{en:"at rest",fr:"au repos"},{en:"uniform",fr:"uniforme"},{en:"uniformly accelerated",fr:"uniformément accéléré"},{en:"decelerated",fr:"retardé"}],c:1,why:{en:"v is constant and not zero, and a = dv/dt = 0.",fr:"v est constante et non nulle, et a = dv/dt = 0."}},

/* ---- 7.B Tangential and normal acceleration ---- */
const SB={code:"7.B",title:{en:"Tangential and normal acceleration",fr:"Accélération tangentielle et normale"},
  lede:{en:"On a curve, acceleration has two jobs: changing the speed and changing the direction. Split it into two components to see each one.",fr:"Sur une courbe, l'accélération a deux rôles : changer la valeur de la vitesse et changer sa direction. On la décompose pour voir chacun."},
  key:()=>kbox("a_t = dv/dt  ;  a_n = v²/R",tx2(
    "In the <b>Frenet frame</b> attached to the moving point (unit vector τ⃗ tangent to the trajectory in the direction of motion, n⃗ normal and pointing toward the inside of the curve): <b>a⃗ = a_t·τ⃗ + a_n·n⃗</b>. The <b>tangential</b> component a_t = dv/dt changes the <i>speed</i> (a_t &gt; 0 speeding up, a_t &lt; 0 slowing down). The <b>normal</b> component a_n = v²/R changes the <i>direction</i>; it always points toward the centre of curvature, R being the radius of curvature. Magnitude: <b>a = √(a_t² + a_n²)</b>. Special cases: uniform circular motion, a_t = 0; straight line, a_n = 0.",
    "Dans le <b>repère de Frenet</b> lié au point mobile (vecteur unitaire τ⃗ tangent à la trajectoire dans le sens du mouvement, n⃗ normal et orienté vers l'intérieur de la courbe) : <b>a⃗ = a_t·τ⃗ + a_n·n⃗</b>. La composante <b>tangentielle</b> a_t = dv/dt modifie la <i>valeur</i> de la vitesse (a_t &gt; 0 accéléré, a_t &lt; 0 retardé). La composante <b>normale</b> a_n = v²/R modifie la <i>direction</i> ; elle est toujours dirigée vers le centre de courbure, R étant le rayon de courbure. Valeur : <b>a = √(a_t² + a_n²)</b>. Cas particuliers : mouvement circulaire uniforme, a_t = 0 ; mouvement rectiligne, a_n = 0.")),
  exTitle:{en:"A car on a circular track",fr:"Une voiture sur une piste circulaire"},
  exText:{en:"Choose the radius, the speed and whether the driver speeds up or brakes. Watch a_t (green), a_n (red) and the total a (amber).",fr:"Choisis le rayon, la vitesse et si le conducteur accélère ou freine. Observe a_t (vert), a_n (rouge) et a totale (orange)."},
  H:320,
  ctrl:()=>slider("bR","Radius R","Rayon R",10,50,5,25)+slider("bv","Speed v","Vitesse v",2,20,1,10)+slider("bt","Tangential acc. a_t","Acc. tangentielle a_t",-3,3,0.5,0)+
    `<div class="readout"><div><small>a_t</small><b id="rt">—</b></div><div><small>a_n = v²/R</small><b id="rn">—</b></div><div style="grid-column:1/-1"><small>a = √(a_t² + a_n²)</small><b id="ra">—</b></div></div>`,
  run:()=>{const I=id=>+$("#"+id).value;let th=0,raf,last=performance.now();
    const redraw=canvasSetup("skc",320,(ctx,W,H)=>{const R=I("bR"),v=I("bv"),at=I("bt"),an=v*v/R,a=Math.hypot(at,an);
      ctx.fillStyle=css("--surface");ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2,Rp=Math.min(W/2-50,H/2-40)*(0.55+0.45*R/50);
      ctx.strokeStyle=css("--line");ctx.lineWidth=14;ctx.beginPath();ctx.arc(cx,cy,Rp,0,7);ctx.stroke();ctx.fillStyle=css("--muted");ctx.beginPath();ctx.arc(cx,cy,3,0,7);ctx.fill();
      const px=cx+Rp*Math.cos(th),py=cy+Rp*Math.sin(th),tx=-Math.sin(th),ty=Math.cos(th),nx=-Math.cos(th),ny=-Math.sin(th),k=16;

      $("#bRV").textContent=R+" m";$("#bvV").textContent=v+" m/s";$("#btV").textContent=nf(at,1)+" m/s²";$("#rt").textContent=nf(at)+" m/s²";$("#rn").textContent=nf(an)+" m/s²";$("#ra").textContent=nf(a)+" m/s²";});

  example:()=>`<p>${tx2("A car takes a bend of radius <b>R = 50 m</b>. At some instant its speed is <b>v = 10 m/s</b> and it is speeding up at <b>2 m/s²</b>.","Une voiture prend un virage de rayon <b>R = 50 m</b>. À un instant, sa vitesse vaut <b>v = 10 m/s</b> et elle accélère de <b>2 m/s²</b>.")}</p>

/* ---- 7.C Angular speed, period, frequency ---- */
const SC={code:"7.C",title:{en:"Angular speed ω, period and frequency",fr:"Vitesse angulaire ω, période et fréquence"},
  lede:{en:"Every point of a turning wheel turns through the same angle, but not at the same speed. Angular quantities describe rotation for the whole object at once.",fr:"Tous les points d'une roue qui tourne balaient le même angle, mais pas à la même vitesse. Les grandeurs angulaires décrivent la rotation de tout l'objet à la fois."},
  key:()=>kbox("ω = dθ/dt ; v = R·ω ; T = 2π/ω ; f = 1/T",tx2(
    "The angular position θ is measured in <b>radians</b> (one turn = 2π rad). The <b>angular speed</b> ω = dθ/dt is in rad/s. For a point at distance R from the axis, the arc length is s = R·θ, so its speed is <b>v = R·ω</b>. In uniform circular motion ω is constant: the <b>period</b> T (s) is the time for one turn, <b>T = 2π/ω</b>, and the <b>frequency</b> f (Hz) is the number of turns per second, <b>f = 1/T</b>, so ω = 2πf. The normal acceleration can also be written <b>a_n = v²/R = R·ω²</b>. Useful: 1 turn per minute (rpm) = 2π/60 rad/s.",
    "La position angulaire θ se mesure en <b>radians</b> (un tour = 2π rad). La <b>vitesse angulaire</b> ω = dθ/dt s'exprime en rad/s. Pour un point à la distance R de l'axe, l'abscisse curviligne est s = R·θ, donc sa vitesse est <b>v = R·ω</b>. En mouvement circulaire uniforme ω est constante : la <b>période</b> T (s) est la durée d'un tour, <b>T = 2π/ω</b>, et la <b>fréquence</b> f (Hz) est le nombre de tours par seconde, <b>f = 1/T</b>, donc ω = 2πf. L'accélération normale s'écrit aussi <b>a_n = v²/R = R·ω²</b>. Utile : 1 tour par minute (tr/min) = 2π/60 rad/s.")),
  exTitle:{en:"A ceiling fan with two painted dots",fr:"Un ventilateur de plafond avec deux points peints"},
  exText:{en:"One dot is near the centre, one at the blade tip. Change the rotation rate and the blade length and compare the two dots.",fr:"Un point est près du centre, l'autre au bout de la pale. Change la vitesse de rotation et la longueur de la pale et compare les deux points."},
  H:300,
  ctrl:()=>slider("cf","Rotation rate","Vitesse de rotation",6,120,6,30)+slider("cR","Blade length R","Longueur de pale R",0.2,1,0.1,0.6)+
    `<div class="readout"><div><small>ω</small><b id="rw">—</b></div><div><small>T</small><b id="rT">—</b></div><div><small>f</small><b id="rf">—</b></div><div><small>${tx2("v tip / v inner","v bout / v intérieur")}</small><b id="rv">—</b></div></div>`,
  run:()=>{const I=id=>+$("#"+id).value;let th=0,raf,last=performance.now();
    const redraw=canvasSetup("skc",300,(ctx,W,H)=>{const rpm=I("cf"),R=I("cR"),w=rpm*2*Math.PI/60,T=2*Math.PI/w,f=1/T,Rin=R/3;
      ctx.fillStyle=css("--surface");ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2,Rp=(Math.min(W,H)/2-30)*R;
      ctx.strokeStyle=css("--line");ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(cx,cy,Rp,0,7);ctx.arc(cx,cy,Rp/3,0,7);ctx.stroke();ctx.setLineDash([]);
      for(let k=0;k<3;k++){const a=th+k*2*Math.PI/3;ctx.save();ctx.translate(cx,cy);ctx.rotate(a);ctx.fillStyle=css("--muted");roundRect(ctx,0,-8,Rp,16,8);ctx.fill();ctx.restore();}
      ctx.fillStyle=css("--ink");ctx.beginPath();ctx.arc(cx,cy,10,0,7);ctx.fill();
      const pt=(r,col)=>{const x=cx+r*Math.cos(th),y=cy+r*Math.sin(th);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();return [x,y];};
      const [x1,y1]=pt(Rp,css("--bad")),[x2,y2]=pt(Rp/3,css("--primary"));const tx=-Math.sin(th),ty=Math.cos(th);
      arrowL(ctx,x1,y1,x1+tx*60,y1+ty*60,css("--bad"));arrowL(ctx,x2,y2,x2+tx*20,y2+ty*20,css("--primary"));
      ctx.fillStyle=css("--muted");ctx.font="12px "+css("--sans");ctx.fillText(tx2("same ω, different v","même ω, v différentes"),12,18);ctx.fillText(`${rpm} ${tx2("turns/min","tr/min")}`,12,H-12);
      $("#cfV").textContent=rpm+" rpm";$("#cRV").textContent=nf(R,1)+" m";$("#rw").textContent=nf(w)+" rad/s";$("#rT").textContent=nf(T)+" s";$("#rf").textContent=nf(f)+" Hz";$("#rv").textContent=`${nf(R*w,1)} / ${nf(Rin*w,1)} m/s`;});
    setupSliders(["cf","cR"],redraw);
    function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;th+=I("cf")*2*Math.PI/60*dt*0.25;redraw();raf=requestAnimationFrame(tick);}
    raf=requestAnimationFrame(tick);const prev=stopAnim;stopAnim=()=>{cancelAnimationFrame(raf);prev&&prev();};},
  example:()=>`<p>${tx2("A desk fan turns at <b>1 200 turns per minute</b>. Its blade tip is <b>R = 0.2 m</b> from the axis.","Un ventilateur de bureau tourne à <b>1 200 tours par minute</b>. Le bout de sa pale est à <b>R = 0,2 m</b> de l'axe.")}</p>
    <ol style="margin:0;padding-left:20px;display:grid;gap:6px"><li>${tx2("Frequency: f = 1 200 ÷ 60 = <b>20 Hz</b>.","Fréquence : f = 1 200 ÷ 60 = <b>20 Hz</b>.")}</li><li>${tx2("Period: T = 1/f = <b>0.05 s</b>.","Période : T = 1/f = <b>0,05 s</b>.")}</li><li>${tx2("Angular speed: ω = 2πf ≈ <b>126 rad/s</b>.","Vitesse angulaire : ω = 2πf ≈ <b>126 rad/s</b>.")}</li><li>${tx2("Tip speed: v = R·ω ≈ 0.2 × 126 ≈ <b>25 m/s</b> (about 90 km/h).","Vitesse du bout : v = R·ω ≈ 0,2 × 126 ≈ <b>25 m/s</b> (environ 90 km/h).")}</li><li>${tx2("Normal acceleration at the tip: a_n = R·ω² ≈ <b>3 200 m/s²</b>, more than 300 times g.","Accélération normale au bout : a_n = R·ω² ≈ <b>3 200 m/s²</b>, plus de 300 fois g.")}</li></ol>`,
  quiz:[
    {q:{en:"A wheel turns at f = 2 Hz. What is its period?",fr:"Une roue tourne à f = 2 Hz. Quelle est sa période ?"},o:["2 s","0.5 s","4π s","π s"],c:1,why:{en:"T = 1/f = 0.5 s.",fr:"T = 1/f = 0,5 s."}},
    {q:{en:"A merry-go-round makes one turn in T = 4 s. What is its angular speed?",fr:"Un manège fait un tour en T = 4 s. Quelle est sa vitesse angulaire ?"},o:["4 rad/s","1.57 rad/s","0.25 rad/s","8π rad/s"],c:1,why:{en:"ω = 2π/T = π/2 ≈ 1.57 rad/s.",fr:"ω = 2π/T = π/2 ≈ 1,57 rad/s."}},
    {q:{en:"A wheel of radius 0.3 m turns at ω = 20 rad/s. What is the speed of a point on its rim?",fr:"Une roue de rayon 0,3 m tourne à ω = 20 rad/s. Quelle est la vitesse d'un point de sa jante ?"},o:["60 m/s","6 m/s","0.015 m/s","66.7 m/s"],c:1,why:{en:"v = R·ω = 0.3 × 20 = 6 m/s.",fr:"v = R·ω = 0,3 × 20 = 6 m/s."}},
    {q:{en:"Two children sit on a merry-go-round, one near the centre and one at the edge. Which statement is true?",fr:"Deux enfants sont sur un manège, l'un près du centre, l'autre au bord. Quelle affirmation est vraie ?"},o:[{en:"Same speed, different ω",fr:"Même vitesse, ω différentes"},{en:"Same ω, the child at the edge is faster",fr:"Même ω, l'enfant au bord va plus vite"},{en:"Same ω and same speed",fr:"Même ω et même vitesse"},{en:"The child at the centre is faster",fr:"L'enfant au centre va plus vite"}],c:1,why:{en:"The whole merry-go-round turns with one ω, and v = R·ω grows with R.",fr:"Tout le manège tourne avec une seule ω, et v = R·ω augmente avec R."}}
  ],
  think:{en:"The Earth turns once a day. In Beirut you are carried at about 1,390 km/h, yet you feel perfectly still. Link this to Lesson 1: is your motion real?",fr:"La Terre fait un tour par jour. À Beyrouth, tu es emporté à environ 1 390 km/h, et pourtant tu te sens parfaitement immobile. Relie cela à la leçon 1 : ton mouvement est-il réel ?"},
  thinkAr:"تدور الأرض دورة كلّ يوم. في بيروت تُحمل بسرعة نحو ١٣٩٠ كم/س، ومع ذلك تشعر بأنّك ساكن تمامًا. هل حركتك حقيقية؟",
  next:"L3",nextLabel:{en:"Next: Chapter 8, Lesson 3",fr:"Suite : Chapitre 8, Leçon 3"}};

function approachHTML(tx){return `<section class="card approach"><span class="kicker">${tx("Our approach","Notre approche")}</span>
  <h2 style="margin:4px 0">${tx("Physics knowledge as the result of inquiry","Le savoir physique comme résultat d'une enquête")}</h2>
  <p>${tx("Sabab treats physics knowledge as models built from evidence: discussed, situated in history, and open to revision. It is not a set of truths to recite.","Sabab traite le savoir physique comme des modèles construits à partir de preuves : discutés, situés dans l'histoire et révisables. Ce n'est pas un ensemble de vérités à réciter.")}</p>
  <ul>
    <li><b>${tx("Other ways of seeing.","D'autres façons de voir.")}</b> ${tx("In each lesson, students meet competing explanations of the same phenomenon, from classmates and from the history of science (Aristotle, Ibn Sina, Newton, Mach…).","Dans chaque leçon, les élèves rencontrent des explications concurrentes d'un même phénomène, venant des camarades et de l'histoire des sciences (Aristote, Ibn Sina, Newton, Mach…).")}</li>
    <li><b>${tx("Friction between interpretations.","La friction entre interprétations.")}</b> ${tx("After taking a position, students answer the strongest argument from the other side. The disagreement becomes a resource for examining their own assumptions.","Après avoir pris position, les élèves répondent à l'argument le plus fort du camp opposé. Le désaccord devient une ressource pour examiner leurs propres présupposés.")}</li>
    <li><b>${tx("A changing relationship to knowledge.","Un rapport au savoir qui change.")}</b> ${tx("Students write their position before and after each lesson and what changed. The goal is not a new opinion, but a new way of knowing: understanding they can build, test and revise.","Les élèves écrivent leur position avant et après chaque leçon, et ce qui a changé. Le but n'est pas une nouvelle opinion, mais une nouvelle manière de connaître : un savoir qu'ils peuvent construire, tester et réviser.")}</li>
  </ul>
  <p class="muted" style="font-size:.9rem;margin:0">${tx("The approach draws on research on philosophical dialogue in the physics classroom: epistemic alterity, epistemic friction and the relationship to knowledge (rapport au savoir).","L'approche s'appuie sur la recherche sur le dialogue philosophique en classe de physique : altérité épistémique, friction épistémique et rapport au savoir.")}</p></section>`;}

  add({kind:"page",id:"glossary",title:L({en:"Glossary of physics terms",fr:"Glossaire des termes de physique"}),alt:"glossary glossaire definitions définitions قاموس مصطلحات",body:"",meta:`${GLOSSARY.length} ${L({en:"terms · English, French, Arabic",fr:"termes · anglais, français, arabe"})}`,go:()=>go("glossary")});
  add({kind:"page",id:"waitlist",title:L({en:"Become a Sabab pioneer",fr:"Deviens un pionnier de Sabab"}),alt:"waitlist pioneer pionnier روّاد liste d'attente inscription sign up early access",body:"",meta:L({en:"Get new lessons first",fr:"Recevoir les nouvelles leçons en premier"}),go:()=>goWaitlist()});
  GLOSSARY.forEach((g,i)=>{g.keys=[g.en,g.fr,g.ar,...(g.al||[])].map(snorm);g.i=i;});
  SIDX=items;
}
function searchRun(q){
  if(!SIDX)buildSearchIndex();
  const nq=snorm(q); if(!nq) return {gl:[],res:[]};
  const all=nq.split(" ").filter(Boolean).map(stripAl); let toks=all.filter(t=>t.length>=2&&/\p{L}/u.test(t)); if(!toks.length)toks=all;
  const hit=(hay)=>toks.every(t=>hay.includes(t));
  const hitAll=(hay)=>all.every(t=>hay.includes(t));
  const wordHit=(hay)=>{const h=" "+hay+" ";return toks.every(t=>h.includes(" "+t+" ")||h.includes(" ال"+t)||h.includes(" "+t+"s "));};
  // glossary
  const gl=GLOSSARY.map(g=>{let s=0;g.keys.forEach(k=>{if(k===nq)s=Math.max(s,100);else if(k.startsWith(nq))s=Math.max(s,60);else if(hitAll(k))s=Math.max(s,40);});return {g,s};}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
  const refIds=new Set();gl.forEach(x=>x.g.r.forEach(r=>refIds.add(r[0])));
  const strong=gl.length&&gl[0].s>=60;
  const res=SIDX.map(it=>{if(!hit(it.hay))return null;if(strong&&!refIds.has(it.id)&&!hit(it.ht)&&!wordHit(it.hay))return null;let s=10;if(hit(it.ht))s+=30;if(snorm(it.title).startsWith(nq))s+=20;if(refIds.has(it.id))s+=25;if(it.kind==="lesson")s+=5;if(it.locked)s-=4;return {it,s};}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,12);
  // add glossary refs that didn't match by text
  gl.forEach(x=>x.g.r.forEach(r=>{if(!res.some(y=>y.it.id===r[0])){const it=SIDX.find(z=>z.id===r[0]);if(it)res.push({it,s:x.s>=60?70:1});}}));
  res.sort((a,b)=>b.s-a.s);
  return {gl,res:res.slice(0,12)};
}
const SKIND={lesson:{en:"Lesson",fr:"Leçon"},skill:{en:"Skill builder",fr:"Atelier"},beyond:{en:"Beyond",fr:"Au-delà"},story:{en:"Story",fr:"Récit"},library:{en:"Library",fr:"Bibliothèque"},thinker:{en:"Thinker",fr:"Penseur"},guide:{en:"Teacher guide",fr:"Guide enseignant"},page:{en:"Page",fr:"Page"}};
function glossCardHTML(g,compact){
  const refs=g.r.map((r,j)=>{const ri=refInfo(r);return `<button class="gref" data-gref="${g.i}:${j}">${ri.label}${ri.locked?` · 🔒`:""} →</button>`;}).join("");
  return `<article class="gcardx"><div class="gh"><b>${S.lang==="fr"?g.fr:g.en}</b><span class="muted">${S.lang==="fr"?g.en:g.fr}</span><span class="ar" lang="ar" dir="rtl">${g.ar}</span></div><p>${L(g.d)}</p><div class="grefs"><span class="muted" style="font-size:.8rem">${L({en:"Revise it in",fr:"Réviser dans"})}</span>${refs}</div></article>`;
}
function bindGlossRefs(root,after){root.querySelectorAll("[data-gref]").forEach(b=>b.onclick=()=>{const [gi,j]=b.dataset.gref.split(":").map(Number);const r=GLOSSARY[gi].r[j];if(after)after();try{window.goatcounter&&goatcounter.count({path:"search/"+GLOSSARY[gi].en.toLowerCase().replace(/\s+/g,"-"),title:"Glossary click",event:true});}catch(e){}refInfo(r).go();});}
let searchEl=null;
function openSearch(initial){
  if(searchEl){searchEl.querySelector("#sq").focus();return;}
  searchEl=document.createElement("div");searchEl.className="sov";searchEl.setAttribute("role","dialog");searchEl.setAttribute("aria-modal","true");searchEl.setAttribute("aria-label",L({en:"Search Sabab",fr:"Rechercher dans Sabab"}));
  const sug=["inertia","friction","centre of mass","F = ma","القصور الذاتي","énergie cinétique","Ibn al-Haytham","pendulum"];
  searchEl.innerHTML=`<div class="spanel"><div class="sbar"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="sq" type="search" autocomplete="off" spellcheck="false" placeholder="${L({en:"Search a concept, lesson or story · EN · FR · عربي",fr:"Chercher une notion, une leçon, un récit · FR · EN · عربي"})}" aria-label="${L({en:"Search",fr:"Rechercher"})}">
    <button class="sclose" id="sClose" aria-label="${L({en:"Close",fr:"Fermer"})}">Esc</button></div>
    <div class="sres" id="sRes"></div>
    <div class="sfoot"><button class="linkbtn" id="sGloss">${L({en:"Browse the glossary",fr:"Parcourir le glossaire"})} (${GLOSSARY.length}) →</button><span class="muted">↑ ↓ ${L({en:"to move",fr:"pour naviguer"})} · Enter · Esc</span></div></div>`;
  document.body.appendChild(searchEl);document.body.style.overflow="hidden";
  const inp=searchEl.querySelector("#sq"),box=searchEl.querySelector("#sRes");let sel=-1,last=[];
  const close=()=>{if(!searchEl)return;searchEl.remove();searchEl=null;document.body.style.overflow="";document.removeEventListener("keydown",onKey,true);};
  const pick=(it)=>{close();try{window.goatcounter&&goatcounter.count({path:"search/"+it.kind+"/"+it.id,title:"Search click",event:true});}catch(e){}it.go();};
  const draw=()=>{const q=inp.value;
    if(!q.trim()){box.innerHTML=`<p class="shint">${L({en:"Try:",fr:"Essaie :"})} ${sug.map(s=>`<button class="schip" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</p>`;
      box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{inp.value=b.dataset.s;draw();inp.focus();});last=[];sel=-1;return;}
    const {gl,res}=searchRun(q);last=res.map(x=>x.it);sel=last.length?0:-1;
    if(!gl.length&&!res.length){box.innerHTML=`<p class="shint">${L({en:"Nothing found for",fr:"Rien trouvé pour"})} « ${esc(q)} ». ${L({en:"Try another word, in English, French or Arabic, or browse the glossary.",fr:"Essaie un autre mot, en français, en anglais ou en arabe, ou parcours le glossaire."})}</p>`;return;}
    box.innerHTML=(gl.length?`<div class="sgl">${gl.map(x=>glossCardHTML(x.g)).join("")}</div>`:"")+
      (res.length?`<ul class="slist" role="listbox">${res.map((x,i)=>`<li><button class="sitem" role="option" data-i="${i}" aria-selected="${i===sel}"><span class="skind">${L(SKIND[x.it.kind])}</span><span class="stitle">${esc(x.it.title)}${x.it.locked?` <span class="chip">${L({en:"In review",fr:"En relecture"})}</span>`:""}</span><span class="smeta">${esc(x.it.meta||"")}</span></button></li>`).join("")}</ul>`:"");
    box.querySelectorAll(".sitem").forEach(b=>b.onclick=()=>pick(last[+b.dataset.i]));
    bindGlossRefs(box,close);
  };
  const mark=()=>{box.querySelectorAll(".sitem").forEach((b,i)=>{b.setAttribute("aria-selected",i===sel);if(i===sel)b.scrollIntoView({block:"nearest"});});};
  const onKey=(e)=>{if(e.key==="Escape"){e.preventDefault();close();}
    else if(e.key==="ArrowDown"&&last.length){e.preventDefault();sel=(sel+1)%last.length;mark();}
    else if(e.key==="ArrowUp"&&last.length){e.preventDefault();sel=(sel-1+last.length)%last.length;mark();}
    else if(e.key==="Enter"&&document.activeElement===inp&&sel>=0&&last[sel]){e.preventDefault();pick(last[sel]);}};
  document.addEventListener("keydown",onKey,true);
  inp.addEventListener("input",draw);
  searchEl.addEventListener("click",e=>{if(e.target===searchEl)close();});
  searchEl.querySelector("#sClose").onclick=close;
  searchEl.querySelector("#sGloss").onclick=()=>{close();go("glossary");};
  if(initial)inp.value=initial; draw(); setTimeout(()=>inp.focus(),30);
}
function renderGlossary(){
  const tx=(en,fr)=>S.lang==="fr"?fr:en;
  const chs=[...new Set(GLOSSARY.map(g=>g.ch))];
  GLOSSARY.forEach((g,i)=>g.i=i);
  $("#main").innerHTML=`<section class="hero" style="padding-block:8px 0">
    <span class="kick">${tx("Revise · Grade 11 mechanics","Réviser · mécanique de Première")}</span>
    <h1 style="max-width:24ch;font-size:clamp(1.8rem,4vw,2.6rem)">${tx("Glossary","Glossaire")}</h1>
    <p class="lede">${tx(`${GLOSSARY.length} physics terms in English, French and Arabic, each with a short definition and the lesson where you can revise it.`,`${GLOSSARY.length} termes de physique en français, anglais et arabe, chacun avec une courte définition et la leçon où le réviser.`)}</p>
    <div class="row"><button class="btn" id="gSearch">${tx("Search a term","Chercher un terme")}</button></div></section>
  <div style="display:grid;gap:28px">${chs.map(ch=>`<section class="gsec"><h2>${L(GLOSS_CH[ch])}</h2><div class="gcols">${GLOSSARY.filter(g=>g.ch===ch).map(g=>glossCardHTML(g)).join("")}</div></section>`).join("")}</div>`;
  $("#gSearch").onclick=()=>openSearch();
  bindGlossRefs($("#main"));
}
document.addEventListener("keydown",e=>{if(e.key==="/"&&!searchEl&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")&&!(document.activeElement&&document.activeElement.isContentEditable)){e.preventDefault();openSearch();}});
(function(){const b=document.getElementById("vSearch");if(b)b.onclick=()=>openSearch();})();

render();
})();
</script>
